<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Shape Snaps &amp; And Sentences ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Shapes &amp; And">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 52%, #2e1065 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.1rem, 3.2vmin, 1.7rem); font-weight: 800; }
  .lead .w { color: #fde047; }

  /* ---------- Shape drawings (from 3D Shape Hunt) ---------- */
  .shape svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .shape svg .f1 { fill: #fef3c7; }
  .shape svg .f2 { fill: #fbbf24; }
  .shape svg .f3 { fill: #d97706; }
  .shape svg path, .shape svg rect, .shape svg circle, .shape svg ellipse, .shape svg polygon, .shape svg polyline, .shape svg line {
    stroke: #78350f; stroke-width: 2.2; stroke-linejoin: round;
  }
  .shape svg .hl { fill: #fff; opacity: .7; stroke: none; }
  .shape svg .dash { fill: none; stroke-dasharray: 4 4; opacity: .55; }

  /* ---------- The camera: one thing from the house ---------- */
  #camera {
    position: relative;
    width: clamp(150px, 38vmin, 260px);
    height: clamp(150px, 38vmin, 260px);
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 8px 0 rgba(0,0,0,.28);
    display: grid;
    place-items: center;
    cursor: pointer;
    border: 6px solid #1e293b;
  }
  #camera::before, #camera::after {
    content: ''; position: absolute; width: 28px; height: 28px;
    border: 5px solid #a78bfa; pointer-events: none;
  }
  #camera::before { top: 10px; left: 10px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  #camera::after { bottom: 10px; right: 10px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
  #thing { font-size: clamp(80px, 22vmin, 160px); line-height: 1; }
  #thing.snap { animation: bounceIn .6s ease; }
  #camTag {
    position: absolute; top: -16px; right: -16px;
    font-size: clamp(1.6rem, 5vmin, 2.4rem);
    background: #1e293b; border-radius: 50%;
    width: 1.8em; height: 1.8em; display: grid; place-items: center;
  }
  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 50;
  }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* ---------- Answer cards ---------- */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 16px);
    justify-content: center;
    max-width: 760px;
  }
  .card {
    position: relative;
    background: #fff;
    color: #1e293b;
    border-radius: 20px;
    border-bottom: 7px solid rgba(0,0,0,.28);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 800;
  }
  .card:active { transform: translateY(4px); border-bottom-width: 3px; }
  .card.wrong { background: #fecaca; animation: shake .4s ease; }
  .card.right { background: #bbf7d0; }
  .card.glow { box-shadow: 0 0 0 6px #fde047; animation: pulse 1.1s ease infinite; }
  .card.used { visibility: hidden; }
  .card .say {
    position: absolute; top: -12px; right: -12px;
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid #fff; background: #7c3aed; color: #fff;
    font-size: 1.2rem; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
  }
  .shapeCard {
    width: clamp(96px, 27vw, 170px);
    height: clamp(110px, 30vw, 190px);
    padding: 10px 8px 8px;
  }
  .shapeCard .shape { width: 72%; flex: 1; min-height: 0; }
  .shapeCard .name { font-size: clamp(.85rem, 2.6vmin, 1.2rem); }
  .partCard {
    width: clamp(100px, 28vw, 210px);
    min-height: clamp(110px, 18vh, 160px);
    padding: 12px 8px;
  }
  .partCard .emo, .slot .emo { font-size: clamp(2.4rem, 8vmin, 3.6rem); line-height: 1.1; }
  .partCard .txt, .slot .txt { font-size: clamp(.85rem, 2.3vmin, 1.1rem); line-height: 1.25; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ---------- Photo album ---------- */
  #album {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    min-height: 64px; max-width: 760px;
    padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.22);
  }
  #album .empty { opacity: .5; font-weight: 700; align-self: center; }
  .photo {
    width: 56px; height: 56px; background: #fff; border-radius: 6px;
    border: 4px solid #fff; border-bottom-width: 12px;
    display: grid; place-items: center; font-size: 30px;
    box-shadow: 0 3px 6px rgba(0,0,0,.35);
    transform: rotate(-4deg);
    animation: bounceIn .6s ease;
  }
  .photo:nth-child(even) { transform: rotate(4deg); }

  /* ---------- Sentence board ---------- */
  #sentence {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    justify-content: center;
    gap: clamp(8px, 2vmin, 14px);
    padding: clamp(10px, 2vmin, 16px);
    border-radius: 24px;
    background: rgba(0,0,0,.22);
    max-width: 820px;
  }
  .slot {
    width: clamp(96px, 28vw, 230px);
    min-height: clamp(110px, 18vh, 160px);
    border-radius: 20px;
    border: 4px dashed rgba(255,255,255,.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 10px; cursor: pointer;
    font-weight: 800;
  }
  .slot .q { font-size: clamp(2rem, 7vmin, 3rem); opacity: .7; }
  .slot.next { border-color: #fde047; animation: pulse 1.2s ease infinite; }
  .slot.full { background: #fff; color: #1e293b; border: 4px solid #fff; animation: bounceIn .5s ease; }
  #andBtn {
    align-self: center;
    font-family: inherit;
    font-size: clamp(1.6rem, 6vmin, 2.6rem);
    font-weight: 900;
    color: #78350f;
    background: #fde68a;
    border: none;
    border-bottom: 7px solid rgba(0,0,0,.28);
    border-radius: 999px;
    padding: clamp(12px, 2.4vmin, 20px) clamp(18px, 4vmin, 30px);
    cursor: pointer;
    opacity: .55;
  }
  #andBtn.ready { opacity: 1; background: #facc15; box-shadow: 0 0 0 6px rgba(253,224,71,.6); animation: pulse 1s ease infinite; }
  #andBtn.joined { opacity: 1; background: #facc15; }
  #sentence.joined { background: rgba(34,197,94,.35); box-shadow: 0 0 0 5px #4ade80; }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #8b5cf6, #6d28d9);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Board (half time / full time) ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 760px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .chip .mini { width: 40px; height: 40px; display: inline-block; }
  .chip .and { color: #b45309; }
  .chip small { font-size: .65em; font-weight: 700; opacity: .7; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay .pics { font-size: clamp(2.2rem, 8vmin, 3.6rem); letter-spacing: .1em; }
  #startOverlay p { max-width: 30ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Shape snaps &amp; and sentences</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="camera" class="hidden" role="button" aria-label="Say it again">
    <span id="thing"></span>
    <span id="camTag">📷</span>
  </div>
  <div id="shapeCards" class="cards hidden"></div>
  <div id="album" class="hidden"></div>

  <div id="sentence" class="hidden">
    <div class="slot" id="slotA"></div>
    <button id="andBtn" type="button">and</button>
    <div class="slot" id="slotB"></div>
  </div>
  <div id="partCards" class="cards hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="flash"></div>

<div id="startOverlay">
  <h2>⚽ Shape snaps &amp; and sentences ⚽</h2>
  <div class="pics">📷🥫🎲 · 👸➕🏰</div>
  <p>First half: a 3D shape hunt around the house — snap a picture of every shape.<br>Second half: build Rapunzel sentences using “and”.</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Schulmail Fri, 06 Nov 2026: Homework this week.
     Mathematics - Seesaw: "We have been looking at 3D shapes. Please complete
       the activity on Seesaw by going on a shape hunt and taking pictures of
       3D shapes around your home."
     English - paper: "We have been looking at our new text, Rapunzel. Please
       complete the worksheet on building fairytale sentences using 'and'."

     First half (maths, shape hunt): one thing from around the home sits in
     the camera (a tin, a dice, an orange ...). He hears "Here is a tin. What
     3D shape is it?" and taps one of three shape drawings (cube, cuboid,
     sphere, cylinder, cone, pyramid; often with a look-alike next to it).
     Right: the camera flashes, the photo drops into the album and "Snap!
     Goal! The tin is a cylinder." Wrong: "That is a cone. Try again."; a
     second miss lights the right shape. The 🔊 on a card says its name.
     Second half (English, sentences with "and"): he hears a Rapunzel
     sentence ("Rapunzel has long golden hair and she sings a sweet song."),
     then builds it from picture cards: the first part, then the part that
     comes after "and" (one card is from another sentence), and at the end
     he taps the big golden "and" to join the two parts into one sentence.
     One football ⚽ for every shape snapped and every sentence built. */

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '📸', '👸'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so the phrase list for the clips can be generated straight out of
     this block (tools/gen-phrases.js). */

  var SHAPE_ROUNDS = 6;
  var SENT_ROUNDS = 6;

  var NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
             'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

  var SHAPES = ['cube', 'cuboid', 'sphere', 'cylinder', 'cone', 'pyramid'];

  /* things around the home (no pyramid: there is no good one at home) */
  var OBJECTS = [
    { id: 'dice',     e: '🎲', name: 'dice',           shape: 'cube' },
    { id: 'ice',      e: '🧊', name: 'ice cube',       shape: 'cube' },
    { id: 'present',  e: '🎁', name: 'present',        shape: 'cube' },
    { id: 'box',      e: '📦', name: 'box',            shape: 'cuboid' },
    { id: 'brick',    e: '🧱', name: 'brick',          shape: 'cuboid' },
    { id: 'juice',    e: '🧃', name: 'juice box',      shape: 'cuboid' },
    { id: 'football', e: '⚽', name: 'football',       shape: 'sphere' },
    { id: 'orange',   e: '🍊', name: 'orange',         shape: 'sphere' },
    { id: 'basket',   e: '🏀', name: 'basketball',     shape: 'sphere' },
    { id: 'tin',      e: '🥫', name: 'tin',            shape: 'cylinder' },
    { id: 'loo',      e: '🧻', name: 'toilet roll',    shape: 'cylinder' },
    { id: 'candle',   e: '🕯️', name: 'candle',         shape: 'cylinder' },
    { id: 'icecream', e: '🍦', name: 'ice cream cone', shape: 'cone' },
    { id: 'popper',   e: '🎉', name: 'party popper',   shape: 'cone' }
  ];

  /* fairytale sentences from Rapunzel, two parts joined with "and" */
  var SENTENCES = [
    { id: 'hair',   ea: '👱‍♀️', a: 'Rapunzel has long golden hair', eb: '🎶', b: 'she sings a sweet song' },
    { id: 'witch',  ea: '🧙‍♀️', a: 'the witch is mean',            eb: '🔒', b: 'she locks Rapunzel in the tower' },
    { id: 'tower',  ea: '🏰', a: 'the tower is very tall',       eb: '🚪', b: 'it has no door' },
    { id: 'prince', ea: '🤴', a: 'the prince rides his horse',   eb: '👂', b: 'he hears Rapunzel sing' },
    { id: 'climb',  ea: '💇‍♀️', a: 'Rapunzel lets down her hair',  eb: '🧗', b: 'the prince climbs up' },
    { id: 'lonely', ea: '😢', a: 'Rapunzel is lonely',           eb: '🪟', b: 'she looks out of the window' },
    { id: 'horse',  ea: '🐴', a: 'the horse is white',           eb: '💨', b: 'it runs very fast' },
    { id: 'happy',  ea: '💑', a: 'the prince finds Rapunzel',    eb: '🎉', b: 'they live happily ever after' }
  ];

  function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function an(word) { return /^[aeiou]/i.test(word) ? 'an ' : 'a '; }

  /* ---- first half: the shape hunt ---- */
  var INTRO_SAY = 'Hello Jack! We have been looking at 3D shapes. ' +
    'Let us go on a shape hunt around your home. ' +
    'Tap the 3D shape of each thing, and we take a picture!';
  var TRY_AGAIN_SAY = 'Try again.';

  function objAskSay(o) { return 'Here is ' + an(o.name) + o.name + '. What 3D shape is it?'; }
  function objIsSay(o) { return 'The ' + o.name + ' is ' + an(o.shape) + o.shape + '.'; }
  function shapeNameSay(s) { return cap(s) + '.'; }
  function notShapeSay(s) { return 'That is ' + an(s) + s + '.'; }
  function wrongShapeSay(s, o, hint) {
    return notShapeSay(s) + ' ' + (hint ? 'Look! ' + objIsSay(o) : TRY_AGAIN_SAY);
  }
  function goalShapeSay(o) { return 'Snap! Goal! ' + objIsSay(o); }

  function halfTimeSay(n) {
    return 'Half time! You took pictures of ' + NUM[n] + (n === 1 ? ' 3D shape.' : ' 3D shapes.') +
           ' Look at your pictures!';
  }

  /* ---- second half: fairytale sentences using "and" ---- */
  var SECOND_SAY = 'Second half! We have been looking at Rapunzel. ' +
    'Build fairytale sentences using and. ' +
    'And joins two parts into one sentence.';
  var AND_INFO_SAY = 'And joins two parts into one sentence.';
  var NEXT_PART_SAY = 'Yes! Now, what comes after and?';
  var AFTER_SAY = 'That part comes after and. What comes first?';
  var NOT_PART_SAY = 'Not that part.';
  var LOOK_PART_SAY = 'Look! This part fits.';
  var JOIN_SAY = 'Yes! Now tap the word and.';

  function sentenceOf(s) { return cap(s.a) + ' and ' + s.b + '.'; }
  function partSay(p) { return cap(p) + '.'; }
  function listenSay(s) { return 'Listen. ' + sentenceOf(s) + ' Build the sentence!'; }
  function wrongPartSay(hint) { return NOT_PART_SAY + ' ' + (hint ? LOOK_PART_SAY : TRY_AGAIN_SAY); }
  function goalSentSay(s) { return 'Goal! ' + sentenceOf(s); }

  function fullTimeSay(n) {
    return 'Full time! You built ' + NUM[n] + (n === 1 ? ' sentence' : ' sentences') +
           ' using and. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }

      filled++;
      attempts = 0;
      if (filled === 1) {
        markNextSlot();
        speak(NEXT_PART_SAY);
      } else {
        mode = 'sentJoin';
        markNextSlot();
        els.lead.innerHTML = 'Now tap <span class="w">and</span> to join them!';
        speak(JOIN_SAY);
      }
      return;
    }
    shake(card);
    attempts++;
    var hint = attempts >= 2;
    if (hint) glowPart(need);
    if (p.key === 'b' && need === 'a') speak(AFTER_SAY);
    else speak(wrongPartSay(hint));
  }

  function tapAnd() {
    if (mode === 'start' || mode === 'board' || busy) return;
    stopAll();
    if (mode === 'sentJoin') {
      mode = 'sentDone';
      els.andBtn.classList.remove('ready');
      els.andBtn.classList.add('joined');
      els.sentence.classList.add('joined');
      built.push(item.s);
      scoreGoal();
      els.lead.innerHTML = 'GOAL! ⚽ One sentence with <span class="w">and</span>';
      els.nextBtn.textContent = nextLabel();
      show(['lead', 'sentence', 'partCards', 'btnRow'], ['sayBtn', 'nextBtn']);
      speak(goalSentSay(item.s));
      return;
    }
    if (mode === 'sentDone') { speak(sentenceOf(item.s)); return; }
    speak(AND_INFO_SAY);
  }

  function tapSlot(which) {
    if (mode !== 'sent' && mode !== 'sentJoin' && mode !== 'sentDone') return;
    stopAll();
    var placed = which === 'a' ? filled >= 1 : filled >= 2;
    if (placed) speak(partSay(which === 'a' ? item.s.a : item.s.b));
    else speak(listenSay(item.s));
  }

  /* ================= Moving on ================= */
  function nextRound() {
    stopAll();
    round++;
    if (phase === 'shape') {
      if (round >= SHAPE_ROUNDS) enterHalfTime(); else enterShape();
    } else {
      if (round >= SENT_ROUNDS) enterFullTime(); else enterSent();
    }
  }

  function sayAgain() {
    if (!item) return;
    stopAll();
    if (mode === 'shape') speak(objAskSay(item.o));
    else if (mode === 'shapeDone') speak(objIsSay(item.o));
    else if (mode === 'sent') speak(listenSay(item.s));
    else if (mode === 'sentJoin') speak(JOIN_SAY);
    else if (mode === 'sentDone') speak(sentenceOf(item.s));
  }

  /* ================= Board ================= */
  function boardLines() {
    return boardKind === 'half'
      ? snapped.map(function (o) { return objIsSay(o); })
      : built.map(function (s) { return sentenceOf(s); });
  }

  function renderBoard() {
    els.board.innerHTML = '';
    var lines = boardLines();
    lines.forEach(function (line, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      if (boardKind === 'half') {
        var o = snapped[i];
        b.innerHTML = '<span>' + o.e + '</span><span class="mini shape">' + shapeSVG(o.shape) +
          '</span><small>' + o.shape + '</small>';
      } else {
        var s = built[i];
        b.innerHTML = '<span>' + s.ea + '</span><span class="and">and</span><span>' + s.eb + '</span>';
      }
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(boardLines()[i], function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    boardLines().forEach(function (line, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: line
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    stopAll();
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    boardKind = 'half';
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = '📷 ' + snapped.length + ' pictures of 3D shapes · Next: sentences with “and”';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(snapped.length));
  }

  function enterFullTime() {
    mode = 'board';
    boardKind = 'full';
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = (snapped.length + built.length) + ' ⚽ · ' + built.length + ' sentences with “and”';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(built.length));
  }

  /* ================= Match ================= */
  function buildQueues() {
    /* every home shape once, plus one more, each with a random thing */
    var hunt = ['cube', 'cuboid', 'sphere', 'cylinder', 'cone'];
    var shapes = hunt.concat([pickOne(hunt)]);
    var used = {};
    shapeQueue = shuffle(shapes).map(function (s) {
      var pool = OBJECTS.filter(function (o) { return o.shape === s && !used[o.id]; });
      var o = pickOne(pool);
      used[o.id] = 1;
      var others = SHAPES.filter(function (x) { return x !== s; });
      var pick = [];
      if (Math.random() < 0.6 && LOOKALIKE[s]) pick.push(LOOKALIKE[s]);
      shuffle(others).forEach(function (x) { if (pick.length < 2 && pick.indexOf(x) === -1) pick.push(x); });
      return { o: o, choices: shuffle([s].concat(pick)) };
    });

    var chosen = shuffle(SENTENCES).slice(0, SENT_ROUNDS);
    sentQueue = chosen.map(function (s) {
      var other = pickOne(SENTENCES.filter(function (x) { return x.id !== s.id; }));
      var wrongIsB = Math.random() < 0.6;
      var cards = [
        { key: 'a', text: s.a, e: s.ea },
        { key: 'b', text: s.b, e: s.eb },
        { key: 'x', text: wrongIsB ? other.b : other.a, e: wrongIsB ? other.eb : other.ea }
      ];
      return { s: s, cards: shuffle(cards) };
    });
  }

  function startMatch() {
    stopAll();
    buildQueues();
    snapped = [];
    built = [];
    phase = 'shape';
    round = 0;
    enterShape();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.camera.addEventListener('click', sayAgain);
  els.andBtn.addEventListener('click', tapAnd);
  els.slotA.addEventListener('click', function () { tapSlot('a'); });
  els.slotB.addEventListener('click', function () { tapSlot('b'); });
  els.sayBtn.addEventListener('click', sayAgain);
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (boardKind === 'half') { phase = 'sent'; round = 0; enterSent(); }
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
