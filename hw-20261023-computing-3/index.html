<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>My Project Today ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="My Project">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #134e4a 0%, #0f766e 52%, #134e4a 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.4vh, 24px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.15rem, 3.4vmin, 1.8rem); font-weight: 800; max-width: 26ch; }
  .lead b { color: #fde047; }

  /* ---------- Picture tiles ---------- */
  #picks {
    display: flex;
    gap: clamp(10px, 3vmin, 26px);
    justify-content: center;
    flex-wrap: nowrap;
  }
  .pick {
    --p: clamp(96px, 28vmin, 200px);
    width: var(--p);
    height: calc(var(--p) * 1.15);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: #fff;
    color: #134e4a;
    border: none;
    border-bottom: 8px solid rgba(0,0,0,.28);
    border-radius: 24px;
    cursor: pointer;
  }
  .pick .emo { font-size: calc(var(--p) * .52); line-height: 1.1; }
  .pick .nm { font-size: calc(var(--p) * .13); font-weight: 800; opacity: .8; }
  .pick:active { transform: translateY(5px); border-bottom-width: 3px; }
  .pick.wrong { background: #fecaca; animation: shake .4s ease; }
  .pick.right { background: #bbf7d0; box-shadow: 0 0 0 6px #22c55e; animation: bounceIn .5s ease; }
  .pick.hint { box-shadow: 0 0 0 6px #fde047; animation: pulse 1.1s ease infinite; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #14b8a6, #0f766e);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Upload your work ---------- */
  #uploadBox { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.4vh, 22px); }
  #projCard {
    background: #fff;
    color: #134e4a;
    border-radius: 22px;
    padding: clamp(12px, 2.4vmin, 20px) clamp(16px, 4vmin, 30px);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    transition: transform .4s ease, box-shadow .4s ease;
  }
  #projCard.snapped { transform: rotate(-3deg); box-shadow: 0 0 0 8px #fde047, 0 8px 0 rgba(0,0,0,.25); }
  #projCard.sent { transform: translateY(-8px) scale(.92); opacity: .85; }
  #projTitle { font-size: clamp(1.1rem, 3.6vmin, 1.7rem); font-weight: 900; }
  #projItems { font-size: clamp(2rem, 9vmin, 4rem); letter-spacing: .1em; }
  .bigAct {
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(1.1rem, 3.6vmin, 1.7rem);
    color: #134e4a;
    background: #fff;
    border: none;
    border-bottom: 8px solid rgba(0,0,0,.28);
    border-radius: 24px;
    padding: clamp(12px, 2.4vh, 20px) clamp(18px, 4vw, 34px);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: clamp(120px, 30vmin, 200px);
  }
  .bigAct .emo { font-size: clamp(2.4rem, 10vmin, 4.4rem); line-height: 1.1; }
  .bigAct:disabled { opacity: .35; cursor: default; }
  .bigAct.next { box-shadow: 0 0 0 6px #fde047; animation: pulse 1.1s ease infinite; }
  .bigAct.ok { background: #bbf7d0; }
  #barWrap {
    width: min(80vw, 420px);
    height: 26px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #22c55e, #a3e635);
    border-radius: 999px;
  }
  #bar.go { width: 100%; transition: width 2.6s linear; }
  #upStatus { font-size: clamp(1.1rem, 3.6vmin, 1.7rem); font-weight: 900; min-height: 1.3em; }
  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 50;
  }
  #flash.on { animation: flash .5s ease; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* ---------- Board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #134e4a;
    cursor: pointer;
  }
  .chip .emo { display: block; font-size: 2em; line-height: 1.1; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #134e4a 0%, #0f766e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay .emo { font-size: clamp(2.2rem, 9vmin, 4rem); letter-spacing: .12em; }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>My project today</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="picks" class="hidden"></div>

  <div id="uploadBox" class="hidden">
    <div id="projCard">
      <div id="projTitle">My project today</div>
      <div id="projItems"></div>
    </div>
    <div class="row">
      <button class="bigAct" id="snapBtn" type="button"><span class="emo">📷</span>Take a photo</button>
      <button class="bigAct" id="upBtn" type="button"><span class="emo">⬆️</span>Upload</button>
    </div>
    <div id="barWrap"><div id="bar"></div></div>
    <div id="upStatus"></div>
  </div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="flash"></div>

<div id="startOverlay">
  <h2>⚽ My project today ⚽</h2>
  <div class="emo">🖥️⌨️🖱️</div>
  <p>Computing<br>Find the things we use with a computer.<br>Then upload your work!</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Computing: "My project today" / "Upload your work".
     Year 1 computing this term is technology around us: the things we use
     with a computer and what each one does. A match is two halves of four:
     first half he hears "Tap the keyboard" and taps the right picture of
     three; second half he hears what it does ("What do we use to type?").
     Every half ends with his project being uploaded, the way his work goes
     to Seesaw: take a photo, then tap Upload. One football ⚽ for every
     thing found and one for every upload. */

  var ROUNDS_PER_HALF = 4;

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '💻', '🖱️'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261023-computing-3.txt is generated straight
     out of this block (tools/gen-phrases.js). */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];

  /* `not`: things that would also be a right answer, so never shown next to it */
  var ITEMS = [
    { id: 'screen', name: 'screen', emoji: '🖥️',
      use: 'We see our work on the screen.',
      ask: 'What do we look at to see our work?', not: ['laptop', 'tablet'] },
    { id: 'keyboard', name: 'keyboard', emoji: '⌨️',
      use: 'We type letters on the keyboard.',
      ask: 'What do we use to type letters?', not: ['laptop'] },
    { id: 'mouse', name: 'mouse', emoji: '🖱️',
      use: 'We click with the mouse.',
      ask: 'What do we use to click?', not: ['laptop', 'tablet'] },
    { id: 'laptop', name: 'laptop', emoji: '💻',
      use: 'A laptop is a computer that folds shut, so we can carry it.',
      ask: 'Which computer folds shut, so we can carry it?', not: ['tablet', 'screen', 'keyboard'] },
    { id: 'tablet', name: 'tablet', emoji: '📱',
      use: 'We tap the tablet with a finger.',
      ask: 'What do we tap with a finger?', not: ['laptop', 'screen', 'camera'] },
    { id: 'camera', name: 'camera', emoji: '📷',
      use: 'We take a photo with the camera.',
      ask: 'What do we use to take a photo?', not: ['tablet'] },
    { id: 'printer', name: 'printer', emoji: '🖨️',
      use: 'The printer prints our work on paper.',
      ask: 'What prints our work on paper?', not: [] },
    { id: 'headphones', name: 'headphones', emoji: '🎧', plural: true,
      use: 'We listen with headphones.',
      ask: 'What do we use to listen?', not: [] }
  ];

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* the question for one thing: half 1 by its name, half 2 by what it does */
  function askSay(it, half) { return half === 1 ? 'Tap the ' + it.name + '.' : it.ask; }

  function thisIs(it) { return (it.plural ? 'Those are the ' : 'That is the ') + it.name + '.'; }
  function hereIs(it) {
    return it.plural ? 'Look! Here are the ' + it.name + '. Tap them.'
                     : 'Look! Here is the ' + it.name + '. Tap it.';
  }
  function goalSay(it) { return 'Goal! ' + thisIs(it) + ' ' + it.use; }
  function notSay(picked, it, half) { return thisIs(picked) + ' Try again. ' + askSay(it, half); }
  /* a chip on the board: "Keyboard. We type letters on the keyboard." */
  function chipSay(it) { return cap(it.name) + '. ' + it.use; }

  function introSay(half) {
    return half === 1 ? 'My project today. Computing! Listen, then tap the right picture. '
                      : 'Second half! Listen to what it does, then find it. ';
  }

  /* upload your work, step by step */
  var UPLOAD_SAY = {
    start: 'Now upload your work! First, take a photo of your project.',
    snap: 'Click! Great photo. Next, tap Upload.',
    going: 'Uploading your work.',
    done: 'Your work is uploaded! Well done!'
  };

  function things(n) { return WORDS[n] + (n === 1 ? ' thing' : ' things'); }
  function halfTimeSay(n) {
    return 'Half time! You found ' + things(n) + ' and uploaded your work. ' +
           'In the second half, listen to what each thing does.';
  }
  function fullTimeSay(n) {
    return 'Full time! You found ' + things(n) + ' and uploaded your work. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, h, n, k;
    function add(s) { var b = bare(s); if (b && !seen[b]) { seen[b] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var q = 0; q < p.length; q++) add(p[q]); }
    for (i = 0; i < ITEMS.length; i++) {
      var it = ITEMS[i];
      for (h = 1; h <= 2; h++) {
        addAll(introSay(h) + askSay(it, h));
        addAll(askSay(it, h));
        for (j = 0; j < ITEMS.length; j++) {
          if (j !== i) addAll(notSay(ITEMS[j], it, h));
        }
      }
      addAll(goalSay(it));
      addAll(hereIs(it));
      addAll(chipSay(it));
    }
    for (k in UPLOAD_SAY) addAll(UPLOAD_SAY[k]);
    for (n = 0; n <= ITEMS.length; n++) { addAll(halfTimeSay(n)); addAll(fullTimeSay(n)); }
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261023computing3';
  var SLOW_KEY  = 'jackHw_hw20261023computing3_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var found = [];         /* things found this match */
  var target = null;      /* the item asked for */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | round | finished | upload | uploaded | board */
  var upStep = 0;         /* 0 take a photo, 1 upload, 2 uploading, 3 done */
  var flowToken = 0;      /* cancels a talking sequence */
  var countToken = 0;     /* kept for stopAll() */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'), picks: $('picks'),
    uploadBox: $('uploadBox'), projCard: $('projCard'), projItems: $('projItems'),
    snapBtn: $('snapBtn'), upBtn: $('upBtn'), bar: $('bar'), upStatus: $('upStatus'),
    flash: $('flash'),
    btnRow: $('btnRow'), sayBtn: $('sayBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261023-computing-3/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    countToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function score() {
    footballs++;
    save();
    renderScore(true);
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'picks', 'uploadBox', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  function askLead(it) {
    return half === 1 ? 'Tap the <b>' + it.name + '</b>' : it.ask;
  }

  /* ================= A round ================= */
  function current() { return half === 1 ? queue1[round] : queue2[round]; }

  /* the right one and two others that are clearly not it */
  function optionsFor(it) {
    var pool = ITEMS.filter(function (o) { return o.id !== it.id && it.not.indexOf(o.id) === -1; });
    return shuffle(shuffle(pool).slice(0, 2).concat([it]));
  }

  function buildPicks(list) {
    els.picks.innerHTML = '';
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.className = 'pick';
      b.type = 'button';
      b.setAttribute('data-id', it.id);
      b.innerHTML = '<span class="emo">' + it.emoji + '</span><span class="nm">' + it.name + '</span>';
      b.addEventListener('click', function () { answer(it, b); });
      els.picks.appendChild(b);
    });
  }

  function enterRound() {
    stopAll();
    mode = 'round';
    busy = false;
    attempts = 0;
    target = current();
    els.half.textContent = (half === 1 ? 'First half · ' : 'Second half · ') + (round + 1) + '/' + ROUNDS_PER_HALF;
    buildPicks(optionsFor(target));
    els.lead.innerHTML = askLead(target);
    show(['lead', 'picks', 'btnRow'], ['sayBtn']);
    var intro = round === 0 ? introSay(half) : '';
    setTimeout(function () { if (mode === 'round' && !busy && attempts === 0) speak(intro + askSay(target, half)); }, 300);
  }

  function answer(it, btn) {
    if (mode !== 'round' || busy) return;
    stopAll();

    if (it.id !== target.id) {
      attempts++;
      btn.classList.remove('wrong');
      void btn.offsetWidth;
      btn.classList.add('wrong');
      if (attempts >= 2) {
        /* show him the right one; a tap on it counts straight away */
        var right = els.picks.querySelector('[data-id="' + target.id + '"]');
        if (right) right.classList.add('hint');
        speak(hereIs(target));
      } else {
        speak(notSay(it, target, half));
      }
      return;
    }

    btn.classList.remove('hint');
    btn.classList.add('right');
    finishRound();
  }

  function finishRound() {
    busy = true;
    mode = 'finished';
    found.push(target);
    score();
    celebrate(22);
    els.lead.innerHTML = 'GOAL! ⚽ ' + target.emoji + ' <b>' + target.name + '</b>';
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? 'Upload ⬆️' : 'Next ➜';
    show(['lead', 'picks', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak(goalSay(target));
  }

  function nextRound() {
    stopAll();
    if (mode === 'uploaded') {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    round++;
    if (round >= ROUNDS_PER_HALF) { enterUpload(); return; }
    enterRound();
  }

  /* ================= Upload your work ================= */
  function setUpStep(n) {
    upStep = n;
    els.snapBtn.disabled = n !== 0;
    els.upBtn.disabled = n !== 1;
    els.snapBtn.classList.toggle('next', n === 0);
    els.upBtn.classList.toggle('next', n === 1);
    els.snapBtn.classList.toggle('ok', n > 0);
    els.upBtn.classList.toggle('ok', n > 2);
  }

  function enterUpload() {
    stopAll();
    mode = 'upload';
    els.half.textContent = 'Upload your work';
    var mine = half === 1 ? queue1 : queue2;
    els.projItems.textContent = mine.map(function (it) { return it.emoji; }).join('');
    els.projCard.classList.remove('snapped', 'sent');
    els.bar.classList.remove('go');
    els.upStatus.textContent = '';
    els.lead.innerHTML = 'Upload your work! 📷 then ⬆️';
    setUpStep(0);
    show(['lead', 'uploadBox']);
    speak(UPLOAD_SAY.start);
  }

  function takePhoto() {
    if (mode !== 'upload' || upStep !== 0) return;
    stopAll();
    els.flash.classList.remove('on');
    void els.flash.offsetWidth;
    els.flash.classList.add('on');
    els.projCard.classList.add('snapped');
    setUpStep(1);
    speak(UPLOAD_SAY.snap);
  }

  function upload() {
    if (mode !== 'upload' || upStep !== 1) return;
    stopAll();
    setUpStep(2);
    void els.bar.offsetWidth;
    els.bar.classList.add('go');
    els.upStatus.textContent = 'Uploading…';
    var spoke = false, filled = false;
    var both = function () { if (spoke && filled) uploaded(); };
    speak(UPLOAD_SAY.going, function () { spoke = true; both(); });
    /* the bar takes 2.6 s; a stuck voice never holds it up for long */
    setTimeout(function () { filled = true; both(); }, 2700);
    setTimeout(function () { spoke = true; both(); }, 6000);
  }

  function uploaded() {
    if (mode !== 'upload' || upStep !== 2) return;
    mode = 'uploaded';
    setUpStep(3);
    els.projCard.classList.add('sent');
    els.upStatus.textContent = '✅ Uploaded!';
    score();
    celebrate(30);
    els.nextBtn.textContent = half === 1 ? 'Half time ➜' : 'Full time ➜';
    show(['lead', 'uploadBox', 'btnRow'], ['nextBtn']);
    speak(UPLOAD_SAY.done);
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    found.forEach(function (it, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = '<span class="emo">' + it.emoji + '</span>' + it.name;
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(chipSay(found[i]), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    found.forEach(function (it, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: chipSay(it)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = 'Next: what does it do?';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(found.length));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = found.length + ' things · 2 uploads · ' + (found.length + 2) + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(found.length));
  }

  /* ================= Match ================= */
  function buildQueues() {
    var all = shuffle(ITEMS);
    queue1 = all.slice(0, ROUNDS_PER_HALF);
    queue2 = all.slice(ROUNDS_PER_HALF, ROUNDS_PER_HALF * 2);
  }

  function startMatch() {
    stopAll();
    buildQueues();
    found = [];
    half = 1;
    round = 0;
    enterRound();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.sayBtn.addEventListener('click', function () {
    if (!target) return;
    if (mode === 'round' && busy) return;
    stopAll();
    if (mode === 'finished') speak(goalSay(target));
    else speak(askSay(target, half));
  });
  els.nextBtn.addEventListener('click', nextRound);
  els.snapBtn.addEventListener('click', takePhoto);
  els.upBtn.addEventListener('click', upload);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
