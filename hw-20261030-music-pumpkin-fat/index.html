<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3b0764">
<title>Pumpkin Fat ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Pumpkin Fat">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #3b0764 0%, #7c2d12 55%, #3b0764 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.4vh, 24px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 3vmin, 1.6rem); font-weight: 700; }

  /* ---------- A rhythm drawn in pumpkins ---------- */
  .strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vmin, 14px);
    --u: clamp(26px, 7vmin, 50px);
  }
  .unit {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    min-width: calc(var(--u) * 1.5);
    height: calc(var(--u) * 1.5);
    line-height: 1;
  }
  .unit .small { font-size: calc(var(--u) * .62); }
  .unit .fat { font-size: var(--u); display: inline-block; transform: scale(1.3, 1.05); }

  /* ---------- The row he fills in ---------- */
  #slots {
    min-height: clamp(50px, 12vmin, 86px);
    padding: clamp(6px, 1.4vmin, 12px) clamp(10px, 2.4vmin, 18px);
    background: rgba(255,255,255,.14);
    border-radius: 20px;
    --u: clamp(30px, 8vmin, 54px);
  }
  .slot {
    border: 3px dashed rgba(255,255,255,.55);
    border-radius: 14px;
    font-weight: 900;
    font-size: calc(var(--u) * .7);
  }
  .slot.hint { opacity: .55; }
  .slot.done { border-style: solid; border-color: #fde047; background: rgba(253,224,71,.16); }
  .slot.done > span { animation: bounceIn .35s ease; }

  /* ---------- The two big pumpkins ---------- */
  #cards { display: flex; gap: clamp(12px, 4vmin, 34px); justify-content: center; }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 1vmin, 10px);
    width: clamp(138px, 37vmin, 270px);
    height: clamp(120px, 33vmin, 240px);
    font-family: inherit;
    color: #431407;
    background: #fff7ed;
    border: 5px solid #fb923c;
    border-radius: 28px;
    cursor: pointer;
    box-shadow: 0 9px 0 rgba(0,0,0,.28);
    transition: transform .08s ease;
  }
  .card:active { transform: translateY(5px); box-shadow: 0 4px 0 rgba(0,0,0,.28); }
  .card .pic { display: flex; align-items: center; justify-content: center; height: 62%; line-height: 1; }
  .card .pic .small { font-size: clamp(2.2rem, 10vmin, 4.6rem); }
  .card .pic .fat { font-size: clamp(3.2rem, 15vmin, 6.8rem); display: inline-block; transform: scale(1.35, 1.05); }
  .card .word { font-size: clamp(1.1rem, 4vmin, 2rem); font-weight: 900; }
  .card.beat { background: #fde047; border-color: #facc15; transform: scale(1.07); }
  .card.wrong { background: #fecaca; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Which one did you hear? ---------- */
  #choices {
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.8vmin, 16px);
    width: min(94vw, 620px);
  }
  .choice {
    display: block;
    width: 100%;
    min-height: clamp(62px, 13vmin, 96px);
    font-family: inherit;
    padding: clamp(6px, 1.4vmin, 12px);
    background: #fff7ed;
    border: 4px solid #fb923c;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 7px 0 rgba(0,0,0,.28);
  }
  .choice:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.28); }
  .choice.wrong { background: #fecaca; animation: shake .4s ease; }
  .choice.show { background: #fde047; animation: pulse 1.1s ease infinite; }
  .choice.right { background: #bbf7d0; border-color: #22c55e; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #a855f7, #7e22ce);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 760px;
  }
  .chip {
    font-family: inherit;
    padding: clamp(4px, 1vh, 8px) clamp(8px, 2vw, 14px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff7ed;
    cursor: pointer;
  }
  .chip .strip { --u: clamp(18px, 4.6vmin, 30px); gap: 3px; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #3b0764 0%, #c2410c 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Pumpkin Fat</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="slots" class="strip hidden"></div>

  <div id="cards" class="hidden">
    <button class="card" id="cardP" type="button">
      <span class="pic"><span class="small">🎃</span><span class="small">🎃</span></span>
      <span class="word">Pump-kin</span>
    </button>
    <button class="card" id="cardF" type="button">
      <span class="pic"><span class="fat">🎃</span></span>
      <span class="word">Fat</span>
    </button>
  </div>

  <div id="choices" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="againBtn">🔊 Again</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <div id="board"></div>
    <div class="row">
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>🎃 Pumpkin Fat 🎃</h2>
  <p>Music game.<br>Pump-kin · Fat<br>Listen, then tap it back.</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Music: Pumpkin Fat. Seesaw gives only the title (no text, no sheet), so
     the words of the class song are unknown and none are made up here. The
     game drills the rhythm of the title words instead: "Pump-kin" is two
     short beats, "Fat" is one long beat.

     First half he hears a rhythm (voice and drum) and taps it back on the
     two big pumpkins. Second half he hears the drum alone and picks the
     rhythm he heard from pictures. One football ⚽ for every rhythm.

     Built 30.10.2026 without running it: node and the browser were not
     available to the build job, so it was only checked by reading the code. */

  var CONFETTI = ['⚽', '🎃', '🎵', '🎶', '⭐', '🎉'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261030-music-pumpkin-fat.txt is generated
     straight out of this block (tools/gen-phrases.js). */

  var ROUNDS_PER_HALF = 4;

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight'];

  var UNIT_SAY = { P: 'Pumpkin', F: 'Fat' };

  var INTRO_SAY = [
    'This is our music game. Pumpkin fat.',
    'Pumpkin has two short beats.',
    'Fat has one long beat.',
    'Listen, then tap it back. Now tap the arrow.'
  ];

  var PRAISE = ['Goal!', 'Brilliant, goal!', 'Yes, goal!'];

  var LISTEN_SAY = 'Listen.';
  var TURN_SAY = 'Your turn.';
  var COPY_RETRY_SAY = 'Not that one. Listen again.';
  var DRUM_SAY = 'Listen to the drum.';
  var HEAR_SAY = 'Which one did you hear?';
  var HEAR_RETRY_SAY = 'Not that one. Listen to the words too.';
  var SHOW_SAY = 'Here it is. Listen.';

  /* a rhythm is an array of 'P' and 'F': the words, one clip each */
  function rhythmParts(r) {
    var out = [];
    for (var i = 0; i < r.length; i++) out.push(UNIT_SAY[r[i]]);
    return out;
  }
  function goalParts(r, n) { return [PRAISE[n % PRAISE.length]].concat(rhythmParts(r)); }
  function halfTimeSay(n) {
    return 'Half time! You played ' + WORDS[n] + ' rhythms. In the second half, listen to the drum.';
  }
  function fullTimeSay(n) {
    return 'Full time! You played ' + WORDS[n] + ' rhythms. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }
    add(UNIT_SAY.P);
    add(UNIT_SAY.F);
    for (i = 0; i < INTRO_SAY.length; i++) addAll(INTRO_SAY[i]);
    for (i = 0; i < PRAISE.length; i++) add(PRAISE[i]);
    addAll(LISTEN_SAY);
    addAll(TURN_SAY);
    addAll(COPY_RETRY_SAY);
    addAll(DRUM_SAY);
    addAll(HEAR_SAY);
    addAll(HEAR_RETRY_SAY);
    addAll(SHOW_SAY);
    addAll(halfTimeSay(ROUNDS_PER_HALF));
    addAll(fullTimeSay(ROUNDS_PER_HALF * 2));
    return out;
  }
  /* ==== END TEXT-CORE ==== */
  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261030musicpumpkinfat';
  var SLOW_KEY  = 'jackHw_hw20261030musicpumpkinfat_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* rhythms finished this match */
  var rhythm = null;      /* the rhythm of this round */
  var progress = 0;       /* how many of its units he has tapped back */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | intro | copy | hear | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    slots: $('slots'), cards: $('cards'), cardP: $('cardP'), cardF: $('cardF'),
    choices: $('choices'), btnRow: $('btnRow'),
    againBtn: $('againBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'),
    board: $('board'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };
  var CARDS = { P: els.cardP, F: els.cardF };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261030-music-pumpkin-fat/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    busy = false;
    clearBeat();
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Drum =================
     Made in Web Audio, no clips: a short high knock for each beat of
     "Pump-kin", a long low boom for "Fat". */
  var BEAT_S = 0.24;     /* the two short beats, start to start */
  var LONG_S = 0.62;     /* the long beat */

  function hit(ac, at, long) {
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    var len = long ? LONG_S : 0.11;
    osc.type = long ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(long ? 150 : 520, at);
    osc.frequency.exponentialRampToValueAtTime(long ? 85 : 300, at + len);
    gain.gain.setValueAtTime(long ? 0.75 : 0.45, at);
    gain.gain.exponentialRampToValueAtTime(0.001, at + len);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(at);
    osc.stop(at + len + 0.02);
  }

  /* plays one unit, returns how long it lasts in ms */
  function drum(unit) {
    var ms = unit === 'P' ? BEAT_S * 2 * 1000 : (LONG_S + 0.08) * 1000;
    var ac = audioReady();
    if (!ac) return ms;
    var t = ac.currentTime + 0.02;
    if (unit === 'P') { hit(ac, t, false); hit(ac, t + BEAT_S, false); }
    else hit(ac, t, true);
    return ms;
  }

  /* Plays a rhythm unit by unit, the card lighting up on each beat. With
     voice the word carries the beat; without it the drum is all he gets
     (no drum possible: then the words have to do it anyway). */
  function playRhythm(r, withVoice, then) {
    var token = ++flowToken;
    busy = true;
    if (!hasAudio) withVoice = true;
    (function next(i) {
      if (token !== flowToken) return;
      clearBeat();
      if (i >= r.length) {
        busy = false;
        if (then) then();
        return;
      }
      var unit = r[i];
      if (withVoice) CARDS[unit].classList.add('beat');
      var ms = drum(unit);
      var onward = function () {
        CARDS[unit].classList.remove('beat');
        setTimeout(function () { next(i + 1); }, 130);
      };
      if (withVoice) speak(UNIT_SAY[unit], onward);
      else setTimeout(onward, ms);
    })(0);
  }

  function clearBeat() {
    els.cardP.classList.remove('beat');
    els.cardF.classList.remove('beat');
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'slots', 'cards', 'choices', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['againBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  function unitHtml(unit) {
    return unit === 'P'
      ? '<span class="small">🎃</span><span class="small">🎃</span>'
      : '<span class="fat">🎃</span>';
  }

  function stripHtml(r) {
    var html = '<div class="strip">';
    for (var i = 0; i < r.length; i++) html += '<span class="unit">' + unitHtml(r[i]) + '</span>';
    return html + '</div>';
  }

  /* the row he fills in: done units, then question marks (or a faint hint) */
  function renderSlots(hint) {
    var html = '';
    for (var i = 0; i < rhythm.length; i++) {
      if (i < progress) html += '<span class="unit slot done"><span>' + unitHtml(rhythm[i]) + '</span></span>';
      else if (hint) html += '<span class="unit slot hint">' + unitHtml(rhythm[i]) + '</span>';
      else html += '<span class="unit slot">?</span>';
    }
    els.slots.innerHTML = html;
  }

  /* ================= The intro ================= */
  function enterIntro() {
    stopAll();
    mode = 'intro';
    els.half.textContent = 'Warm up';
    els.lead.textContent = '🎵 Pump-kin · Fat 🎵';
    els.nextBtn.textContent = 'My turn ➜';
    show(['lead', 'cards', 'btnRow'], ['againBtn', 'nextBtn']);
    playIntro();
  }

  function flash(unit) {
    clearBeat();
    CARDS[unit].classList.add('beat');
    drum(unit);
    setTimeout(function () { CARDS[unit].classList.remove('beat'); }, 700);
  }

  function playIntro() {
    sequence([
      { say: INTRO_SAY[0] },
      { act: function () { flash('P'); }, say: INTRO_SAY[1] },
      { act: function () { flash('F'); }, say: INTRO_SAY[2] },
      { say: INTRO_SAY[3] }
    ]);
  }

  /* ================= First half: tap it back ================= */
  function enterCopy() {
    stopAll();
    mode = 'copy';
    rhythm = queue1[round];
    progress = 0;
    attempts = 0;
    els.half.textContent = 'First half · ' + (round + 1) + '/' + ROUNDS_PER_HALF;
    els.lead.textContent = '👂 Listen, then tap it back';
    renderSlots(false);
    show(['lead', 'slots', 'cards', 'btnRow'], ['againBtn']);
    playCopy(LISTEN_SAY);
  }

  function playCopy(line) {
    var token = ++flowToken;
    busy = true;
    speak(line, function () {
      if (token !== flowToken) return;
      playRhythm(rhythm, true, function () { speak(TURN_SAY); });
    });
  }

  function tapCard(unit, card) {
    if (mode === 'intro') {
      stopAll();
      drum(unit);
      speak(UNIT_SAY[unit]);
      return;
    }
    if (mode !== 'copy' || busy) return;
    stopAll();
    if (unit !== rhythm[progress]) {
      attempts++;
      progress = 0;
      card.classList.remove('wrong');
      void card.offsetWidth;
      card.classList.add('wrong');
      setTimeout(function () { card.classList.remove('wrong'); }, 500);
      renderSlots(true);
      playCopy(COPY_RETRY_SAY);
      return;
    }
    progress++;
    drum(unit);
    renderSlots(attempts > 0);
    if (progress >= rhythm.length) { finishRhythm(); return; }
    speak(UNIT_SAY[unit]);
  }

  /* ================= Second half: which one did you hear? ================= */
  function enterHear() {
    stopAll();
    mode = 'hear';
    rhythm = queue2[round];
    attempts = 0;
    els.half.textContent = 'Second half · ' + (round + 1) + '/' + ROUNDS_PER_HALF;
    els.lead.textContent = '🥁 Which one did you hear?';
    renderChoices();
    show(['lead', 'choices', 'btnRow'], ['againBtn']);
    playHear();
  }

  function renderChoices() {
    var want = round < 2 ? 2 : 3;
    var key = rhythm.join('');
    var pool = shuffle(allRhythms(rhythm.length)).filter(function (r) { return r.join('') !== key; });
    var list = shuffle([rhythm].concat(pool.slice(0, want - 1)));
    els.choices.innerHTML = '';
    list.forEach(function (r) {
      var b = document.createElement('button');
      b.className = 'choice';
      b.type = 'button';
      b.innerHTML = stripHtml(r);
      if (r.join('') === key) b.setAttribute('data-right', '1');
      b.addEventListener('click', function () { pick(r, b); });
      els.choices.appendChild(b);
    });
  }

  function playHear() {
    var token = ++flowToken;
    busy = true;
    speak(DRUM_SAY, function () {
      if (token !== flowToken) return;
      playRhythm(rhythm, attempts > 0, function () { speak(HEAR_SAY); });
    });
  }

  function pick(r, btn) {
    if (mode !== 'hear' || busy) return;
    stopAll();
    if (r.join('') === rhythm.join('')) {
      btn.classList.add('right');
      finishRhythm();
      return;
    }
    attempts++;
    btn.classList.remove('wrong');
    void btn.offsetWidth;
    btn.classList.add('wrong');
    var line = HEAR_RETRY_SAY;
    if (attempts >= 2) {
      line = SHOW_SAY;
      els.choices.querySelector('[data-right]').classList.add('show');
    }
    var token = ++flowToken;
    busy = true;
    speak(line, function () {
      if (token !== flowToken) return;
      playRhythm(rhythm, true);
    });
  }

  /* ================= A rhythm finished ================= */
  function finishRhythm() {
    mode = 'finished';
    done.push(rhythm);
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    els.lead.textContent = 'GOAL! ⚽';
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'Full time ➜') : 'Next ➜';
    var keep = half === 1 ? ['lead', 'slots', 'cards', 'btnRow'] : ['lead', 'choices', 'btnRow'];
    show(keep, ['againBtn', 'nextBtn']);
    speakParts(goalParts(rhythm, done.length - 1));
  }

  function nextRound() {
    stopAll();
    if (mode === 'intro') { half = 1; round = 0; enterCopy(); return; }
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    if (half === 1) enterCopy(); else enterHear();
  }

  function again() {
    if (mode === 'intro') { stopAll(); playIntro(); return; }
    if (mode === 'copy') { stopAll(); progress = 0; renderSlots(attempts > 0); playCopy(LISTEN_SAY); return; }
    if (mode === 'hear') { stopAll(); playHear(); return; }
    if (mode === 'finished') { stopAll(); playRhythm(rhythm, true); }
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    done.forEach(function (r) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = stripHtml(r);
      b.addEventListener('click', function () { sayChip(r, b); });
      els.board.appendChild(b);
    });
  }

  function sayChip(r, chip) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', chips[c] === chip);
    playRhythm(r, true, function () { chip.classList.remove('saying'); });
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(done.length));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time! ' + done.length + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(done.length));
  }

  /* ================= Match ================= */
  /* every rhythm of that many units that has both words in it */
  function allRhythms(len) {
    var out = [];
    for (var bits = 1; bits < (1 << len) - 1; bits++) {
      var r = [];
      for (var i = 0; i < len; i++) r.push(bits & (1 << i) ? 'F' : 'P');
      out.push(r);
    }
    return out;
  }

  /* starts with the title itself, then the rhythms get longer */
  function buildQueues() {
    var three = shuffle(allRhythms(3));
    var four = shuffle(allRhythms(4));
    queue1 = [['P', 'F'], three[0], three[1], four[0]];
    queue2 = [three[2], three[3], four[1], four[2]];
  }

  function startMatch() {
    stopAll();
    buildQueues();
    done = [];
    half = 1;
    round = 0;
    enterIntro();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.cardP.addEventListener('click', function () { tapCard('P', els.cardP); });
  els.cardF.addEventListener('click', function () { tapCard('F', els.cardF); });
  els.againBtn.addEventListener('click', again);
  els.nextBtn.addEventListener('click', nextRound);

  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterHear();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
