<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0369a1">
<title>Weather Match ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Weather">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #0c4a6e 0%, #0284c7 52%, #0c4a6e 100%);
    background-attachment: fixed;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.1rem, 3vmin, 1.6rem); font-weight: 800; }

  /* ---------- Weather scenes (drawn, animated) ---------- */
  .scene {
    --sw: 300px;
    position: relative;
    flex: none;
    width: var(--sw);
    height: calc(var(--sw) * .62);
    font-size: calc(var(--sw) / 16);
    border-radius: calc(var(--sw) / 20);
    overflow: hidden;
    border: 4px solid #fff;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: #38bdf8;
  }
  .scene > * { position: absolute; line-height: 1; pointer-events: none; }
  .scene .ground { left: 0; right: 0; bottom: 0; height: 24%; background: #4ade80; }
  .scene .house { left: 12%; bottom: 11%; font-size: 2.6em; }
  .scene .tree { left: 64%; bottom: 13%; font-size: 2.8em; transform-origin: 50% 100%; }
  .scene .snowman { left: 42%; bottom: 10%; font-size: 2.1em; }

  #bigScene { --sw: min(92vw, 560px, 60vh); }
  @media (orientation: landscape) and (max-height: 520px) { #bigScene { --sw: min(60vw, 52vh * 1.6); } }

  .w-sunny  { background: linear-gradient(#0ea5e9, #bae6fd); }
  .w-cloudy { background: linear-gradient(#94a3b8, #cbd5e1); }
  .w-cloudy .ground { background: #65a30d; }
  .w-rainy  { background: linear-gradient(#475569, #94a3b8); }
  .w-rainy .ground { background: #15803d; }
  .w-windy  { background: linear-gradient(#7dd3fc, #e0f2fe); }
  .w-windy .tree { animation: sway 1.3s ease-in-out infinite alternate; }
  .w-snowy  { background: linear-gradient(#94a3b8, #e2e8f0); }
  .w-snowy .ground { background: #f8fafc; }
  .w-stormy { background: linear-gradient(#0f172a, #334155); }
  .w-stormy .ground { background: #14532d; }
  .w-stormy .cloud { filter: brightness(.5); animation-duration: 2.4s; }
  .w-foggy  { background: linear-gradient(#9ca3af, #e5e7eb); }
  .w-foggy .ground { background: #a3b18a; }
  .w-foggy .house, .w-foggy .tree { filter: blur(.1em); opacity: .5; }

  .sun { right: 7%; top: 6%; font-size: 3.2em; animation: spin 16s linear infinite; filter: drop-shadow(0 0 .35em #fde047); }
  .cloud { font-size: 3em; animation: drift 5s ease-in-out infinite alternate; }
  .drop { top: 40%; width: .13em; height: .8em; border-radius: .1em; background: #dbeafe; opacity: .9; animation: rain .9s linear infinite; }
  .w-stormy .drop { animation-duration: .55s; }
  .flake { top: 40%; color: #fff; font-size: .9em; text-shadow: 0 0 2px #64748b; animation: snow 4.2s linear infinite; }
  .leaf { top: 40%; font-size: 1.4em; animation: blow 2.4s linear infinite; }
  .gust { top: 40%; height: .18em; width: 4em; border-radius: 1em; background: rgba(255,255,255,.95); animation: gust 1.6s linear infinite; }
  .kite { left: 38%; top: 8%; font-size: 2em; animation: bob 1.1s ease-in-out infinite alternate; }
  .fog { left: -50%; width: 200%; height: 30%; background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.9), rgba(255,255,255,0)); animation: fogDrift 5s ease-in-out infinite alternate; }
  .bolt { left: 44%; top: 20%; font-size: 2.6em; animation: bolt 2.6s linear infinite; }
  .flash { inset: 0; background: #fff; opacity: 0; animation: flash 2.6s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(-.8em); } to { transform: translateX(.8em); } }
  @keyframes rain { from { top: 14%; } to { top: 100%; } }
  @keyframes snow {
    from { top: -8%; transform: translateX(0); }
    50% { transform: translateX(.8em); }
    to { top: 100%; transform: translateX(-.4em); }
  }
  @keyframes blow {
    from { left: -12%; transform: translateY(0) rotate(0); }
    50% { transform: translateY(-1.2em) rotate(200deg); }
    to { left: 108%; transform: translateY(.4em) rotate(400deg); }
  }
  @keyframes gust { from { left: -30%; opacity: 0; } 20% { opacity: 1; } to { left: 110%; opacity: 0; } }
  @keyframes sway { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes bob { from { transform: translate(-.4em, 0) rotate(-12deg); } to { transform: translate(.4em, -.4em) rotate(12deg); } }
  @keyframes fogDrift { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
  @keyframes bolt { 0%, 69%, 75%, 79%, 100% { opacity: 0; } 71%, 77% { opacity: 1; } }
  @keyframes flash { 0%, 69%, 75%, 79%, 100% { opacity: 0; } 71%, 77% { opacity: .45; } }

  /* ---------- Warm-up: all seven weather patterns ---------- */
  #tour {
    display: grid;
    grid-template-columns: repeat(4, auto);
    gap: clamp(8px, 1.8vmin, 16px);
    justify-content: center;
  }
  @media (max-width: 620px), (orientation: landscape) and (max-height: 520px) {
    #tour { grid-template-columns: repeat(3, auto); }
  }
  .tcard, .pick, .card {
    font-family: inherit;
    border: none;
    cursor: pointer;
    color: #0f172a;
  }
  .tcard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.14);
    border-radius: 18px;
    padding: 6px;
  }
  .tcard .scene { --sw: min(21vw, 160px, 20vh * 1.6); border-width: 3px; box-shadow: none; }
  @media (max-width: 620px) { .tcard .scene { --sw: min(27vw, 18vh * 1.6); } }
  .tcard .word { color: #fff; font-weight: 900; font-size: clamp(.95rem, 2.6vmin, 1.3rem); }
  .tcard.saying { background: #fde047; }
  .tcard.saying .word { color: #0f172a; }

  /* ---------- First half: name it (symbol cards) ---------- */
  #cards {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 18px);
    justify-content: center;
    max-width: 700px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: clamp(100px, 22vmin, 150px);
    padding: clamp(8px, 1.6vmin, 14px) 6px;
    background: #fff;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 20px;
  }
  .card .sym { font-size: clamp(2.6rem, 9vmin, 4.2rem); line-height: 1.1; }
  .card .word { font-weight: 900; font-size: clamp(1rem, 3vmin, 1.4rem); }
  .card:active { transform: translateY(4px); border-bottom-width: 2px; }
  @media (orientation: landscape) and (max-height: 520px) {
    .card { width: clamp(84px, 16vmin, 120px); padding: 4px; }
    .card .sym { font-size: clamp(2rem, 9vmin, 3rem); }
  }

  /* ---------- Second half: find it (scene choices) ---------- */
  #picks {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 18px);
    justify-content: center;
  }
  .pick { background: none; padding: 0; border-radius: 20px; }
  .pick .scene { --sw: min(29vw, 250px, 40vh * 1.6); }
  @media (max-aspect-ratio: 3/4) {
    #picks { flex-direction: column; align-items: center; }
    .pick .scene { --sw: min(84vw, 360px, 22vh * 1.6); }
  }
  .pick:active .scene { transform: translateY(4px); }

  .wrong { animation: shake .4s ease; }
  .card.wrong { background: #fecaca; }
  .pick.wrong .scene { border-color: #f87171; }
  .hint { animation: pulse 1.1s ease infinite; }
  .card.hint { box-shadow: 0 0 0 6px #fde047; }
  .pick.hint .scene { border-color: #fde047; box-shadow: 0 0 0 6px #fde047; }
  .card.right { background: #dcfce7; box-shadow: 0 0 0 6px #22c55e; animation: bounceIn .5s ease; }
  .pick.right .scene { border-color: #22c55e; box-shadow: 0 0 0 6px #22c55e; }
  .dim { opacity: .35; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .sym { font-size: 1.5em; display: block; }
  .chip.nogoal { border-color: #cbd5e1; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #0c4a6e 0%, #0284c7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay .syms { font-size: clamp(2rem, 8vmin, 3.6rem); letter-spacing: .1em; }
  #startOverlay p { max-width: 30ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Weather match</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="tour" class="hidden"></div>

  <div id="bigScene" class="scene hidden"></div>
  <div id="cards" class="hidden"></div>
  <div id="picks" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Weather Matching Activity ⚽</h2>
  <div class="syms">☀️ 🌧️ ☁️ 🌬️ ❄️ ⛈️ 🌫️</div>
  <p>I can name different types of weather patterns.<br>I can recognise weather patterns.</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Weather Matching Activity.
     "I can name different types of weather patterns.
      I can recognise weather patterns."

     Warm-up: the seven weather patterns are shown as little moving pictures
     (sun shining, rain falling, clouds, wind blowing leaves, snow, thunder
     and lightning, fog) and each one is named.
     First half — name it: one big weather picture, he taps the matching
     weather card (symbol + word) out of three, later four.
     Second half — recognise it: he hears "Find the snowy weather!" and taps
     the right picture out of three (one of them a look-alike: rainy/stormy,
     cloudy/foggy, ...). A wrong tap names what he tapped; after two wrong
     taps the right one glows. A goal ⚽ for every weather found without the
     glow. */

  var CONFETTI = ['⚽', '⭐', '🎉', '☀️', '🌈', '❄️'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so the phrase list for the clips can be generated straight out of
     this block. */

  var ROUNDS_PER_HALF = 6;

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
               'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

  var WEATHER = ['sunny', 'rainy', 'cloudy', 'windy', 'snowy', 'stormy', 'foggy'];

  var FACTS = {
    sunny: 'The sun is shining.',
    rainy: 'Rain is falling from the clouds.',
    cloudy: 'Grey clouds cover the sky.',
    windy: 'The wind blows the leaves.',
    snowy: 'Snow is falling. It is cold.',
    stormy: 'There is thunder and lightning.',
    foggy: 'It is hard to see in the fog.'
  };

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

  /* "Sunny." — a card or a picture tapped */
  function nameSay(w) { return cap(w) + '.'; }
  function itIsSay(w) { return 'It is ' + w + '.'; }
  /* warm-up and board: "Sunny. The sun is shining." */
  function tourSay(w) { return nameSay(w) + ' ' + FACTS[w]; }

  var WARM_SAY = [
    'Weather Matching Activity! Let us name the weather patterns.',
    'Now tap Kick off to play!'
  ];

  function askSay(half, w) {
    return half === 1 ? 'What is the weather like?' : 'Find the ' + w + ' weather!';
  }
  function introSay(half) {
    return half === 1 ? 'First half. Look at the picture. '
                      : 'Second half. Listen and find the right picture. ';
  }
  /* the cards he can pick from, read out: "Sunny. Rainy. Cloudy." */
  function choicesSay(list) { return list.map(nameSay).join(' '); }

  function hintSay(w) { return 'Here it is. ' + itIsSay(w) + ' Tap it!'; }
  function wrongSay(half, tapped, w, attempts) {
    return 'That is ' + tapped + '. ' +
      (attempts >= 2 ? hintSay(w) : half === 1 ? 'Look again.' : askSay(2, w));
  }
  function goalSay(w) { return 'Goal! ' + itIsSay(w) + ' ' + FACTS[w]; }
  function praiseSay(w) { return 'Well done! ' + itIsSay(w) + ' ' + FACTS[w]; }

  function goalsSay(n) { return WORDS[n] + (n === 1 ? ' goal.' : ' goals.'); }
  function halfTimeSay(n) {
    return 'Half time! You scored ' + goalsSay(n) +
           ' In the second half, listen and find the weather.';
  }
  function fullTimeSay(n) {
    return 'Full time! You scored ' + goalsSay(n) +
           ' You can name and recognise weather patterns. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, h, a, n, w;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }
    for (i = 0; i < WARM_SAY.length; i++) addAll(WARM_SAY[i]);
    addAll(choicesSay(WEATHER));
    for (i = 0; i < WEATHER.length; i++) {
      w = WEATHER[i];
      addAll(nameSay(w));
      addAll(itIsSay(w));
      addAll(tourSay(w));
      addAll(hintSay(w));
      addAll(goalSay(w));
      addAll(praiseSay(w));
      addAll(askSay(2, w));
      addAll(introSay(2) + askSay(2, w));
    }
    addAll(askSay(1));
    addAll(introSay(1) + askSay(1));
    for (h = 1; h <= 2; h++) {
      for (i = 0; i < WEATHER.length; i++) {
        for (j = 0; j < WEATHER.length; j++) {
          if (i === j) continue;
          for (a = 1; a <= 2; a++) addAll(wrongSay(h, WEATHER[i], WEATHER[j], a));
        }
      }
    }
    for (n = 0; n <= ROUNDS_PER_HALF * 2; n++) {
      addAll(halfTimeSay(n));
      addAll(fullTimeSay(n));
    }
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  var SYMBOL = { sunny: '☀️', rainy: '🌧️', cloudy: '☁️', windy: '🌬️',
                 snowy: '❄️', stormy: '⛈️', foggy: '🌫️' };
  /* the second half puts a look-alike next to the right picture */
  var LOOKALIKE = { sunny: 'windy', rainy: 'stormy', cloudy: 'foggy', windy: 'cloudy',
                    snowy: 'rainy', stormy: 'rainy', foggy: 'cloudy' };

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261106weathermatchingactivit1';
  var SLOW_KEY  = 'jackHw_hw20261106weathermatchingactivit1_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* { w, goal } for every weather this match */
  var goals = 0;
  var target = null;      /* the weather this round */
  var options = [];       /* what he can tap this round */
  var attempts = 0;
  var mode = 'start';     /* start | warmup | round | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */
  var warmedUp = false;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    tour: $('tour'), bigScene: $('bigScene'), cards: $('cards'), picks: $('picks'),
    btnRow: $('btnRow'), sayBtn: $('sayBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261106-weather-matching-activit-1/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'tour', 'bigScene', 'cards', 'picks', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  /* ================= Drawing the weather ================= */
  function rnd(a, b) { return (a + Math.random() * (b - a)).toFixed(1); }

  function cloudAt(x, y) {
    return '<span class="cloud" style="left:' + x + '%;top:' + y + '%;animation-delay:-' + rnd(0, 5) + 's">☁️</span>';
  }

  /* falling or flying bits: drops, flakes, leaves, gusts */
  function bits(cls, count, ch, x0, x1, y0, y1, dur) {
    var h = '';
    for (var i = 0; i < count; i++) {
      h += '<span class="' + cls + '" style="left:' + rnd(x0, x1) + '%;top:' + rnd(y0, y1) +
           '%;animation-delay:-' + rnd(0, dur) + 's">' + ch + '</span>';
    }
    return h;
  }

  function sceneHTML(w) {
    var h = '';
    /* the sky */
    if (w === 'sunny') h += '<span class="sun">☀️</span>';
    if (w === 'cloudy') h += cloudAt(4, 6) + cloudAt(36, 2) + cloudAt(66, 10) + cloudAt(20, 22);
    if (w === 'rainy') h += cloudAt(10, 2) + cloudAt(52, 0);
    if (w === 'stormy') h += cloudAt(2, 0) + cloudAt(34, -4) + cloudAt(64, 2);
    if (w === 'windy') h += cloudAt(70, 6) + '<span class="kite">🪁</span>';
    if (w === 'snowy') h += cloudAt(30, -2);
    if (w === 'stormy') h += '<span class="flash"></span><span class="bolt">⚡</span>';
    /* the ground */
    h += '<div class="ground"></div><span class="house">🏠</span><span class="tree">🌳</span>';
    if (w === 'snowy') h += '<span class="snowman">⛄</span>';
    /* the weather on top */
    if (w === 'rainy') h += bits('drop', 18, '', 2, 98, 20, 95, 0.9);
    if (w === 'stormy') h += bits('drop', 22, '', 2, 98, 20, 95, 0.55);
    if (w === 'snowy') h += bits('flake', 16, '❄', 2, 96, 5, 92, 4.2);
    if (w === 'windy') h += bits('gust', 3, '', 0, 80, 30, 60, 1.6) + bits('leaf', 5, '🍃', 0, 95, 25, 70, 2.4);
    if (w === 'foggy') {
      h += '<span class="fog" style="top:22%"></span><span class="fog" style="top:46%;animation-delay:-2s"></span>' +
           '<span class="fog" style="top:68%;animation-delay:-4s"></span>';
    }
    return h;
  }

  function paintScene(el, w) {
    el.className = 'scene w-' + w;
    el.innerHTML = sceneHTML(w);
  }

  function makeScene(w) {
    var d = document.createElement('div');
    paintScene(d, w);
    return d;
  }

  /* ================= Warm-up ================= */
  function buildTour() {
    els.tour.innerHTML = '';
    WEATHER.forEach(function (w) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tcard';
      b.appendChild(makeScene(w));
      var s = document.createElement('span');
      s.className = 'word';
      s.textContent = SYMBOL[w] + ' ' + cap(w);
      b.appendChild(s);
      b.addEventListener('click', function () {
        if (mode !== 'warmup') return;
        stopAll();
        markTour(w);
        speak(tourSay(w), function () { markTour(null); });
      });
      els.tour.appendChild(b);
    });
  }

  function markTour(w) {
    var cards = els.tour.querySelectorAll('.tcard');
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('saying', WEATHER[i] === w);
  }

  function enterWarmup() {
    stopAll();
    mode = 'warmup';
    els.half.textContent = 'Warm-up';
    els.lead.textContent = '👀 The weather patterns';
    els.nextBtn.textContent = 'Kick off ➜';
    buildTour();
    show(['lead', 'tour', 'btnRow'], ['sayBtn', 'nextBtn']);
    playTour();
  }

  function playTour() {
    var list = [{ say: WARM_SAY[0] }];
    WEATHER.forEach(function (w) {
      list.push({ act: function () { markTour(w); }, say: tourSay(w) });
    });
    list.push({ act: function () { markTour(null); }, say: WARM_SAY[1] });
    sequence(list);
  }

  /* ================= A round ================= */
  function pickOthers(w, count, first) {
    var pool = shuffle(WEATHER.filter(function (x) { return x !== w && x !== first; }));
    var out = first ? [first] : [];
    while (out.length < count) out.push(pool.shift());
    return out;
  }

  function enterRound() {
    stopAll();
    mode = 'round';
    attempts = 0;
    target = half === 1 ? queue1[round] : queue2[round];
    els.half.textContent = (half === 1 ? 'First half · ' : 'Second half · ') + (round + 1) + '/' + ROUNDS_PER_HALF;
    els.lead.textContent = '🔊 ' + askSay(half, target);
    if (half === 1) {
      /* three cards, then four */
      options = shuffle([target].concat(pickOthers(target, round < 3 ? 2 : 3)));
      paintScene(els.bigScene, target);
      buildCards();
      show(['lead', 'bigScene', 'cards', 'btnRow'], ['sayBtn']);
    } else {
      options = shuffle([target].concat(pickOthers(target, 2, LOOKALIKE[target])));
      buildPicks();
      show(['lead', 'picks', 'btnRow'], ['sayBtn']);
    }
    var intro = round === 0 ? introSay(half) : '';
    setTimeout(function () { if (mode === 'round' && attempts === 0) speak(intro + askLine()); }, 300);
  }

  function askLine() {
    return half === 1 ? askSay(1) + ' ' + choicesSay(options) : askSay(2, target);
  }

  function buildCards() {
    els.cards.innerHTML = '';
    options.forEach(function (w) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.innerHTML = '<span class="sym">' + SYMBOL[w] + '</span><span class="word">' + cap(w) + '</span>';
      b.addEventListener('click', function () { answer(w, b); });
      els.cards.appendChild(b);
    });
  }

  function buildPicks() {
    els.picks.innerHTML = '';
    options.forEach(function (w) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.appendChild(makeScene(w));
      b.addEventListener('click', function () { answer(w, b); });
      els.picks.appendChild(b);
    });
  }

  function optionEls() {
    return (half === 1 ? els.cards : els.picks).children;
  }

  function answer(w, el) {
    if (mode !== 'round') return;
    stopAll();
    if (w !== target) {
      attempts++;
      el.classList.remove('wrong');
      void el.offsetWidth;
      el.classList.add('wrong');
      if (attempts >= 2) {
        var list = optionEls();
        for (var i = 0; i < list.length; i++) {
          if (options[i] === target) list[i].classList.add('hint');
        }
      }
      speak(wrongSay(half, w, target, attempts));
      return;
    }

    var goal = attempts < 2;
    mode = 'finished';
    done.push({ w: target, goal: goal });
    var kids = optionEls();
    for (var k = 0; k < kids.length; k++) {
      kids[k].classList.remove('hint', 'wrong');
      kids[k].classList.toggle('right', options[k] === target);
      kids[k].classList.toggle('dim', options[k] !== target);
    }
    if (goal) {
      goals++;
      footballs++;
      save();
      renderScore(true);
      celebrate(22);
    } else {
      celebrate(8);
    }
    els.lead.textContent = (goal ? 'GOAL! ⚽ ' : '👍 ') + SYMBOL[target] + ' ' + cap(target);
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'Full time ➜') : 'Next ➜';
    show(half === 1 ? ['lead', 'bigScene', 'cards', 'btnRow'] : ['lead', 'picks', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak(goal ? goalSay(target) : praiseSay(target));
  }

  function nextRound() {
    stopAll();
    if (mode === 'warmup') { warmedUp = true; half = 1; round = 0; enterRound(); return; }
    if (mode !== 'finished') return;
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    enterRound();
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    done.forEach(function (d, i) {
      var b = document.createElement('button');
      b.className = 'chip' + (d.goal ? '' : ' nogoal');
      b.type = 'button';
      b.innerHTML = '<span class="sym">' + SYMBOL[d.w] + '</span>' + cap(d.w) + (d.goal ? ' ⚽' : '');
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(tourSay(done[i].w), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    done.forEach(function (d, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: tourSay(d.w)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = goals + ' ⚽ · Next: listen and find the weather.';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(goals));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = goals + ' ⚽ · ' + done.length + ' weather patterns';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(goals));
  }

  /* ================= Match ================= */
  function buildQueues() {
    queue1 = shuffle(WEATHER).slice(0, ROUNDS_PER_HALF);
    do {
      queue2 = shuffle(WEATHER).slice(0, ROUNDS_PER_HALF);
    } while (queue2[0] === queue1[ROUNDS_PER_HALF - 1]);
  }

  function startMatch() {
    stopAll();
    buildQueues();
    done = [];
    goals = 0;
    half = 1;
    round = 0;
    if (warmedUp) enterRound();
    else enterWarmup();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  /* tapping the big picture asks again */
  els.bigScene.addEventListener('click', function () {
    if (mode === 'round') { stopAll(); speak(askLine()); }
    else if (mode === 'finished') { stopAll(); speak(tourSay(target)); }
  });

  els.sayBtn.addEventListener('click', function () {
    stopAll();
    if (mode === 'warmup') playTour();
    else if (mode === 'round') speak(askLine());
    else if (mode === 'finished') speak(tourSay(target));
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
