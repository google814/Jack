<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c2d12">
<title>Jack's Times Tables</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Times Tables">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1e3a8a, #6d28d9 55%, #1e3a8a);
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    overflow: hidden;          /* the whole game always fits on one screen */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  a:focus-visible, button:focus-visible { outline: 3px solid #fde047; outline-offset: 2px; }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(0,0,0,.26);
    flex: 0 0 auto;
  }
  header .home {
    text-decoration: none; color: #f1f5f9;
    font-size: 1.5rem; line-height: 1;
    min-width: 44px; min-height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: rgba(255,255,255,.13);
  }
  header h1 { font-size: clamp(1rem, 2.8vw, 1.5rem); white-space: nowrap; }
  /* on a phone the score matters more than the title */
  @media (max-width: 560px) { header h1 { display: none; } }
  #score {
    flex: 1;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1px;
    font-size: 1.25rem;
    justify-content: flex-end;
    overflow: hidden;
    max-height: 2.2rem;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.2rem; margin-left: 6px; }
  #settingsBtn {
    background: none; border: none; color: #f1f5f9;
    font-size: 1.2rem; opacity: .5; cursor: pointer;
    min-width: 44px; min-height: 44px;
  }

  /* ---------- progress: how far through the hundred ---------- */
  #progress {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    background: rgba(0,0,0,.14);
  }
  #progBar {
    flex: 1;
    height: 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    overflow: hidden;
  }
  #progBar i {
    display: block; height: 100%; width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #86efac, #fde047);
    transition: width .5s ease;
  }
  #progText { font-weight: 800; font-size: .95rem; white-space: nowrap; min-width: 4.6em; text-align: right; }

  /* ---------- stage ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 22px);
    padding: clamp(8px, 1.6vh, 18px) 10px calc(clamp(8px, 1.6vh, 18px) + env(safe-area-inset-bottom));
    text-align: center;
    overflow: hidden;
  }
  .hidden { display: none !important; }

  #problem {
    flex: 0 0 auto;
    font-size: clamp(2.6rem, 11vmin, 6rem);
    font-weight: 900;
    line-height: 1.1;
    cursor: pointer;
    padding: .05em .35em;
    border-radius: 18px;
    text-shadow: 0 5px 16px rgba(0,0,0,.35);
    white-space: nowrap;
    max-width: 100%;
  }
  #problem:hover { background: rgba(255,255,255,.1); }

  /* counting up the table: 8, 16, 24 … 56 */
  #seq { display: flex; flex-wrap: wrap; gap: clamp(5px, 1.4vmin, 12px); justify-content: center; max-width: min(100%, 760px); }
  #seq .chip {
    min-width: clamp(42px, 10vmin, 78px);
    padding: clamp(5px, 1.2vmin, 12px) clamp(4px, 1vmin, 10px);
    border-radius: 14px;
    background: rgba(255,255,255,.16);
    font-size: clamp(1.1rem, 4.4vmin, 2.2rem);
    font-weight: 900;
    cursor: pointer;
    animation: pop .35s ease both;
  }
  #seq .chip.last { background: #fde047; color: #0f172a; }
  /* under the bags the count is only a small line */
  #seq { gap: clamp(3px, .9vmin, 8px); }
  #seq .chip {
    min-width: clamp(28px, 6vmin, 50px);
    padding: clamp(3px, .7vmin, 7px) clamp(3px, .7vmin, 7px);
    border-radius: 10px;
    font-size: clamp(.85rem, 2.6vmin, 1.35rem);
  }
  #seq .chip.cur { box-shadow: 0 0 0 3px #fde047; }

  /* ---------- the bags: a x b is a groups of b things ---------- */
  .groups {
    --s: 30px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: calc(var(--s) * .12);
    width: max-content;
    cursor: pointer;
  }
  .groups .grp {
    display: flex;
    align-items: center;
    white-space: nowrap;
    padding: calc(var(--s) * .05) calc(var(--s) * .2);
    border-radius: calc(var(--s) * .4);
    background: hsla(var(--h), 85%, 65%, .18);
    box-shadow: inset 0 0 0 2px hsla(var(--h), 85%, 72%, .45);
    transition: background .25s, box-shadow .25s;
  }
  .groups .grp.on { background: hsla(var(--h), 90%, 62%, .5); }
  .groups .grp.cur { box-shadow: inset 0 0 0 3px #fde047, 0 0 14px rgba(253,224,71,.7); }
  .groups .holder {
    display: inline-block; width: calc(var(--s) * 1.25);
    font-size: calc(var(--s) * .9); line-height: 1.15; text-align: center;
    margin-right: calc(var(--s) * .15);
  }
  .groups .it {
    display: inline-block; width: calc(var(--s) * 1.15);
    font-size: var(--s); line-height: 1.15; text-align: center;
  }
  .groups .tot {
    display: inline-block; min-width: 2.3em; text-align: right;
    font-size: calc(var(--s) * .8); font-weight: 900; color: #fde047;
    padding-left: calc(var(--s) * .2);
    visibility: hidden;
  }
  .groups .grp.on .tot { visibility: visible; }
  .groups.quiet { cursor: default; }
  .groups.quiet .grp { background: hsla(var(--h), 85%, 65%, .3); }
  .groups.quiet .tot { display: none; }
  /* while the bags are up the answer tiles are a bit lower */
  main.helping .tile { height: clamp(54px, 9vh, 104px); }

  #playRow { flex: 0 0 auto; display: flex; gap: 12px; justify-content: center; }

  /* ---------- answer tiles ---------- */
  #tiles {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(10px, 2.4vmin, 20px);
    width: min(100%, 440px);
  }
  /* iPad on its side: all four in one row */
  @media (min-width: 760px) and (min-aspect-ratio: 5/4) {
    #tiles { grid-template-columns: repeat(4, 1fr); width: min(100%, 860px); }
  }
  .tile {
    min-width: 44px; min-height: 44px;
    height: clamp(76px, 14vh, 130px);
    border: none;
    border-radius: 22px;
    font-family: inherit;
    font-size: clamp(2.2rem, 8.5vmin, 4rem);
    font-weight: 900;
    color: #0f172a;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
  }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .tile.shake { animation: shake .35s ease; }
  .tile:disabled { opacity: .3; cursor: default; box-shadow: none; }
  /* after the second miss: this is the one */
  .tile.hint {
    box-shadow: 0 0 0 6px #fde047, 0 0 28px 6px rgba(253,224,71,.85);
    animation: pulseWord 1.2s ease-in-out infinite;
  }
  #tiles.locked .tile { pointer-events: none; }
  #tiles.locked .tile:not(:disabled):not(.hint) { opacity: .55; }

  /* the countdown bar of the "listen and think" pause */
  #lockBar {
    flex: 0 0 auto;
    height: 10px;
    width: min(80%, 320px);
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    overflow: hidden;
  }
  #lockBar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: #fde047; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-weight: 800; color: #0f172a;
    border: none; border-radius: 999px; cursor: pointer;
    min-height: 44px;
    padding: clamp(9px, 1.6vh, 14px) clamp(18px, 4vw, 30px);
    font-size: clamp(.9rem, 2.4vmin, 1.2rem);
    background: #fde047;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn.ghost { background: rgba(255,255,255,.14); color: #f1f5f9; box-shadow: none; }
  #nextBtn { font-size: clamp(1.1rem, 3.2vmin, 1.6rem); padding: clamp(12px, 2vh, 18px) clamp(26px, 6vw, 44px); }

  /* ---------- the answer ---------- */
  #cheer { flex: 0 0 auto; font-size: clamp(1.2rem, 4vmin, 2.1rem); font-weight: 900; animation: pop .5s ease; }
  #equation {
    flex: 0 0 auto;
    font-size: clamp(2.4rem, 10vmin, 5.4rem);
    font-weight: 900;
    line-height: 1.25;
    cursor: pointer;
    padding: .1em .3em;
    border-radius: 22px;
    white-space: nowrap;
  }
  #equation:hover { background: rgba(255,255,255,.1); }
  .rainbow {
    display: inline-block;
    background: linear-gradient(90deg, #ff3b6b, #ff9f1a, #ffd60a, #2ecc71, #34d399, #8b5cf6, #ff3b6b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 900;
    animation: rainbowShift 2.5s linear infinite, pulseWord 1s ease-in-out infinite;
  }

  /* ---------- overlays ---------- */
  #startOverlay, #endOverlay, #netOverlay {
    position: fixed; inset: 0; z-index: 70;
    background: linear-gradient(160deg, #1e3a8a, #6d28d9 55%, #1e3a8a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 4vh, 32px); text-align: center; padding: 24px;
  }
  #netOverlay { background: rgba(15,23,42,.82); z-index: 65; cursor: pointer; }

  /* the little lesson: what "times" means */
  #lesson {
    position: fixed; inset: 0; z-index: 68;
    background: linear-gradient(160deg, #1e3a8a, #6d28d9 55%, #1e3a8a);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.6vh, 26px); text-align: center;
    padding: 56px 12px calc(20px + env(safe-area-inset-bottom));
    overflow: hidden;
  }
  #lessonClose { position: absolute; top: 10px; right: 12px; min-width: 48px; padding: 8px 14px; }
  #lessonEq { flex: 0 0 auto; font-size: clamp(2.2rem, 9vmin, 5rem); font-weight: 900; white-space: nowrap; }
  #lessonDots { flex: 0 0 auto; font-size: 1.2rem; letter-spacing: .4em; opacity: .85; }
  #lessonRow { flex: 0 0 auto; display: flex; gap: 14px; }
  #lessonNext { font-size: clamp(1.4rem, 4vmin, 2rem); padding: clamp(10px, 2vh, 16px) clamp(30px, 7vw, 50px); }
  #startOverlay h2, #endOverlay h2, #netOverlay h2 { font-size: clamp(1.5rem, 5.5vmin, 2.8rem); }
  #startOverlay p, #endOverlay p { max-width: 28ch; opacity: .9; font-size: clamp(.95rem, 2.4vmin, 1.2rem); }
  #endScore { font-size: clamp(1.4rem, 5vmin, 2.4rem); font-weight: 900; opacity: 1; }
  #playBtn {
    width: clamp(120px, 26vmin, 190px);
    height: clamp(120px, 26vmin, 190px);
    border-radius: 50%;
    font-size: clamp(3rem, 10vmin, 5rem);
    padding: 0;
    animation: pulseWord 1.6s ease-in-out infinite;
  }

  /* the net of ten — the same tens net as in Big Numbers, filling up */
  .net {
    --bs: clamp(40px, 12vmin, 84px);
    display: grid;
    grid-template-columns: repeat(5, var(--bs));
    gap: calc(var(--bs) * .14);
    padding: calc(var(--bs) * .26);
    border-radius: 18px;
    background: rgba(255,255,255,.13);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.4);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 2px, transparent 2px 14px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 2px, transparent 2px 14px);
  }
  .net span {
    width: var(--bs); height: var(--bs);
    display: grid; place-items: center;
    font-size: calc(var(--bs) * .86); line-height: 1;
    animation: bounceIn .6s ease both;
  }

  /* ---------- settings ---------- */
  #settingsPanel {
    position: fixed; top: 56px; right: 12px; z-index: 60;
    background: #fff; color: #0f172a;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; min-height: 44px; padding: 8px 14px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  /* ---------- toast + confetti ---------- */
  #feedback {
    position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%);
    background: rgba(30,27,75,.92); color: #f1f5f9;
    font-size: clamp(1rem, 2.8vmin, 1.4rem); font-weight: 700;
    padding: .55em 1.15em; border-radius: 999px;
    z-index: 50; pointer-events: none; white-space: nowrap;
    animation: pop .3s ease;
  }
  .confetti { position: fixed; top: -6vh; font-size: 1.8rem; animation: fall linear forwards; pointer-events: none; z-index: 80; }

  /* ---------- keyframes ---------- */
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes rainbowShift { to { background-position: 300% 0; } }
  @keyframes pulseWord { 50% { transform: scale(1.1); } }
  @keyframes bounceIn {
    0% { transform: translateY(-40px) scale(.3); opacity: 0; }
    55% { transform: translateY(6px) scale(1.15); opacity: 1; }
    75% { transform: translateY(-4px) scale(.95); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(400deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Jack's Times Tables</h1>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<div id="progress" aria-label="Progress">
  <div id="progBar"><i></i></div>
  <span id="progText">0 / 100</span>
</div>

<main>
  <!-- play -->
  <div id="problem" class="hidden"></div>
  <div id="groups" class="groups hidden"></div>
  <div id="seq" class="hidden"></div>
  <div id="tiles" class="hidden"></div>
  <div id="lockBar" class="hidden"><i></i></div>
  <div id="playRow" class="hidden">
    <button id="hearBtn" class="btn ghost">🔊 Hear it</button>
    <button id="lessonBtn" class="btn ghost" title="What does times mean?">💡</button>
  </div>

  <!-- the answer -->
  <div id="cheer" class="hidden"></div>
  <div id="equation" class="hidden"></div>
  <div id="ansGroups" class="groups quiet hidden"></div>
  <button id="hearAnswerBtn" class="btn ghost hidden">🔊 Hear it</button>
  <button id="nextBtn" class="btn hidden">Next ➜ ⚽</button>
</main>

<div id="startOverlay">
  <h2>✖️ Jack's Times Tables</h2>
  <p>One times one all the way to ten times ten.</p>
  <button id="playBtn" class="btn">▶</button>
</div>

<div id="lesson" class="hidden">
  <button id="lessonClose" class="btn ghost" title="Close">✕</button>
  <div id="lessonPic" class="groups"></div>
  <div id="lessonEq" class="hidden"></div>
  <div id="lessonDots"></div>
  <div id="lessonRow">
    <button id="lessonHear" class="btn ghost">🔊</button>
    <button id="lessonNext" class="btn">▶</button>
  </div>
</div>

<div id="netOverlay" class="hidden">
  <h2>🥅 Ten in the net!</h2>
  <div class="net" id="netBalls"></div>
</div>

<div id="endOverlay" class="hidden">
  <h2>🏁 Full time!</h2>
  <p id="endScore"></p>
  <button id="playAgainBtn" class="btn">▶ Play again</button>
</div>

<div id="settingsPanel" class="hidden">
  <button id="resetBtn">Start again</button>
</div>

<script>
(function () {
  'use strict';

  /* ==== TEXT-CORE ====
     Everything the game can say lives in here and nowhere else. It touches no
     DOM, so tools/phrases/times-tables.txt can be generated straight out of
     this block (node tools/gen-phrases.js times-tables) and can never drift. */

  var ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
              'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen',
              'seventeen', 'eighteen', 'nineteen'];
  var TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

  /* every number word from zero to one hundred: "twenty-three", "one hundred" */
  var NUM_WORDS = (function () {
    var a = [], n, t, o;
    for (n = 0; n <= 100; n++) {
      if (n < 20) { a.push(ONES[n]); continue; }
      if (n === 100) { a.push('one hundred'); continue; }
      t = Math.floor(n / 10); o = n % 10;
      a.push(TENS[t] + (o ? '-' + ONES[o] : ''));
    }
    return a;
  })();

  /* counting in a table: "count in eights" */
  var PLURAL = ['', 'ones', 'twos', 'threes', 'fours', 'fives', 'sixes', 'sevens', 'eights',
                'nines', 'tens'];

  var PRAISE = ['Goal!', 'Brilliant!', 'Super!', 'Great shot!'];

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* All hundred sums from 1 x 1 to 10 x 10, each exactly once, mixed up — but
     always in the same order: a fixed seed (Park-Miller, exact in plain
     doubles, so it is the same on every phone) shuffles them once. */
  var PROBLEMS = (function () {
    var list = [], a, b, i, j, t, seed = 20200614;
    for (a = 1; a <= 10; a++) for (b = 1; b <= 10; b++) list.push({ a: a, b: b });
    function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    for (i = list.length - 1; i > 0; i--) {
      j = Math.floor(rnd() * (i + 1));
      t = list[i]; list[i] = list[j]; list[j] = t;
    }
    /* the things in the bags change from sum to sum, always the same way round */
    for (i = 0; i < list.length; i++) list[i].t = i % 5;
    return list;
  })();

  function answerOf(p) { return p.a * p.b; }

  /* "Times means groups that are the same": a x b is a bags with b things in
     each. Fixed pairs of thing and holder, so the lines stay a short list. */
  var THEMES = [
    { one: 'apple',    many: 'apples',    icon: '🍎', box: 'bag',   boxes: 'bags',   inn: 'in',   boxIcon: '🛍️' },
    { one: 'football', many: 'footballs', icon: '⚽', box: 'bag',   boxes: 'bags',   inn: 'in',   boxIcon: '🛍️' },
    { one: 'star',     many: 'stars',     icon: '⭐', box: 'box',   boxes: 'boxes',  inn: 'in',   boxIcon: '📦' },
    { one: 'cookie',   many: 'cookies',   icon: '🍪', box: 'plate', boxes: 'plates', inn: 'on',   boxIcon: '🍽️' },
    { one: 'chick',    many: 'chicks',    icon: '🐥', box: 'box',   boxes: 'boxes',  inn: 'in',   boxIcon: '📦' }
  ];
  function themeOf(p) { return THEMES[(p.t || 0) % THEMES.length]; }
  function holders(p) { var th = themeOf(p); return p.a === 1 ? th.box : th.boxes; }

  /* the first lesson: two bags of three apples */
  var LESSON_DEMO = { a: 2, b: 3, t: 0 };
  var LESSON_START = 'Times means groups that are the same.';
  var TAP_COUNT = 'Tap to count.';

  /* "Seven bags." / "One bag." */
  function groupsHead(p) { return cap(NUM_WORDS[p.a]) + ' ' + holders(p) + '.'; }
  /* "Eight apples in each bag." / "Eight apples in the bag." / "One apple in each bag." */
  function groupsEach(p) {
    var th = themeOf(p);
    return cap(NUM_WORDS[p.b]) + ' ' + (p.b === 1 ? th.one : th.many) +
      ' ' + th.inn + (p.a === 1 ? ' the ' : ' each ') + th.box + '.';
  }
  /* "Seven bags. Eight apples in each bag." — two segments */
  function groupsIntro(p) { return groupsHead(p) + ' ' + groupsEach(p); }
  /* counting bag by bag: "eight", "sixteen" … — plain number words */
  function groupsCount(p) {
    var s = countSteps(p), w = [], i;
    for (i = 0; i < s.length; i++) w.push(NUM_WORDS[s[i]]);
    return w;
  }
  /* after the first miss: "Think of bags:" + "seven bags, eight in each." */
  function hintLead(p) { return 'Think of ' + themeOf(p).boxes + ':'; }
  function hintBody(p) {
    return NUM_WORDS[p.a] + ' ' + holders(p) + ', ' + NUM_WORDS[p.b] + ' ' + themeOf(p).inn + (p.a === 1 ? ' it.' : ' each.');
  }
  function hintLine(p) { return hintLead(p) + ' ' + hintBody(p); }
  /* on the answer screen: "Seven bags of eight is fifty-six." */
  function bagsSentence(p) {
    return cap(NUM_WORDS[p.a]) + ' ' + holders(p) + ' of ' + NUM_WORDS[p.b] + ' is ' + NUM_WORDS[answerOf(p)] + '.';
  }
  /* the three steps of the lesson, one per tap of ▶ */
  function lessonLines(p) {

    var tiles = els.tiles.querySelectorAll('.tile'), i;
    for (i = 0; i < tiles.length; i++) {
      if (parseInt(tiles[i].getAttribute('data-value'), 10) === answerOf(p)) tiles[i].classList.add('hint');
    }
  }

  /* after two misses: the sum as bags, counted bag by bag, then the right tile lights up */
  function showBags(p) {
    renderGroups(els.groups, p);
    showCount(p);
    els.groups.classList.remove('hidden');
    els.main.classList.add('helping');
    fitGroups(els.groups, els.main, FIT_PLAY);
  }
  function talkBags(p, lead) {
    speakThen(lead + groupsIntro(p), 0.9, function () {
      runCount(els.groups, function () { lightTile(p); });
    }, 6000);
  }

  /* the pause after a wrong tap: no tile takes a tap, a bar counts down */
  function lockTiles(then) {
    setLocked(true);
    els.lockBar.classList.remove('hidden');
    els.lockFill.style.transition = 'none';
    els.lockFill.style.width = '100%';
    void els.lockFill.offsetWidth;
    els.lockFill.style.transition = 'width ' + LOCK_MS + 'ms linear';
    els.lockFill.style.width = '0%';
    clearTimeout(timers.lock);
    timers.lock = setTimeout(function () {
      timers.lock = null;
      setLocked(false);
      els.lockBar.classList.add('hidden');
      if (then) then();
    }, LOCK_MS);
  }

  function onTile(tile, num) {
    var p = current();
    if (locked || tile.disabled) return;
    if (num === answerOf(p)) {
      setLocked(true);          /* no second football for a double tap */
      clearTimeout(timers.lock);
      if (timers.count) { clearTimeout(timers.count); timers.count = null; stopSpeaking(); }  /* stop counting bags */
      els.lockBar.classList.add('hidden');
      footballs++;
      save();
      renderScore(true);
      renderProgress(probIndex + 1);
      var solved = probIndex + 1;
      if (solved % 10 === 0 && solved < PROBLEMS.length) {
        showNet();
        timers.next = setTimeout(enterAnswer, NET_MS);
      } else {
        timers.next = setTimeout(enterAnswer, 350);
      }
      return;
    }
    wrong++;
    tile.disabled = true;
    tile.classList.remove('shake');
    void tile.offsetWidth;
    tile.classList.add('shake');
    showFeedback('Try again 🙂');
    if (wrong >= 2) {
      lockTiles(null);          /* first, so the bags are sized with the bar on screen */
      showBags(p);
      talkBags(p, 'Try again ... ');
    } else {
      speak('Try again', 0.95);
      lockTiles(function () {
        var q = current();
        speak('Listen again. ' + questionText(q) + ' ' + hintLine(q), 0.9);
      });
    }
  }

  /* every ten right: a whole net of footballs */
  function showNet() {
    var i;
    els.netBalls.innerHTML = '';
    for (i = 0; i < 10; i++) {
      var b = document.createElement('span');
      b.textContent = '⚽';
      b.style.animationDelay = (i * 0.12) + 's';
      els.netBalls.appendChild(b);
    }
    els.netOverlay.classList.remove('hidden');
    celebrate(36);
    speak('Ten in the net!', 0.9);
    /* closed by a timer, not animationend: with reduced motion there is no animation */
    clearTimeout(timers.net);
    timers.net = setTimeout(function () { els.netOverlay.classList.add('hidden'); }, NET_MS);
  }

  /* ================= The answer ================= */
  function enterAnswer() {
    var p = current();
    clearTimers();
    setLocked(false);
    els.netOverlay.classList.add('hidden');

    celebrate(24);

    els.equation.innerHTML = '';
    els.equation.appendChild(document.createTextNode(p.a + ' × ' + p.b + ' = '));
    var span = document.createElement('span');
    span.className = 'rainbow';
    span.textContent = answerOf(p);
    els.equation.appendChild(span);

    var isLast = probIndex === PROBLEMS.length - 1;
    var praise = isLast ? 'Well done, Jack!' : PRAISE[Math.floor(Math.random() * PRAISE.length)];
    els.cheer.textContent = isLast ? '🏆 That was the last one!' : praise + ' ⚽';
    els.nextBtn.textContent = isLast ? 'Full time ➜ 🏁' : 'Next ➜ ⚽';

    show('answer');
    /* the same bags, small, to say it once more */
    renderGroups(els.ansGroups, p);
    els.ansGroups.classList.remove('hidden');
    fitGroups(els.ansGroups, els.main, FIT_ANSWER);
    speak(praise + ' ' + answerSentence(p) + ' ' + bagsSentence(p), 0.9);
  }

  function nextProblem() {
    if (probIndex >= PROBLEMS.length - 1) {
      probIndex = 0;            /* the hundred are done: the next game starts at the top */
      save();
      enterFullTime();
      return;
    }
    probIndex++;
    save();
    enterPlay();
  }

  function enterFullTime() {
    clearTimers();
    renderProgress(PROBLEMS.length);
    els.endScore.textContent = '⚽ ' + footballs;
    els.endOverlay.classList.remove('hidden');
    celebrate(50);
    speak('Full time! Well done, Jack!', 0.9);
  }

  /* ================= The lesson =================
     Three taps of ▶, everything said out loud: the same groups, how many
     bags and how many in each (tap the bags to count), then the sum. */
  var lesson = { p: null, step: 0, first: false };

  function openLesson(p, first) {
    clearTimeout(timers.count);
    lesson.p = p;
    lesson.first = !!first;
    renderGroups(els.lessonPic, p);
    els.lessonEq.textContent = p.a + ' × ' + p.b + ' = ' + answerOf(p);
    els.lesson.classList.remove('hidden');
    lessonStep(0, first ? "Jack's Times Tables. " : '');
  }

  function lessonStep(i, lead) {
    lesson.step = i;
    els.lessonDots.textContent = ['●○○', '●●○', '●●●'][i];
    els.lessonEq.classList.toggle('hidden', i < 2);
    els.lessonNext.textContent = i < 2 ? '▶' : (lesson.first ? '▶ ⚽' : '✔');
    if (i === 2) {
      /* every bag counted: the last number is the answer */
      var rows = els.lessonPic.querySelectorAll('.grp'), k;
      for (k = 0; k < rows.length; k++) rows[k].classList.add('on');
      els.lessonPic._n = lesson.p.a;
    }
    fitGroups(els.lessonPic, els.lesson, FIT_LESSON);
    speak((lead || '') + lessonLines(lesson.p)[i], 0.9);
  }

  function closeLesson() {
    clearTimeout(timers.count);
    els.lesson.classList.add('hidden');
    try { localStorage.setItem('jackTimesIntroSeen', '1'); } catch (e) {}
    if (lesson.first) {
      lesson.first = false;
      enterPlay("Let's go!");
    } else {
      if (wrong >= 2) lightTile(current());   /* the count may have been cut short */
      speak(questionText(current()), 0.9);
    }
  }

  els.lessonNext.addEventListener('click', function () {
    if (lesson.step < 2) lessonStep(lesson.step + 1);
    else closeLesson();
  });
  els.lessonHear.addEventListener('click', function () { speak(lessonLines(lesson.p)[lesson.step], 0.9); });
  els.lessonClose.addEventListener('click', closeLesson);
  els.lessonPic.addEventListener('click', function () { countNext(els.lessonPic); });
  els.lessonBtn.addEventListener('click', function () { openLesson(current(), false); });

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasTTS) pickVoice();
    els.startOverlay.remove();
    var seen = false;
    try { seen = localStorage.getItem('jackTimesIntroSeen') === '1'; } catch (e) {}
    if (seen) enterPlay("Jack's Times Tables. Let's go!");
    else openLesson(LESSON_DEMO, true);
  });

  els.problem.addEventListener('click', function () { speak(questionText(current()), 0.9); });
  els.hearBtn.addEventListener('click', function () {
    var p = current();
    if (wrong >= 2) talkBags(p, questionText(p) + ' ');
    else speak(questionText(p), 0.9);
  });
  els.groups.addEventListener('click', function () { countNext(els.groups); });
  els.ansGroups.addEventListener('click', function () { speak(bagsSentence(current()), 0.9); });
  els.equation.addEventListener('click', function () { speak(answerSentence(current()), 0.9); });
  els.hearAnswerBtn.addEventListener('click', function () {
    var p = current();
    speak(answerSentence(p) + ' ' + bagsSentence(p), 0.9);
  });
  els.nextBtn.addEventListener('click', nextProblem);
  els.netOverlay.addEventListener('click', function () { els.netOverlay.classList.add('hidden'); });

  els.playAgainBtn.addEventListener('click', function () {
    probIndex = 0;
    save();
    els.endOverlay.classList.add('hidden');
    enterPlay();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Clear the footballs and start from the first sum?')) {
      footballs = 0;
      probIndex = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
      els.endOverlay.classList.add('hidden');
      enterPlay();
    }
  });

  renderScore(false);
  renderProgress(probIndex);
})();
</script>
</body>
</html>
