<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Jack's Numbers ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Numbers">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1e3a8a 0%, #1d4ed8 50%, #1e3a8a 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: rgba(0,0,0,.22);
  }
  header .home {
    text-decoration: none;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.2rem, 3.5vw, 1.8rem); flex: 0 0 auto; }
  #score {
    flex: 1;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 2px;
    font-size: 1.5rem;
    min-height: 1.8rem;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.4rem; margin-left: 6px; }
  #settingsBtn {
    background: none;
    border: none;
    font-size: 1.2rem;
    opacity: .45;
    cursor: pointer;
    padding: 6px;
  }

  /* ---------- Main stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    padding: 3vh 4vw calc(3vh + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- Play: problem + balls + tiles ---------- */
  #problem {
    font-size: clamp(3.5rem, 12vmin, 7rem);
    font-weight: 900;
    line-height: 1.1;
    cursor: pointer;
    padding: 0 .3em;
    border-radius: 20px;
    text-shadow: 0 6px 18px rgba(0,0,0,.35);
    transition: background .15s;
  }
  #problem:hover { background: rgba(255,255,255,.12); }

  #balls {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vmin, 28px);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 950px;
  }
  .ball-group {
    display: flex;
    gap: clamp(6px, 1.5vmin, 12px);
    flex-wrap: wrap;
    justify-content: center;
    padding: clamp(8px, 1.5vmin, 14px);
    border-radius: 22px;
    background: rgba(255,255,255,.10);
  }
  .ball-group.frame {
    display: grid;
    grid-template-columns: repeat(5, auto);
    justify-items: center;
  }
  /* break after the first ten so twelve reads as "ten and two" */
  .ball-group.frame .cball:nth-child(n+11) { margin-top: clamp(8px, 2vmin, 18px); }
  .ball-group.second { background: rgba(255,214,10,.16); }
  .ball-op {
    font-size: clamp(2.2rem, 6vmin, 3.4rem);
    font-weight: 900;
    opacity: .9;
  }
  .cball {
    position: relative;
    border: none;
    background: none;
    font-size: clamp(2.4rem, 6.5vmin, 3.6rem);
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    border-radius: 50%;
    transition: transform .12s ease;
    font-family: inherit;
  }
  .cball:hover { transform: scale(1.12); }
  .cball:active { transform: scale(.9); }
  .cball.counted { box-shadow: 0 0 0 4px #fbbf24 inset, 0 0 0 4px #fbbf24; border-radius: 50%; }
  .cball.counted .num {
    position: absolute;
    top: -10px;
    right: -6px;
    background: #fbbf24;
    color: #1e293b;
    font-size: .95rem;
    font-weight: 900;
    min-width: 1.5em;
    padding: 1px 4px;
    border-radius: 999px;
    animation: pop .3s ease;
  }
  .cball.gone { opacity: .28; }
  .cball.gone::after {
    content: '✖';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f87171;
    font-size: 1.2em;
    font-weight: 900;
  }
  .cball.pop { animation: pop .35s ease; }

  #tiles {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tile {
    width: clamp(76px, 12vmin, 104px);
    height: clamp(76px, 12vmin, 104px);
    border: none;
    border-radius: 18px;
    font-size: clamp(2.4rem, 7vmin, 3.6rem);
    font-weight: 900;
    color: #1e293b;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 6px 16px rgba(0,0,0,.3);
    transition: transform .12s ease, opacity .3s ease;
  }
  .tile:hover { transform: scale(1.07); }
  .tile:active { transform: scale(.92); }
  .tile.shake { animation: shake .35s ease; }

  /* ---------- Buttons ---------- */
  .btn {
    border: none;
    cursor: pointer;
    color: #fff;
    font-weight: 800;
    font-family: inherit;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    transition: transform .12s ease;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(.94); }
  .btn.big {
    font-size: clamp(1.6rem, 4.5vmin, 2.4rem);
    padding: .6em 1.4em;
    background: linear-gradient(145deg, #f59e0b, #d97706);
  }
  .btn.speak {
    font-size: clamp(1.3rem, 3.6vmin, 1.8rem);
    padding: .45em 1em;
    background: linear-gradient(145deg, #10b981, #047857);
  }

  /* ---------- Celebrate ---------- */
  #cheer { font-size: clamp(1.6rem, 4.5vmin, 2.4rem); font-weight: 900; animation: pop .5s ease; }
  #equation {
    font-size: clamp(3rem, 10vmin, 6rem);
    font-weight: 900;
    line-height: 1.3;
    cursor: pointer;
    padding: .2em .5em;
    border-radius: 24px;
    transition: background .15s;
  }
  #equation:hover { background: rgba(255,255,255,.1); }
  .rainbow {
    display: inline-block;
    background: linear-gradient(90deg, #ff3b6b, #ff9f1a, #ffd60a, #2ecc71, #34d399, #8b5cf6, #ff3b6b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 900;
    animation: rainbowShift 2.5s linear infinite, pulseWord 1s ease-in-out infinite;
  }

  /* ---------- Start overlay ---------- */
  #startOverlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #1e3a8a, #1d4ed8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5vh;
    z-index: 50;
  }
  #startOverlay h2 { font-size: clamp(2rem, 7vmin, 3.5rem); text-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #playBtn {
    width: clamp(140px, 28vmin, 220px);
    height: clamp(140px, 28vmin, 220px);
    border-radius: 50%;
    font-size: clamp(3.5rem, 11vmin, 6rem);
    background: linear-gradient(145deg, #f59e0b, #d97706);
    animation: pulseWord 1.6s ease-in-out infinite;
  }

  /* ---------- Settings panel ---------- */
  #settingsPanel {
    position: fixed;
    top: 60px;
    right: 12px;
    background: #fff;
    color: #1e293b;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 60;
    font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit;
    font-size: .95rem;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    background: #f1f5f9;
    cursor: pointer;
  }

  /* ---------- Feedback toast ---------- */
  #feedback {
    position: fixed;
    left: 50%;
    bottom: 9vh;
    transform: translateX(-50%);
    background: rgba(15,23,42,.92);
    color: #fff;
    font-size: clamp(1.1rem, 3vmin, 1.5rem);
    font-weight: 700;
    padding: .6em 1.2em;
    border-radius: 999px;
    z-index: 40;
    animation: pop .3s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ---------- Confetti ---------- */
  .confetti {
    position: fixed;
    top: -3vh;
    font-size: 1.4rem;
    z-index: 45;
    animation: fall linear forwards;
    pointer-events: none;
  }

  /* ---------- Keyframes ---------- */
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes rainbowShift { to { background-position: 300% 0; } }
  @keyframes pulseWord { 50% { transform: scale(1.14); } }
  @keyframes bounceIn {
    0% { transform: translateY(-60px) scale(.3); opacity: 0; }
    55% { transform: translateY(8px) scale(1.15); opacity: 1; }
    75% { transform: translateY(-6px) scale(.95); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .7; } }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Jack's Numbers</h1>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <!-- Play -->
  <div id="problem" class="hidden"></div>
  <div id="balls" class="hidden"></div>
  <button id="speakProblemBtn" class="btn speak hidden">🔊 Hear it</button>
  <div id="tiles" class="hidden"></div>

  <!-- Celebrate -->
  <div id="cheer" class="hidden"></div>
  <div id="equation" class="hidden"></div>
  <button id="speakAnswerBtn" class="btn speak hidden">🔊 Hear it</button>
  <button id="nextBtn" class="btn big hidden">Next ➜ ⚽</button>
</main>

<div id="startOverlay">
  <h2>⚽ Jack's Numbers 🔢</h2>
  <button id="playBtn" class="btn">▶</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="max20Toggle"> Numbers to 20</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Problems ================= */
  var PROBLEMS = [
    // Level 1: counting 1-10
    { type: 'count', a: 2 },
    { type: 'count', a: 3 },
    { type: 'count', a: 4 },
    { type: 'count', a: 5 },
    { type: 'count', a: 6 },
    { type: 'count', a: 7 },
    { type: 'count', a: 8 },
    { type: 'count', a: 9 },
    { type: 'count', a: 10 },
    { type: 'count', a: 7 },
    // Level 2: addition up to 10
    { type: 'add', a: 1, b: 1 },
    { type: 'add', a: 2, b: 1 },
    { type: 'add', a: 2, b: 2 },
    { type: 'add', a: 3, b: 1 },
    { type: 'add', a: 3, b: 2 },
    { type: 'add', a: 4, b: 2 },
    { type: 'add', a: 3, b: 3 },
    { type: 'add', a: 5, b: 2 },
    { type: 'add', a: 4, b: 4 },
    { type: 'add', a: 6, b: 3 },
    // Level 3: subtraction, result >= 0
    { type: 'sub', a: 2, b: 1 },
    { type: 'sub', a: 3, b: 1 },
    { type: 'sub', a: 3, b: 2 },
    { type: 'sub', a: 4, b: 2 },
    { type: 'sub', a: 5, b: 1 },
    { type: 'sub', a: 5, b: 3 },
    { type: 'sub', a: 6, b: 2 },
    { type: 'sub', a: 7, b: 3 },
    { type: 'sub', a: 8, b: 4 },
    { type: 'sub', a: 10, b: 5 }
  ];

  /* Only played when "Numbers to 20" is on. Counting first, then bridging ten. */
  var PROBLEMS_20 = [
    // Level 4: counting 11-20 (shown as two ten frames)
    { type: 'count', a: 12 },
    { type: 'count', a: 15 },
    { type: 'count', a: 18 },
    { type: 'count', a: 20 },
    // Level 5: addition over ten
    { type: 'add', a: 10, b: 5 },
    { type: 'add', a: 8,  b: 5 },
    { type: 'add', a: 9,  b: 4 },
    { type: 'add', a: 7,  b: 6 },
    { type: 'add', a: 8,  b: 8 },
    { type: 'add', a: 9,  b: 7 },
    { type: 'add', a: 6,  b: 7 },
    { type: 'add', a: 9,  b: 9 },
    // Level 6: subtraction inside twenty
    { type: 'sub', a: 15, b: 3 },
    { type: 'sub', a: 12, b: 4 },
    { type: 'sub', a: 17, b: 5 },
    { type: 'sub', a: 14, b: 6 },
    { type: 'sub', a: 18, b: 9 },
    { type: 'sub', a: 16, b: 7 },
    { type: 'sub', a: 20, b: 8 },
    { type: 'sub', a: 20, b: 10 }
  ];

  var NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight',
                   'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen',
                   'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
  var TILE_COLORS = ['#fde047', '#86efac', '#93c5fd', '#f9a8d4', '#fdba74', '#c4b5fd', '#67e8f9'];
  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '💛', '💙', '🧡'];

  function answerOf(p) {
    if (p.type === 'count') return p.a;
    if (p.type === 'add') return p.a + p.b;
    return p.a - p.b;
  }
  function questionText(p) {
    if (p.type === 'count') return 'How many footballs?';
    if (p.type === 'add') return 'What is ' + NUM_WORDS[p.a] + ' plus ' + NUM_WORDS[p.b] + '?';
    return 'What is ' + NUM_WORDS[p.a] + ' take away ' + NUM_WORDS[p.b] + '?';
  }
  function answerText(p) {
    var r = answerOf(p);
    if (p.type === 'count') return NUM_WORDS[r] + ' footballs!';
    if (p.type === 'add') return NUM_WORDS[p.a] + ' plus ' + NUM_WORDS[p.b] + ' makes ' + NUM_WORDS[r] + '!';
    return NUM_WORDS[p.a] + ' take away ' + NUM_WORDS[p.b] + ' makes ' + NUM_WORDS[r] + '!';
  }

  /* ================= State ================= */
  var footballs = parseInt(localStorage.getItem('jackMathFootballs') || '0', 10) || 0;
  var probIndex = parseInt(localStorage.getItem('jackMathIndex') || '0', 10) || 0;
  var maxNum = parseInt(localStorage.getItem('jackMathMax') || '10', 10) === 20 ? 20 : 10;

  /* The sums up to ten always come first, so turning "to 20" on never makes an
     earlier sum harder — it only adds more after them. */
  function problems() { return maxNum === 20 ? PROBLEMS.concat(PROBLEMS_20) : PROBLEMS; }
  if (probIndex >= problems().length) probIndex = 0;
  var misses = 0;
  var countStep = 0;

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), problem: $('problem'), balls: $('balls'),
    speakProblemBtn: $('speakProblemBtn'), tiles: $('tiles'),
    cheer: $('cheer'), equation: $('equation'),
    speakAnswerBtn: $('speakAnswerBtn'), nextBtn: $('nextBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    resetBtn: $('resetBtn'), max20Toggle: $('max20Toggle')
  };

  function save() {
    localStorage.setItem('jackMathFootballs', String(footballs));
    localStorage.setItem('jackMathIndex', String(probIndex));
    localStorage.setItem('jackMathMax', String(maxNum));
  }

  /* ================= Voice =================
     The browser's own voice sounds like a computer, so every line these
     games say is pre-rendered with a neural en-GB voice (tools/build-audio.py)
     and played back through Web Audio. speechSynthesis is only the fallback
     for a line that has no clip. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/math-game/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment: "cat! ... The cat sat on the mat."
     is the word clip followed by the sentence clip. Written out by hand
     because a lookbehind regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    var BREAK = /^\s*(?:!\s*\.\.\.\s*|\.\.\.\s*)/;
    while (i < t.length) {
      var m = BREAK.exec(t.slice(i));
      if (m && m[0].length) {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
        i += m[0].length;
        continue;
      }
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?' || ch === ':') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      /* nothing has been tapped yet, so there is no audio context to decode
         into — just pull the file into the browser cache and try again later */
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips for the screen he is about to tap on, so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var f = clipFor(list[i]);
        if (f && !buffers[f]) loadClip(f).catch(function () {});
      }
    });
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Samantha|Martha|Serena|Kate|Karen|Moira|Zira|Aria|Jenny|Susan|Fiona|Tessa)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) || find(en, good) ||
      find(en, /Google UK English Female/i) ||
      find(gb, /female|woman/i) || find(gb, female) ||
      find(en, /female|woman/i) || find(en, female) ||
      gb[0] || en[0] || vs[0] || null;
  }

  /* the fallback: only used for a line that has no clip */
  function say(text, rate, pitch, my, done) {
    if (!hasSpeech) { if (done) done(); return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = voice ? voice.lang : 'en-GB';
      u.rate = (rate || 0.95);
      u.pitch = pitch || 1;
      u.onend = function () { if (my === speakToken && done) done(); };
      u.onerror = u.onend;
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { if (done) done(); }
  }

  function speak(text, rate, pitch) {
    if (!hasTTS) return;
    stopSpeaking();
    var my = speakToken;
    var parts = segments(text);
    if (!parts.length) return;
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken || i >= parts.length) return;
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) onward();
            };
            sources.push(src);
            window.__clipPlays++;
            src.start(0);
          }, function () { say(parts[i], rate, pitch, my, onward); });
        } else {
          say(parts[i], rate, pitch, my, onward);
        }
      })(0);
    });
  }

  window.__speak = speak;    /* lets a browser check drive the voice from outside */

  if (hasSpeech) {
    pickVoice();
    speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }
  if (!hasTTS) {
    els.speakProblemBtn.style.display = 'none';
    els.speakAnswerBtn.style.display = 'none';
  }

  /* ================= UI helpers ================= */
  function showFeedback(text) {
    var old = $('feedback');
    if (old) old.remove();
    var el = document.createElement('div');
    el.id = 'feedback';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }

  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 15) {
      for (var i = 0; i < footballs; i++) {
        var isNew = justScored && i === footballs - 1;
        html += '<span class="ball' + (isNew ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var STATE_ELS = {
    play: ['problem', 'balls', 'speakProblemBtn', 'tiles'],
    celebrate: ['cheer', 'equation', 'speakAnswerBtn', 'nextBtn']
  };

  function show(state) {
    [].concat(STATE_ELS.play, STATE_ELS.celebrate).forEach(function (id) { els[id].classList.add('hidden'); });
    STATE_ELS[state].forEach(function (id) { els[id].classList.remove('hidden'); });
  }

  /* ================= Play state ================= */
  function current() { return problems()[probIndex]; }

  function makeBall(countable) {
    var b = document.createElement('button');
    b.className = 'cball' + (countable ? '' : ' gone');
    b.textContent = '⚽';
    if (countable) {
      b.addEventListener('click', function () { onBall(b); });
    } else {
      b.disabled = true;
    }
    return b;
  }

  function ballGroup(count, countable, extraClass) {
    var g = document.createElement('div');
    /* more than six balls are laid out five to a row — the ten frame they use at
       school, so twelve reads as "ten and two" instead of a random heap */
    g.className = 'ball-group' + (count > 6 ? ' frame' : '') + (extraClass ? ' ' + extraClass : '');
    for (var i = 0; i < count; i++) g.appendChild(makeBall(countable));
    return g;
  }

  function onBall(ball) {
    var total = els.balls.querySelectorAll('.cball:not(.gone)').length;
    if (ball.classList.contains('counted')) return;
    countStep++;
    speak(String(countStep), 0.9);
    ball.classList.add('counted', 'pop');
    var badge = document.createElement('span');
    badge.className = 'num';
    badge.textContent = countStep;
    ball.appendChild(badge);
    if (countStep >= total) {
      // full count done: clear the marks after a moment so he can count again
      setTimeout(function () {
        countStep = 0;
        els.balls.querySelectorAll('.cball.counted').forEach(function (b) {
          b.classList.remove('counted', 'pop');
          var n = b.querySelector('.num');
          if (n) n.remove();
        });
      }, 2000);
    }
  }

  function enterPlay() {
    var p = current();
    misses = 0;
    countStep = 0;

    if (p.type === 'count') els.problem.textContent = '⚽ = ?';
    else if (p.type === 'add') els.problem.textContent = p.a + ' + ' + p.b + ' = ?';
    else els.problem.textContent = p.a + ' − ' + p.b + ' = ?';

    els.balls.innerHTML = '';
    if (p.type === 'count') {
      els.balls.appendChild(ballGroup(p.a, true));
    } else if (p.type === 'add') {
      els.balls.appendChild(ballGroup(p.a, true));
      var plus = document.createElement('span');
      plus.className = 'ball-op';
      plus.textContent = '+';
      els.balls.appendChild(plus);
      els.balls.appendChild(ballGroup(p.b, true, 'second'));
    } else {
      // subtraction: one group of a balls, the last b crossed out
      var g = document.createElement('div');
      g.className = 'ball-group' + (p.a > 6 ? ' frame' : '');
      for (var i = 0; i < p.a; i++) g.appendChild(makeBall(i < p.a - p.b));
      els.balls.appendChild(g);
    }

    var answer = answerOf(p);
    var options = [answer];
    var candidates = shuffle([answer - 3, answer - 2, answer - 1, answer + 1, answer + 2, answer + 3]);
    candidates.forEach(function (c) {
      if (options.length < 4 && c >= 0 && c <= maxNum && options.indexOf(c) === -1) options.push(c);
    });
    // tiny answers near 0 can run out of candidates in range; top up upwards
    for (var extra = answer + 4; options.length < 4; extra++) options.push(extra);

    els.tiles.innerHTML = '';
    shuffle(options).forEach(function (num, i) {
      var tile = document.createElement('button');
      tile.className = 'tile';
      tile.textContent = num;
      tile.style.background = TILE_COLORS[i % TILE_COLORS.length];
      tile.addEventListener('click', function () { onTile(tile, num); });
      els.tiles.appendChild(tile);
    });

    show('play');
    /* warm every clip this screen can need: the question, the tiles, the
       counting numbers and the cheer that follows */
    var warm = [questionText(p), answerText(p), NUM_WORDS[answer]];
    options.forEach(function (n) { warm.push(String(n)); });
    for (var w = 1; w <= (p.type === 'add' ? p.a + p.b : p.a); w++) warm.push(String(w));
    preload(warm);
    speak(questionText(p), 0.85);
  }

  function onTile(tile, num) {
    var p = current();
    if (num === answerOf(p)) {
      speak(String(num), 0.9);
      footballs++;
      save();
      renderScore(true);
      setTimeout(function () { enterCelebrate(); }, 350);
    } else {
      speak(String(num), 0.9);
      tile.classList.remove('shake');
      void tile.offsetWidth;
      tile.classList.add('shake');
      misses++;
      showFeedback('Try again! 🙂 Count the balls!');
      if (misses >= 2) {
        misses = 0;
        setTimeout(function () { speak(questionText(p), 0.8); }, 900);
      }
    }
  }

  /* ================= Celebrate state ================= */
  function enterCelebrate() {
    var p = current();
    var answer = answerOf(p);

    celebrate(30);

    els.equation.innerHTML = '';
    var pre;
    if (p.type === 'count') pre = '⚽ = ';
    else if (p.type === 'add') pre = p.a + ' + ' + p.b + ' = ';
    else pre = p.a + ' − ' + p.b + ' = ';
    els.equation.appendChild(document.createTextNode(pre));
    var span = document.createElement('span');
    span.className = 'rainbow';
    span.textContent = answer;
    els.equation.appendChild(span);

    var isLast = probIndex === PROBLEMS.length - 1;
    els.cheer.textContent = isLast ? '🏆 CHAMPION! You did ALL the sums! 🏆' : 'GOAL! ⚽ Well done, Jack!';
    els.cheer.classList.remove('pop');
    void els.cheer.offsetWidth;

    show('celebrate');
    speak(NUM_WORDS[answer] + '! ... ' + answerText(p), 0.85);
    if (isLast) celebrate(60);
  }

  function nextProblem() {
    probIndex = (probIndex + 1) % problems().length;
    save();
    enterPlay();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasTTS) {
      pickVoice();
      speak("Let's count!", 0.9);
    }
    els.startOverlay.remove();
    enterPlay();
  });

  els.problem.addEventListener('click', function () { speak(questionText(current()), 0.85); });
  els.speakProblemBtn.addEventListener('click', function () { speak(questionText(current()), 0.85); });
  els.equation.addEventListener('click', function () { speak(answerText(current()), 0.85); });
  els.speakAnswerBtn.addEventListener('click', function () { speak(answerText(current()), 0.85); });
  els.nextBtn.addEventListener('click', nextProblem);

  els.max20Toggle.checked = maxNum === 20;
  els.max20Toggle.addEventListener('change', function () {
    maxNum = this.checked ? 20 : 10;
    if (probIndex >= problems().length) probIndex = 0;
    save();
    els.settingsPanel.classList.add('hidden');
    enterPlay();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs and start from the first sum?')) {
      footballs = 0;
      probIndex = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
      enterPlay();
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
