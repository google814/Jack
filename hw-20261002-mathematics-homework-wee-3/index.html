<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Part Whole Model ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Part Whole">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #172554 0%, #1d4ed8 52%, #172554 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }
  .lead .r { color: #fca5a5; }
  .lead .b { color: #93c5fd; }
  .lead .w { color: #fde047; }

  /* ---------- The dots (like the worksheet) ---------- */
  #dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 7vmin, 56px);
    padding: clamp(10px, 2vmin, 18px) clamp(16px, 4vmin, 30px);
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    min-height: calc(var(--d) * 2 + 40px);
    --d: clamp(22px, 6.2vmin, 46px);
  }
  .grp {
    display: grid;
    gap: clamp(5px, 1.2vmin, 10px);
    padding: 6px;
    border-radius: 16px;
    cursor: pointer;
    transition: background .25s ease;
  }
  .grp.got.red  { background: #fee2e2; }
  .grp.got.blue { background: #dbeafe; }
  .dot {
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: calc(var(--d) * .55);
    color: #fff;
    line-height: 1;
  }
  .red  .dot { background: #ef4444; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .blue .dot { background: #2563eb; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .dot.lit { outline: 4px solid #facc15; outline-offset: 2px; animation: bounceIn .4s ease; }

  /* ---------- The part whole model ---------- */
  #model {
    --c: clamp(74px, 19vmin, 132px);
    position: relative;
    width: calc(var(--c) * 3.3);
    height: calc(var(--c) * 2.3);
  }
  #model svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #model line { stroke: rgba(255,255,255,.8); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .node {
    position: absolute;
    width: var(--c);
    height: var(--c);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    color: #1e293b;
    background: #fff;
    border: 6px solid #fde047;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .node .lbl { font-size: calc(var(--c) * .15); font-weight: 800; text-transform: none; opacity: .75; }
  .node .val { font-size: calc(var(--c) * .42); font-weight: 900; line-height: 1.05; min-height: 1.05em; }
  #nodeW { left: calc(50% - var(--c) / 2); top: 0; border-color: #f59e0b; }
  #nodeA { left: 0; bottom: 0; border-color: #ef4444; }
  #nodeB { right: 0; bottom: 0; border-color: #2563eb; }
  .node.active {
    border-style: dashed;
    box-shadow: 0 0 0 6px rgba(253,224,71,.85), 0 6px 0 rgba(0,0,0,.25);
    animation: pulse 1.2s ease infinite;
  }
  .node.active .val { color: #94a3b8; }
  .node.done { background: #fefce8; }
  .node.done .val { animation: bounceIn .5s ease; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  /* ---------- Number tiles 0-10 ---------- */
  #tiles {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(5px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 640px;
  }
  .tile {
    width: clamp(50px, 11vmin, 78px);
    height: clamp(50px, 11vmin, 78px);
    font-family: inherit;
    font-size: clamp(1.3rem, 5vmin, 2.2rem);
    font-weight: 800;
    color: #1e3a8a;
    background: #eff6ff;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tile:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tile.wrong { background: #fecaca; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .w { color: #d97706; }
  .chip .r { color: #dc2626; }
  .chip .b { color: #1d4ed8; }
  .chip small { display: block; font-size: .6em; font-weight: 700; opacity: .6; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #172554 0%, #1d4ed8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Part whole model</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="dots" class="hidden">
    <div class="grp red" id="grpA"></div>
    <div class="grp blue" id="grpB"></div>
  </div>

  <div id="model" class="hidden">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="50" y1="21.7" x2="15.2" y2="78.3"/>
      <line x1="50" y1="21.7" x2="84.8" y2="78.3"/>
    </svg>
    <button class="node" id="nodeW" type="button"><span class="lbl">Whole</span><span class="val"></span></button>
    <button class="node" id="nodeA" type="button"><span class="lbl">Part</span><span class="val"></span></button>
    <button class="node" id="nodeB" type="button"><span class="lbl">Part</span><span class="val"></span></button>
  </div>

  <div id="tiles" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count with me</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Part whole model ⚽</h2>
  <p>Count the dots.<br>Fill in the part whole model.<br>Whole 7 · Part 5 · Part 2</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Mathematics - Homework Week 4: part whole models.
     "Please fill in the part whole model to represent what the dots show.
      The first one has been done as an example.  Whole 7, Part 5, Part 2."

     A match starts with that example (7 = 5 red dots + 2 blue dots), shown
     and read out step by step. Then he fills in eight models himself:
     first half part, part, whole (count each colour, then all the dots);
     second half the whole first, then the two parts. One football ⚽ for
     every model he finishes. */

  var EXAMPLE = { a: 5, b: 2 };
  var ROUNDS_PER_HALF = 4;

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];
  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🔴', '🔵'];

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261002mathematicshomeworkwee3';
  var SLOW_KEY  = 'jackHw_hw20261002mathematicshomeworkwee3_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* models finished this match */
  var model = null;       /* { a, b } */
  var steps = [];         /* order the boxes are filled: 'a', 'b', 'w' */
  var stepIdx = 0;
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | example | round | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */
  var countToken = 0;     /* cancels counting out loud */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    dots: $('dots'), grpA: $('grpA'), grpB: $('grpB'),
    model: $('model'), nodeW: $('nodeW'), nodeA: $('nodeA'), nodeB: $('nodeB'),
    tiles: $('tiles'), btnRow: $('btnRow'),
    sayBtn: $('sayBtn'), countBtn: $('countBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };
  var NODES = { a: els.nodeA, b: els.nodeB, w: els.nodeW };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice (en-GB speechSynthesis) =================
     He cannot read yet, so every line is spoken. speak() calls done() when
     the line has finished — with a timer as a safety net, because iOS does
     not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var voice = null;
  var speakToken = 0;

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  function speak(text, done, rate) {
    stopSpeaking();
    var my = speakToken;
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    countToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Words ================= */
  function wholeOf(m) { return m.a + m.b; }
  function valueOf(step) { return step === 'a' ? model.a : step === 'b' ? model.b : wholeOf(model); }

  function modelSentence(m) {
    return 'The whole is ' + WORDS[wholeOf(m)] + '. The parts are ' +
           WORDS[m.a] + ' and ' + WORDS[m.b] + '.';
  }

  /* what he is asked for each box */
  function askSay(step) {
    if (step === 'a') return 'How many red dots? That is a part.';
    if (step === 'b') return 'How many blue dots? That is the other part.';
    return 'How many dots altogether? That is the whole.';
  }
  function askLead(step) {
    if (step === 'a') return 'How many <span class="r">red</span> dots? <span class="r">Part</span>';
    if (step === 'b') return 'How many <span class="b">blue</span> dots? <span class="b">Part</span>';
    return 'How many dots altogether? <span class="w">Whole</span>';
  }
  function thingName(step) {
    return step === 'a' ? 'red dots' : step === 'b' ? 'blue dots' : 'dots';
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'dots', 'model', 'tiles', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'countBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  /* ================= Dots ================= */
  function fillGroup(el, n) {
    el.innerHTML = '';
    el.classList.remove('got');
    /* small groups in one row, bigger ones in two rows, like dice */
    var cols = n <= 3 ? n : Math.ceil(n / 2);
    el.style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      el.appendChild(d);
    }
  }

  function renderDots(m) {
    fillGroup(els.grpA, m.a);
    fillGroup(els.grpB, m.b);
  }

  function clearLit() {
    var lit = els.dots.querySelectorAll('.dot');
    for (var i = 0; i < lit.length; i++) { lit[i].classList.remove('lit'); lit[i].textContent = ''; }
  }

  function dotsFor(step) {
    if (step === 'a') return els.grpA.querySelectorAll('.dot');
    if (step === 'b') return els.grpB.querySelectorAll('.dot');
    return els.dots.querySelectorAll('.dot');
  }

  /* Count the dots out loud, a number lighting up on each one. */
  function countDots(step, then) {
    var token = ++countToken;
    flowToken++;
    clearLit();
    var nodes = dotsFor(step);
    var i = 0;
    (function tick() {
      if (token !== countToken) return;
      if (i >= nodes.length) {
        setTimeout(function () {
          if (token !== countToken) return;
          var n = nodes.length;
          speak(WORDS[n] + ' ' + thingName(step) + '.', then);
        }, 250);
        return;
      }
      nodes[i].classList.add('lit');
      nodes[i].textContent = String(i + 1);
      speak(WORDS[i + 1], null, 0.85);
      i++;
      setTimeout(tick, slow ? 1050 : 800);
    })();
  }

  /* ================= Model ================= */
  function setNode(step, value, cls) {
    var n = NODES[step];
    n.classList.remove('active', 'done');
    if (cls) n.classList.add(cls);
    n.querySelector('.val').textContent = value === null ? '' : String(value);
  }

  function resetModel() {
    setNode('w', null); setNode('a', null); setNode('b', null);
  }

  function markActive() {
    ['a', 'b', 'w'].forEach(function (s) { NODES[s].classList.remove('active'); });
    var s = steps[stepIdx];
    if (s) {
      NODES[s].classList.add('active');
      NODES[s].querySelector('.val').textContent = '?';
    }
  }

  /* tapping a circle says what it is */
  function tapNode(step) {
    if (mode === 'start' || mode === 'board') return;
    countToken++;
    var v = NODES[step].querySelector('.val').textContent;
    var name = step === 'w' ? 'Whole' : 'Part';
    if (/^\d+$/.test(v)) speak(name + '. ' + WORDS[parseInt(v, 10)] + '.');
    else if (mode === 'round' && steps[stepIdx] === step) speak(askSay(step));
    else speak(name + '.');
  }

  /* ================= Number tiles 0-10 ================= */
  function buildTiles() {
    els.tiles.innerHTML = '';
    for (var n = 0; n <= 10; n++) {
      var t = document.createElement('button');
      t.className = 'tile';
      t.type = 'button';
      t.textContent = String(n);
      t.addEventListener('click', answer.bind(null, n, t));
      els.tiles.appendChild(t);
    }
  }

  /* ================= The example: Whole 7, Part 5, Part 2 ================= */
  function enterExample() {
    stopAll();
    mode = 'example';
    model = EXAMPLE;
    els.half.textContent = 'Example';
    renderDots(model);
    resetModel();
    els.lead.textContent = 'The first one is an example. 👀';
    els.nextBtn.textContent = 'My turn ➜';
    show(['lead', 'dots', 'model', 'btnRow'], ['sayBtn', 'nextBtn']);
    playExample();
  }

  function playExample() {
    resetModel();
    clearLit();
    els.grpA.classList.remove('got');
    els.grpB.classList.remove('got');
    sequence([
      { say: 'Here is the example. Fill in the part whole model to show what the dots show.' },
      { act: function () { els.grpA.classList.add('got'); },
        say: 'Five red dots.' },
      { act: function () { setNode('a', 5, 'done'); },
        say: 'Part, five.' },
      { act: function () { els.grpB.classList.add('got'); },
        say: 'Two blue dots.' },
      { act: function () { setNode('b', 2, 'done'); },
        say: 'Part, two.' },
      { say: 'Seven dots altogether.' },
      { act: function () { setNode('w', 7, 'done'); },
        say: 'Whole, seven. Five and two make seven. Now it is your turn!' }
    ]);
  }

  /* ================= A round ================= */
  function current() { return half === 1 ? queue1[round] : queue2[round]; }

  function enterRound() {
    stopAll();
    mode = 'round';
    busy = false;
    model = current();
    steps = half === 1 ? ['a', 'b', 'w'] : ['w', 'a', 'b'];
    stepIdx = 0;
    attempts = 0;
    els.half.textContent = (half === 1 ? 'First half · ' : 'Second half · ') + (round + 1) + '/' + ROUNDS_PER_HALF;
    renderDots(model);
    resetModel();
    markActive();
    els.lead.innerHTML = askLead(steps[0]);
    show(['lead', 'dots', 'model', 'tiles', 'btnRow'], ['countBtn']);
    var intro = round === 0
      ? (half === 1 ? 'Count the red dots, then the blue dots, then all the dots. '
                    : 'Now find the whole first. ')
      : '';
    setTimeout(function () { if (mode === 'round' && !busy && stepIdx === 0) speak(intro + askSay(steps[0])); }, 300);
  }

  function answer(n, tile) {
    if (mode !== 'round' || busy) return;
    stopAll();
    var step = steps[stepIdx];
    var right = valueOf(step);

    if (n !== right) {
      attempts++;
      tile.classList.remove('wrong');
      void tile.offsetWidth;
      tile.classList.add('wrong');
      if (attempts >= 2) {
        busy = true;
        speak('Not ' + WORDS[n] + '. Let us count them together.', function () {
          countDots(step, function () { busy = false; });
        });
        /* never leave the tiles locked */
        setTimeout(function () { busy = false; }, 16000);
      } else {
        speak('Not ' + WORDS[n] + '. Try again. Tap the dots to count them.');
      }
      return;
    }

    attempts = 0;
    clearLit();
    setNode(step, right, 'done');
    if (step === 'a') els.grpA.classList.add('got');
    if (step === 'b') els.grpB.classList.add('got');
    if (step === 'w') { els.grpA.classList.add('got'); els.grpB.classList.add('got'); }
    stepIdx++;

    if (stepIdx < steps.length) {
      markActive();
      els.lead.innerHTML = askLead(steps[stepIdx]);
      speak('Yes, ' + WORDS[right] + '! ' + askSay(steps[stepIdx]));
      return;
    }
    finishModel();
  }

  function finishModel() {
    busy = true;
    mode = 'finished';
    done.push(model);
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    els.lead.innerHTML = 'GOAL! ⚽ <span class="w">Whole ' + wholeOf(model) + '</span> · ' +
      '<span class="r">Part ' + model.a + '</span> · <span class="b">Part ' + model.b + '</span>';
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'Full time ➜') : 'Next ➜';
    show(['lead', 'dots', 'model', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak('Goal! ' + modelSentence(model));
  }

  function nextRound() {
    stopAll();
    if (mode === 'example') { half = 1; round = 0; enterRound(); return; }
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    enterRound();
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    done.forEach(function (m, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = '<span class="w">' + wholeOf(m) + '</span> = <span class="r">' + m.a +
        '</span> + <span class="b">' + m.b + '</span><small>whole · part · part</small>';
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(modelSentence(done[i]), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    done.forEach(function (m, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: modelSentence(m)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = 'Next: find the whole first.';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak('Half time! You filled in ' + WORDS[done.length] + ' part whole models. ' +
          'In the second half, find the whole first.');
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = done.length + ' part whole models · ' + done.length + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak('Full time! You filled in ' + WORDS[done.length] + ' part whole models. Brilliant!');
  }

  /* ================= Match ================= */
  function buildQueues() {
    var easy = [], hard = [];
    for (var a = 1; a <= 9; a++) {
      for (var b = 1; a + b <= 10; b++) {
        if (a === EXAMPLE.a && b === EXAMPLE.b) continue;
        if (a + b <= 7) easy.push({ a: a, b: b });
        if (a + b >= 6) hard.push({ a: a, b: b });
      }
    }
    var pick = function (pool, taken) {
      var out = [];
      shuffle(pool).forEach(function (m) {
        if (out.length >= ROUNDS_PER_HALF) return;
        var clash = out.concat(taken).some(function (o) {
          return (o.a === m.a && o.b === m.b) || wholeOf(o) === wholeOf(m) && out.length < 3;
        });
        if (!clash) out.push(m);
      });
      return out.length === ROUNDS_PER_HALF ? out : shuffle(pool).slice(0, ROUNDS_PER_HALF);
    };
    queue1 = pick(easy, []);
    queue2 = pick(hard, queue1);
  }

  function startMatch() {
    stopAll();
    buildQueues();
    done = [];
    half = 1;
    round = 0;
    enterExample();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    els.startOverlay.remove();
    startMatch();
  });

  /* tapping a colour counts it out loud */
  function tapGroup(step) {
    if (mode === 'start' || mode === 'board' || (mode === 'round' && busy)) return;
    countDots(step);
  }
  els.grpA.addEventListener('click', function () { tapGroup('a'); });
  els.grpB.addEventListener('click', function () { tapGroup('b'); });
  els.nodeW.addEventListener('click', function () { tapNode('w'); });
  els.nodeA.addEventListener('click', function () { tapNode('a'); });
  els.nodeB.addEventListener('click', function () { tapNode('b'); });

  els.countBtn.addEventListener('click', function () {
    if (mode === 'round' && !busy) countDots(steps[stepIdx]);
  });
  els.sayBtn.addEventListener('click', function () {
    if (mode === 'example') playExample();
    else if (model) { stopAll(); speak(modelSentence(model)); }
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildTiles();
  renderScore(false);
})();
</script>
</body>
</html>
