<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>One More, One Less ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="One More">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #052e16 0%, #15803d 52%, #052e16 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    --cell: min(16.5vw, 10.5vh, 88px);
  }
  @media (orientation: landscape) {
    body { --cell: min(8.5vw, 13vh, 88px); }
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 1.6vh, 18px);
    padding: clamp(6px, 1.6vh, 20px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }
  .lead .more { color: #fdba74; }
  .lead .less { color: #93c5fd; }

  /* ---------- The three boxes: one less · the number · one more ---------- */
  #strip {
    display: flex;
    gap: clamp(6px, 1.6vmin, 14px);
    justify-content: center;
    --m: calc(var(--cell) * .2);
  }
  #strip.big { --m: calc(var(--cell) * .24); }
  .box {
    font-family: inherit;
    color: #1e293b;
    background: #fff;
    border: 5px solid #cbd5e1;
    border-radius: 16px;
    padding: 4px 8px 8px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .box .lbl { font-size: clamp(.72rem, 2vmin, .95rem); font-weight: 800; opacity: .75; white-space: nowrap; }
  .box .val { font-size: clamp(1.5rem, 5.4vmin, 2.6rem); font-weight: 900; line-height: 1.1; min-height: 1.1em; }
  #boxLess { border-color: #60a5fa; }
  #boxMore { border-color: #fb923c; }
  #boxMid  { border-color: #fde047; }
  .box.active {
    border-style: dashed;
    box-shadow: 0 0 0 5px rgba(253,224,71,.85), 0 5px 0 rgba(0,0,0,.25);
    animation: pulse 1.2s ease infinite;
  }
  .box.done .val { animation: bounceIn .5s ease; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .mini {
    display: grid;
    grid-template-columns: repeat(5, var(--m));
    grid-auto-rows: var(--m);
    border: 2px solid #334155;
    margin-top: 2px;
  }
  .mini i { display: block; border: 1px solid #94a3b8; border-radius: 0; }
  .mini i.on { background: radial-gradient(circle, #ef4444 62%, transparent 66%); }

  /* ---------- The big tens frame and the spare dots ---------- */
  #stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.8vmin, 18px);
  }
  @media (orientation: landscape) {
    #stage { flex-direction: row; }
  }
  #frame {
    display: grid;
    grid-template-columns: repeat(5, var(--cell));
    grid-auto-rows: var(--cell);
    background: #fff;
    border: 5px solid #1e293b;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  #frame.wrong { animation: shake .4s ease; }
  .cell {
    border: 2px solid #1e293b;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .dot {
    width: calc(var(--cell) * .74);
    height: calc(var(--cell) * .74);
    border-radius: 50%;
    background: #ef4444;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.18);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    font-size: calc(var(--cell) * .4);
    line-height: 1;
    cursor: grab;
    touch-action: none;
  }
  .dot.new { animation: bounceIn .4s ease; }
  .dot.lit { outline: 4px solid #facc15; outline-offset: 2px; animation: bounceIn .4s ease; }
  #tray {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: calc(var(--cell) * .08);
    width: calc(var(--cell) * 5);
    min-height: calc(var(--cell) * 1.8);
    padding: calc(var(--cell) * .08);
    background: rgba(0,0,0,.28);
    border: 3px dashed rgba(255,255,255,.55);
    border-radius: 18px;
  }
  #ghost {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(1.15);
  }

  /* ---------- Number tiles 0-10 ---------- */
  #tiles {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(5px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 700px;
  }
  .tile {
    width: clamp(50px, 11vmin, 78px);
    height: clamp(50px, 11vmin, 78px);
    font-family: inherit;
    font-size: clamp(1.3rem, 5vmin, 2.2rem);
    font-weight: 800;
    color: #14532d;
    background: #f0fdf4;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tile:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tile.wrong { background: #fecaca; animation: shake .4s ease; }
  .tile.hint { outline: 5px solid #fde047; outline-offset: 2px; animation: pulse 1.2s ease infinite; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.tick { background: linear-gradient(145deg, #22c55e, #16a34a); font-size: clamp(1.3rem, 3.6vmin, 1.8rem); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(14px, 3.4vw, 28px);
  }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .l { color: #1d4ed8; }
  .chip .m { color: #d97706; }
  .chip small { display: block; font-size: .6em; font-weight: 700; opacity: .6; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #052e16 0%, #15803d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  /* a phone on its side: no room for the little frames while he is moving dots */
  @media (orientation: landscape) and (max-height: 520px) {
    #strip:not(.big) .mini { display: none; }
    .box .val { font-size: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>One more, one less</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="strip" class="hidden">
    <button class="box" id="boxLess" type="button"><span class="lbl">One less −1</span><span class="val"></span><span class="mini"></span></button>
    <button class="box" id="boxMid" type="button"><span class="lbl">Number</span><span class="val"></span><span class="mini"></span></button>
    <button class="box" id="boxMore" type="button"><span class="lbl">One more +1</span><span class="val"></span><span class="mini"></span></button>
  </div>

  <div id="stage" class="hidden">
    <div id="frame"></div>
    <div id="tray"></div>
  </div>

  <div id="tiles" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count</button>
    <button class="btn tick" id="checkBtn">✓</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ One more, one less ⚽</h2>
  <p>Move the dots on the tens frame.<br>Show one more and one less.</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Mathematics - Homework Week 2.
     "In Mathematics this week we have been looking at one more and one less
      using tens frames. Please use the tens frames provided and move the dots
      to show one more and one less for the numbers shown."

     A match starts with an example on the number four, shown and read out
     step by step. Then eight numbers, each with both jobs: the frame shows
     the number and he moves dots in or out of it (drag or tap), then taps the
     green tick. First half: one more, then one less, and each move counts out
     loud. Second half: the harder numbers, one less first, no counting out
     loud, and after each move he also taps the number on a 0-10 track. One
     football ⚽ for every number he finishes. */

  var HALF_ONE = [2, 3, 5, 6];
  var HALF_TWO = [1, 7, 8, 9];
  var EXAMPLE = 4;
  var ROUNDS_PER_HALF = 4;
  var SPARE = 2;          /* dots waiting in the tray at the start of a job */

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🔴', '➕', '➖'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261030-start-2.txt is generated straight out
     of this block (tools/gen-phrases.js). */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];

  var PRAISE = ['Yes!', 'Well done!', 'Great moving!', 'Brilliant!'];

  function targetOf(kind, n) { return kind === 'more' ? n + 1 : n - 1; }

  /* "one dot", "six dots" */
  function dotsWord(n) { return WORDS[n] + (n === 1 ? ' dot.' : ' dots.'); }

  function numberSay(n) { return 'The number is ' + WORDS[n] + '.'; }
  function moveSay(kind) { return 'Move the dots to show one ' + kind + '.'; }
  function askSay(kind, n) { return numberSay(n) + ' ' + moveSay(kind); }
  function factSay(kind, n) {
    return 'One ' + kind + ' than ' + WORDS[n] + ' is ' + WORDS[targetOf(kind, n)] + '.';
  }
  function boxSay(kind) { return 'One ' + kind + '.'; }
  function introSay(half) {
    return half === 1 ? 'Move the dots to show one more and one less. Then tap the green tick.'
                      : 'Now show one less first. Then tap the number.';
  }

  /* what is wrong with the dots after the tick: still the same number, moved
     the wrong way, or moved too far */
  function wrongSay(have, kind, n) {
    if (have === n) return 'You still have ' + dotsWord(n) + ' Move one dot.';
    if (kind === 'more') {
      return have < n ? 'That is less, not more. One more means one dot into the frame.'
                      : 'That is too many. One more is just one dot.';
    }
    return have > n ? 'That is more, not less. One less means one dot out of the frame.'
                    : 'That is too few. One less is just one dot.';
  }
  var WATCH_SAY = 'Watch the dots.';

  function tileAsk(kind, n) { return 'What number is one ' + kind + ' than ' + WORDS[n] + '?'; }
  function tileWrongSay(m, together) {
    return together ? 'Not ' + WORDS[m] + '. Let us count the dots together.'
                    : 'Not ' + WORDS[m] + '. Try again. Count the dots.';
  }

  /* one less and one more of a number, together */
  function bothSay(n) { return factSay('less', n) + ' ' + factSay('more', n); }
  function goalSay(n) { return 'Goal! ' + bothSay(n); }
  function halfTimeSay(k) {
    return 'Half time! You did ' + WORDS[k] + ' numbers. In the second half, show one less first.';
  }
  function fullTimeSay(k) {
    return 'Full time! You did ' + WORDS[k] + ' numbers. Brilliant!';
  }

  /* the example on four, line by line */
  var EXAMPLE_SAY = [
    'We are looking at one more and one less using tens frames. ' + numberSay(4),
    boxSay('more') + ' Move one dot into the tens frame.',
    factSay('more', 4),
    'Now back to four.',
    boxSay('less') + ' Move one dot out of the tens frame.',
    factSay('less', 4),
    'Then tap the green tick. Now it is your turn!'
  ];

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, n, m, kinds = ['more', 'less'], k;
    function add(s) { var b = bare(s); if (b && !seen[b]) { seen[b] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var j = 0; j < p.length; j++) add(p[j]); }
    for (i = 0; i < EXAMPLE_SAY.length; i++) addAll(EXAMPLE_SAY[i]);
    addAll(introSay(1));
    addAll(introSay(2));
    addAll(WATCH_SAY);
    for (i = 0; i < PRAISE.length; i++) addAll(PRAISE[i]);
    for (n = 0; n <= 10; n++) { add(WORDS[n]); addAll(dotsWord(n)); }
    for (k = 0; k < 2; k++) {
      addAll(boxSay(kinds[k]));
      addAll(moveSay(kinds[k]));
    }
    /* the example number four is one of these too */
    for (n = 1; n <= 9; n++) {
      addAll(numberSay(n));
      addAll(bothSay(n));
      addAll(goalSay(n));
      for (k = 0; k < 2; k++) {
        addAll(askSay(kinds[k], n));
        addAll(factSay(kinds[k], n));
        addAll(tileAsk(kinds[k], n));
        for (m = 0; m <= 10; m++) addAll(wrongSay(m, kinds[k], n));
      }
    }
    for (m = 0; m <= 10; m++) { addAll(tileWrongSay(m, true)); addAll(tileWrongSay(m, false)); }
    addAll(halfTimeSay(4));
    addAll(fullTimeSay(8));
    return out;
  }
  /* ==== END TEXT-CORE ==== */
  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261030start2';
  var SLOW_KEY  = 'jackHw_hw20261030start2_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* numbers finished this match */
  var number = 0;         /* the number shown */
  var steps = [];         /* the two jobs of a number: 'more', 'less' */
  var stepIdx = 0;
  var phase = 'move';     /* move | tile */
  var dots = 0;           /* dots in the frame */
  var spare = 0;          /* dots in the tray */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | example | round | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */
  var countToken = 0;     /* cancels counting out loud */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    strip: $('strip'), boxLess: $('boxLess'), boxMid: $('boxMid'), boxMore: $('boxMore'),
    stage: $('stage'), frame: $('frame'), tray: $('tray'),
    tiles: $('tiles'), btnRow: $('btnRow'),
    sayBtn: $('sayBtn'), countBtn: $('countBtn'), checkBtn: $('checkBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261030-start-2/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    countToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  /* A line, then on with the game. The tiles and dots stay locked meanwhile,
     with a timer as a safety net so a lost clip can never leave them locked. */
  function sayThen(text, then) {
    busy = true;
    var fired = false;
    var go = function () {
      if (fired) return;
      fired = true;
      clearTimeout(guard);
      then();
    };
    var guard = setTimeout(go, 20000);
    speak(text, function () { setTimeout(go, 300); });
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'strip', 'stage', 'tiles', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'countBtn', 'checkBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  /* ================= The three boxes ================= */
  function fillMini(box, n) {
    var cells = box.querySelectorAll('.mini i');
    for (var i = 0; i < cells.length; i++) cells[i].classList.toggle('on', i < n);
  }

  function setBox(box, value) {
    box.classList.remove('done', 'active');
    box.querySelector('.val').textContent = value === null ? '' : String(value);
    fillMini(box, value === null ? 0 : value);
  }

  function boxOf(kind) { return kind === 'more' ? els.boxMore : els.boxLess; }

  function resetBoxes(n) {
    setBox(els.boxLess, null);
    setBox(els.boxMore, null);
    setBox(els.boxMid, n);
    els.strip.classList.remove('big');
  }

  function fillBox(kind, n) {
    var box = boxOf(kind);
    setBox(box, targetOf(kind, n));
    box.classList.add('done');
  }

  function markActive(kind) {
    els.boxLess.classList.remove('active');
    els.boxMore.classList.remove('active');
    if (kind) {
      boxOf(kind).classList.add('active');
      boxOf(kind).querySelector('.val').textContent = '?';
    }
  }

  /* tapping a box says what it is */
  function tapBox(kind) {
    if (mode === 'start' || mode === 'board' || busy) return;
    stopAll();
    var filled = /^\d+$/.test(boxOf(kind).querySelector('.val').textContent);
    speak(filled ? factSay(kind, number) : boxSay(kind));
  }

  /* ================= The frame and the tray ================= */
  function makeDot() {
    var d = document.createElement('div');
    d.className = 'dot';
    return d;
  }

  function renderDots(fresh) {
    var cells = els.frame.children;
    for (var i = 0; i < cells.length; i++) {
      cells[i].innerHTML = '';
      if (i < dots) {
        var d = makeDot();
        if (fresh === 'frame' && i === dots - 1) d.className += ' new';
        cells[i].appendChild(d);
      }
    }
    els.tray.innerHTML = '';
    for (var t = 0; t < spare; t++) {
      var s = makeDot();
      if (fresh === 'tray' && t === spare - 1) s.className += ' new';
      els.tray.appendChild(s);
    }
  }

  function setDots(n) {
    var total = dots + spare;
    if (n > total) total = n;
    dots = n;
    spare = total - n;
    renderDots();
  }

  /* a fresh job: the number in the frame, a couple of spares beside it */
  function layOut(n) {
    dots = n;
    spare = Math.min(SPARE, 10 - n);
    renderDots();
  }

  /* one dot across, into the frame or out of it */
  function shift(into) {
    if (into) {
      if (spare < 1 || dots >= 10) return false;
      dots++; spare--;
      renderDots('frame');
    } else {
      if (dots < 1) return false;
      dots--; spare++;
      renderDots('tray');
    }
    return true;
  }

  function canMove() { return mode === 'round' && phase === 'move' && !busy; }

  /* he moved one himself */
  function moved(into) {
    if (!canMove() || !shift(into)) return;
    countToken++;
    if (half === 1) speak(WORDS[dots]);
  }

  /* ---------- Drag a dot, or just tap it ---------- */
  var drag = null;

  function dropDrag() {
    if (!drag) return;
    if (drag.ghost) drag.ghost.remove();
    drag.el.style.visibility = '';
    drag = null;
  }

  function overEl(el, x, y) {
    var r = el.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function onDown(e) {
    if (!canMove() || drag) return;
    var el = e.target;
    var fromFrame = els.frame.contains(el);
    if (!el.classList.contains('dot')) {
      /* an empty space in the frame: a tap fills the next one */
      if (fromFrame && el.classList.contains('cell')) moved(true);
      return;
    }
    e.preventDefault();
    drag = { el: el, into: !fromFrame, x: e.clientX, y: e.clientY, ghost: null };
  }

  function onMove(e) {
    if (!drag) return;
    if (!drag.ghost) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (dx * dx + dy * dy < 100) return;
      var g = makeDot();
      g.id = 'ghost';
      document.body.appendChild(g);
      drag.ghost = g;
      drag.el.style.visibility = 'hidden';
    }
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';
  }

  function onUp(e) {
    if (!drag) return;
    var d = drag;
    var go = !d.ghost ||                                       /* a tap */
             (d.into ? overEl(els.frame, e.clientX, e.clientY)  /* tray -> frame */
                     : !overEl(els.frame, e.clientX, e.clientY)); /* out of the frame */
    dropDrag();
    if (go) moved(d.into);
  }

  /* ================= Count the dots out loud ================= */
  function clearLit() {
    var lit = els.frame.querySelectorAll('.dot');
    for (var i = 0; i < lit.length; i++) { lit[i].classList.remove('lit'); lit[i].textContent = ''; }
  }

  function countDots(then) {
    var token = ++countToken;
    flowToken++;
    clearLit();
    var nodes = els.frame.querySelectorAll('.dot');
    var i = 0;
    (function tick() {
      if (token !== countToken) return;
      if (i >= nodes.length) {
        setTimeout(function () {
          if (token !== countToken) return;
          speak(dotsWord(nodes.length), then);
        }, 250);
        return;
      }
      nodes[i].classList.add('lit');
      nodes[i].textContent = String(i + 1);
      speak(WORDS[i + 1], null, 0.85);
      i++;
      setTimeout(tick, slow ? 1050 : 800);
    })();
  }

  /* ================= Number tiles 0-10 ================= */
  function buildTiles() {
    els.tiles.innerHTML = '';
    for (var n = 0; n <= 10; n++) {
      var t = document.createElement('button');
      t.className = 'tile';
      t.type = 'button';
      t.textContent = String(n);
      t.addEventListener('click', answer.bind(null, n, t));
      els.tiles.appendChild(t);
    }
  }

  function clearTiles() {
    var all = els.tiles.children;
    for (var i = 0; i < all.length; i++) all[i].classList.remove('wrong', 'hint');
  }

  /* ================= The example, on the number four ================= */
  function enterExample() {
    stopAll();
    mode = 'example';
    busy = false;
    number = EXAMPLE;
    els.half.textContent = 'Example';
    els.lead.textContent = 'Watch! 👀';
    els.nextBtn.textContent = 'My turn ➜';
    show(['lead', 'strip', 'stage', 'btnRow'], ['sayBtn', 'nextBtn']);
    playExample();
  }

  function playExample() {
    resetBoxes(number);
    layOut(number);
    sequence([
      { say: EXAMPLE_SAY[0] },
      { act: function () { markActive('more'); shift(true); },
        say: EXAMPLE_SAY[1] },
      { act: function () { fillBox('more', number); },
        say: EXAMPLE_SAY[2] },
      { act: function () { setDots(number); },
        say: EXAMPLE_SAY[3] },
      { act: function () { markActive('less'); shift(false); },
        say: EXAMPLE_SAY[4] },
      { act: function () { fillBox('less', number); },
        say: EXAMPLE_SAY[5] },
      { say: EXAMPLE_SAY[6] }
    ]);
  }

  /* ================= A number ================= */
  function enterRound() {
    stopAll();
    mode = 'round';
    busy = false;
    number = (half === 1 ? queue1 : queue2)[round];
    steps = half === 1 ? ['more', 'less'] : ['less', 'more'];
    stepIdx = 0;
    els.half.textContent = (half === 1 ? 'First half · ' : 'Second half · ') + (round + 1) + '/' + ROUNDS_PER_HALF;
    resetBoxes(number);
    enterStep(round === 0 ? introSay(half) + ' ' : '');
  }

  function leadFor(kind, tile) {
    var w = '<span class="' + kind + '">' + (kind === 'more' ? '➕ One more' : '➖ One less') + '</span>';
    return tile ? w + ' than ' + number + ' is…' : w + ' than ' + number;
  }

  function enterStep(intro) {
    var kind = steps[stepIdx];
    phase = 'move';
    busy = false;
    attempts = 0;
    layOut(number);
    markActive(kind);
    els.lead.innerHTML = leadFor(kind, false);
    show(['lead', 'strip', 'stage', 'btnRow'], ['sayBtn', 'countBtn', 'checkBtn']);
    speak((intro || '') + askSay(kind, number));
  }

  /* the green tick */
  function check() {
    if (!canMove()) return;
    stopAll();
    clearLit();
    var kind = steps[stepIdx];
    if (dots === targetOf(kind, number)) { stepWon(false); return; }
    attempts++;
    els.frame.classList.remove('wrong');
    void els.frame.offsetWidth;
    els.frame.classList.add('wrong');
    if (attempts >= 3) { showHim(kind); return; }
    speak(wrongSay(dots, kind, number));
  }

  /* three tries: the frame goes back to the number and the game moves the dot */
  function showHim(kind) {
    setDots(number);
    sayThen(WATCH_SAY, function () {
      shift(kind === 'more');
      stepWon(true);
    });
  }

  function stepWon(shown) {
    var kind = steps[stepIdx];
    attempts = 0;
    if (half === 1) {
      fillBox(kind, number);
      sayThen((shown ? '' : pick(PRAISE) + ' ') + factSay(kind, number), nextStep);
      return;
    }
    phase = 'tile';
    busy = false;
    clearTiles();
    els.lead.innerHTML = leadFor(kind, true);
    show(['lead', 'strip', 'stage', 'tiles', 'btnRow'], ['sayBtn', 'countBtn']);
    els.tray.classList.add('hidden');
    speak((shown ? '' : pick(PRAISE) + ' ') + tileAsk(kind, number));
  }

  function answer(n, tile) {
    if (mode !== 'round' || phase !== 'tile' || busy) return;
    stopAll();
    clearLit();
    var kind = steps[stepIdx];
    var right = targetOf(kind, number);

    if (n !== right) {
      attempts++;
      tile.classList.remove('wrong');
      void tile.offsetWidth;
      tile.classList.add('wrong');
      if (attempts >= 2) {
        busy = true;
        speak(tileWrongSay(n, true), function () {
          countDots(function () {
            busy = false;
            els.tiles.children[right].classList.add('hint');
          });
        });
        /* never leave the tiles locked */
        setTimeout(function () { busy = false; }, 16000);
      } else {
        speak(tileWrongSay(n, false));
      }
      return;
    }

    fillBox(kind, number);
    sayThen(pick(PRAISE) + ' ' + factSay(kind, number), nextStep);
  }

  function nextStep() {
    els.tray.classList.remove('hidden');
    stepIdx++;
    if (stepIdx < steps.length) enterStep('');
    else finishNumber();
  }

  function finishNumber() {
    busy = false;
    mode = 'finished';
    done.push(number);
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    markActive(null);
    els.strip.classList.add('big');
    els.lead.textContent = 'GOAL! ⚽';
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'Full time ➜') : 'Next ➜';
    show(['lead', 'strip', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak(goalSay(number));
  }

  function nextRound() {
    stopAll();
    if (mode === 'example') { half = 1; round = 0; enterRound(); return; }
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    enterRound();
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    done.forEach(function (n, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = '<span class="l">' + (n - 1) + '</span> · ' + n + ' · <span class="m">' + (n + 1) +
        '</span><small>−1 · number · +1</small>';
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(bothSay(done[i]), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    done.forEach(function (n, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: bothSay(n)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = 'Next: one less first.';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(done.length));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = done.length + ' numbers · ' + done.length + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(done.length));
  }

  /* ================= Match ================= */
  function startMatch() {
    stopAll();
    queue1 = shuffle(HALF_ONE);
    queue2 = shuffle(HALF_TWO);
    done = [];
    half = 1;
    round = 0;
    enterExample();
  }

  function buildFrames() {
    var i, c;
    for (i = 0; i < 10; i++) {
      c = document.createElement('div');
      c.className = 'cell';
      els.frame.appendChild(c);
    }
    [els.boxLess, els.boxMid, els.boxMore].forEach(function (box) {
      var mini = box.querySelector('.mini');
      for (var m = 0; m < 10; m++) mini.appendChild(document.createElement('i'));
    });
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.frame.addEventListener('pointerdown', onDown);
  els.tray.addEventListener('pointerdown', onDown);
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', dropDrag);

  els.boxLess.addEventListener('click', function () { tapBox('less'); });
  els.boxMore.addEventListener('click', function () { tapBox('more'); });
  els.boxMid.addEventListener('click', function () {
    if (mode === 'start' || mode === 'board' || busy) return;
    stopAll();
    speak(numberSay(number));
  });

  els.checkBtn.addEventListener('click', check);
  els.countBtn.addEventListener('click', function () {
    if (mode === 'round' && !busy) countDots();
  });
  els.sayBtn.addEventListener('click', function () {
    if (busy) return;
    if (mode === 'example') { stopAll(); playExample(); return; }
    stopAll();
    if (mode === 'finished') speak(bothSay(number));
    else if (phase === 'tile') speak(tileAsk(steps[stepIdx], number));
    else speak(askSay(steps[stepIdx], number));
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildFrames();
  buildTiles();
  renderScore(false);
})();
</script>
</body>
</html>
