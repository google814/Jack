<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>Old Bear's Take Away ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Take Away">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #14532d 0%, #15803d 52%, #14532d 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }
  .lead .x { color: #fca5a5; }
  .lead .w { color: #fde047; }

  /* ---------- The number sentence ---------- */
  #sum {
    font-family: inherit;
    font-size: clamp(2rem, 9vmin, 4.2rem);
    font-weight: 900;
    color: #fff;
    background: rgba(0,0,0,.25);
    border: none;
    border-radius: 20px;
    padding: 4px clamp(18px, 4vw, 32px);
    cursor: pointer;
    letter-spacing: .04em;
  }
  #sum .k { color: #fca5a5; }
  #sum .q { color: #fde047; }
  #sum .q.got { animation: bounceIn .5s ease; }

  /* ---------- The picnic blanket (the pictures) ---------- */
  #pics {
    --s: clamp(46px, 11.5vmin, 84px);
    display: grid;
    grid-template-columns: repeat(5, var(--s));
    gap: clamp(6px, 1.6vmin, 14px);
    padding: clamp(12px, 2.4vmin, 20px);
    background: #fff;
    background-image:
      linear-gradient(45deg, rgba(239,68,68,.12) 25%, transparent 25%, transparent 75%, rgba(239,68,68,.12) 75%),
      linear-gradient(45deg, rgba(239,68,68,.12) 25%, transparent 25%, transparent 75%, rgba(239,68,68,.12) 75%);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    border-radius: 22px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  .pic {
    position: relative;
    width: var(--s);
    height: var(--s);
    font-size: calc(var(--s) * .7);
    line-height: 1;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 16px;
    background: rgba(255,255,255,.75);
    cursor: pointer;
    font-family: inherit;
  }
  .pic .em { transition: opacity .25s ease, filter .25s ease; }
  .pic.x .em { opacity: .45; filter: grayscale(.6); }
  .pic.x::after {
    content: '';
    position: absolute;
    inset: 6%;
    background:
      linear-gradient(45deg, transparent 44%, #dc2626 44%, #dc2626 56%, transparent 56%),
      linear-gradient(-45deg, transparent 44%, #dc2626 44%, #dc2626 56%, transparent 56%);
    animation: bounceIn .35s ease;
    pointer-events: none;
  }
  .pic.lit { outline: 4px solid #facc15; outline-offset: 2px; background: #fef9c3; }
  .pic .n {
    position: absolute;
    top: -8px; right: -8px;
    min-width: 1.6em; height: 1.6em;
    padding: 0 .3em;
    border-radius: 999px;
    background: #facc15;
    color: #1e293b;
    font-size: calc(var(--s) * .26);
    font-weight: 900;
    display: grid;
    place-items: center;
    animation: bounceIn .4s ease;
  }
  #pics.crossing .pic:not(.x) { animation: wiggle 1.6s ease infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    10% { transform: rotate(-6deg); }
    20% { transform: rotate(6deg); }
    30% { transform: rotate(0); }
  }

  /* ---------- Number tiles 0-10 ---------- */
  #tiles {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(5px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 640px;
  }
  .tile {
    width: clamp(50px, 11vmin, 78px);
    height: clamp(50px, 11vmin, 78px);
    font-family: inherit;
    font-size: clamp(1.3rem, 5vmin, 2.2rem);
    font-weight: 800;
    color: #14532d;
    background: #f0fdf4;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tile:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tile.wrong { background: #fecaca; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #22c55e, #15803d);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Boards ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board, #hols {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .k { color: #dc2626; }
  .chip .w { color: #15803d; }
  .chip small { display: block; font-size: .7em; letter-spacing: -.1em; }
  .chip.saying, .hol.saying { outline: 4px solid #fde047; outline-offset: 3px; }
  #holBox { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #holBox .lead { display: flex; align-items: center; gap: 8px; }
  .hol {
    width: clamp(62px, 13vmin, 92px);
    height: clamp(62px, 13vmin, 92px);
    font-size: clamp(2rem, 7vmin, 3.2rem);
    border: none;
    border-radius: 20px;
    background: #fef3c7;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
    cursor: pointer;
  }
  .hol:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #14532d 0%, #15803d 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay .bear { font-size: clamp(3.5rem, 14vmin, 7rem); line-height: 1; }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Old Bear's take away</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <button id="sum" class="hidden" type="button"></button>

  <div id="pics" class="hidden"></div>

  <div id="tiles" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count with me</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div id="holBox" class="hidden">
      <p class="lead">🧸 ✉️ Old Bear</p>
      <div id="hols"></div>
    </div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <div class="bear">🧸🧺</div>
  <h2>⚽ Old Bear's take away ⚽</h2>
  <p>Old Bear's picnic.<br>Cross out what he eats.<br>Count what is left.<br>7 − 3 = 4</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Schulmail Fri, 16 Oct 2026 - Year 1 Homework.
     Mathematics: "solve subtraction calculations involving pictorial
     representations." English (Seesaw): "type, write or record a message to
     Old Bear." ... "a wonderful and restful half-term break" ... "hearing all
     about their holiday adventures".

     Old Bear has a picnic. The pictures are the food on the blanket, and the
     ones he eats are crossed out, the way it is drawn on the worksheet:
     8 - 3 = ? is eight pictures with three crossed out.
     A match starts with a worked example (7 - 3 = 4). First half the eaten
     ones are already crossed out and he counts what is left; second half he
     crosses them out himself first. One football ⚽ for every sum. At full
     time he picks a holiday adventure and hears a message to Old Bear he can
     record on Seesaw. */

  var CONFETTI = ['⚽', '⭐', '🎉', '🧸', '🍯', '💛'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261023-schulmail-fri-16-oct-202.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  var ROUNDS_PER_HALF = 4;
  var MIN_N = 3, MAX_N = 10;          /* pictures on the blanket */
  var HALF1_MAX = 7, HALF2_MIN = 6;   /* first half smaller, second half bigger */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];

  var FOODS = [
    { pic: '🍎', many: 'apples' },
    { pic: '🧁', many: 'cakes' },
    { pic: '🍪', many: 'biscuits' },
    { pic: '🍓', many: 'strawberries' },
    { pic: '🍐', many: 'pears' },
    { pic: '🥪', many: 'sandwiches' }
  ];

  /* the worked example: seven apples, three eaten */
  var EXAMPLE = { n: 7, k: 3, f: 0 };

  /* holiday adventures for the message to Old Bear */
  var HOLIDAYS = [
    { pic: '🏖️', t: 'go to the beach' },
    { pic: '🌳', t: 'play in the park' },
    { pic: '🚲', t: 'ride my bike' },
    { pic: '🎃', t: 'carve a pumpkin' },
    { pic: '⚽', t: 'play football' },
    { pic: '👵', t: 'visit my grandma' },
    { pic: '✈️', t: 'fly on a plane' },
    { pic: '🏕️', t: 'build a den' }
  ];

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
  function leftOf(s) { return s.n - s.k; }

  /* s = { n: pictures, k: eaten, f: food } */
  function hasSay(s) { return 'Old Bear has ' + WORDS[s.n] + ' ' + FOODS[s.f].many + '.'; }
  function eatsSay(k) { return 'He eats ' + WORDS[k] + '.'; }
  function crossSay(k) { return 'Cross out ' + WORDS[k] + '.'; }
  function sumSay(s) { return cap(WORDS[s.n]) + ' take away ' + WORDS[s.k] + '.'; }
  function resultSay(s) { return cap(WORDS[s.n]) + ' take away ' + WORDS[s.k] + ' is ' + WORDS[leftOf(s)] + '.'; }
  var LEFT_ASK = 'How many are left?';
  var COUNT_LEFT = 'Count what is left.';
  var CROSSED_SAY = 'That one is crossed out.';
  function leftSay(m) { return m === 1 ? 'One is left.' : cap(WORDS[m]) + ' are left.'; }

  /* what he hears at the start of a round */
  function askSay(s, half) {
    return half === 2 ? hasSay(s) + ' ' + eatsSay(s.k) + ' ' + crossSay(s.k)
                      : hasSay(s) + ' ' + eatsSay(s.k) + ' ' + sumSay(s) + ' ' + LEFT_ASK;
  }
  /* the question again once the pictures are crossed out */
  function questionSay(s) { return sumSay(s) + ' ' + LEFT_ASK; }
  /* second half: the last one crossed out, then the question */
  function crossedAllSay(s) { return WORDS[s.k] + '. ' + questionSay(s); }

  function notSay(a, s, together) {
    if (together) return 'Not ' + WORDS[a] + '. Let us count them together.';
    if (a === s.n) return 'Not ' + WORDS[a] + '. That is all of them. Do not count the crossed out ones.';
    if (a === s.k) return 'Not ' + WORDS[a] + '. ' +
      (a === 1 ? 'One is crossed out.' : cap(WORDS[a]) + ' are crossed out.') +
      ' Count the ones that are left.';
    return 'Not ' + WORDS[a] + '. Try again. Count the ones that are not crossed out.';
  }
  function goalSay(s) { return 'Goal! ' + resultSay(s); }

  function introSay(half) {
    return half === 1 ? 'Kick off! Old Bear is having a picnic. The crossed out ones are eaten. '
                      : 'Second half! Now you cross them out. ';
  }

  /* the example, line by line (7 - 3 = 4) */
  var EXAMPLE_SAY = [
    'Here is an example. ' + hasSay(EXAMPLE),
    eatsSay(EXAMPLE.k) + ' ' + crossSay(EXAMPLE.k),
    sumSay(EXAMPLE) + ' ' + COUNT_LEFT,
    leftSay(leftOf(EXAMPLE)),
    resultSay(EXAMPLE) + ' Now it is your turn!'
  ];

  function sumsWord(n) { return WORDS[n] + (n === 1 ? ' take away sum' : ' take away sums'); }
  function halfTimeSay(n) {
    return 'Half time! You did ' + sumsWord(n) + '. In the second half, you cross them out.';
  }
  var MSG_ASK = 'Now tell Old Bear about your holiday adventures. Pick a picture.';
  function fullTimeSay(n) {
    return 'Full time! You did ' + sumsWord(n) + '. Brilliant! What a fantastic half-term of learning! ' + MSG_ASK;
  }
  function msgSay(h) {
    return 'Dear Old Bear. In the half-term break, I will ' + h.t + '. ' +
           'Have a wonderful and restful half-term break! From Jack. ' +
           'Now you can record your message to Old Bear.';
  }

  /* every sum the game can ask: n pictures, k eaten, at least one left */
  function allSums() {
    var out = [];
    for (var n = MIN_N; n <= MAX_N; n++) {
      for (var k = 1; k < n; k++) out.push({ n: n, k: k, f: 0 });
    }
    return out;
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, f, n, a, h, sums = allSums();
    function add(s) { var b = bare(s); if (b && !seen[b]) { seen[b] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var q = 0; q < p.length; q++) add(p[q]); }
    for (i = 0; i < EXAMPLE_SAY.length; i++) addAll(EXAMPLE_SAY[i]);
    for (n = 1; n <= 10; n++) add(WORDS[n]);
    for (n = 1; n <= 10; n++) addAll(leftSay(n));
    addAll(LEFT_ASK);
    addAll(COUNT_LEFT);
    addAll(CROSSED_SAY);
    addAll(introSay(1));
    addAll(introSay(2));
    for (i = 0; i < sums.length; i++) {
      for (f = 0; f < FOODS.length; f++) {
        var s = { n: sums[i].n, k: sums[i].k, f: f };
        addAll(askSay(s, 1));
        addAll(askSay(s, 2));
      }
      addAll(questionSay(sums[i]));
      addAll(crossedAllSay(sums[i]));
      addAll(goalSay(sums[i]));
      for (a = 0; a <= 10; a++) {
        addAll(notSay(a, sums[i], false));
        addAll(notSay(a, sums[i], true));
      }
    }
    for (n = 1; n <= ROUNDS_PER_HALF * 2; n++) { addAll(halfTimeSay(n)); addAll(fullTimeSay(n)); }
    addAll(MSG_ASK);
    for (h = 0; h < HOLIDAYS.length; h++) addAll(msgSay(HOLIDAYS[h]));
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261023schulmailfri16oct202';
  var SLOW_KEY  = 'jackHw_hw20261023schulmailfri16oct202_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* sums finished this match */
  var sum = null;         /* { n, k, f } */
  var phase = 'answer';   /* cross (second half: crossing out first) | answer */
  var crossed = 0;        /* pictures crossed out so far */
  var counted = 0;        /* pictures he has tapped to count */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | example | round | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */
  var countToken = 0;     /* cancels counting out loud */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    sum: $('sum'), pics: $('pics'),
    tiles: $('tiles'), btnRow: $('btnRow'),
    sayBtn: $('sayBtn'), countBtn: $('countBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), holBox: $('holBox'), hols: $('hols'),
    boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261023-schulmail-fri-16-oct-202/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    countToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {

      var t = a[i]; a[i] = a[j]; a[j] = t;

  /* ================= A round ================= */

  /* ================= Match ================= */
  function buildQueues() {
    var easy = [], hard = [];
    allSums().forEach(function (s) {
      if (s.n === EXAMPLE.n && s.k === EXAMPLE.k) return;
      if (s.n <= HALF1_MAX) easy.push(s);
      if (s.n >= HALF2_MIN) hard.push(s);
    });
    var pick = function (pool, taken) {
      var out = [];
      shuffle(pool).forEach(function (s) {
        if (out.length >= ROUNDS_PER_HALF) return;
        var clash = out.concat(taken).some(function (o) {
          return (o.n === s.n && o.k === s.k) || (leftOf(o) === leftOf(s) && out.length < 3);
        });
        if (!clash) out.push(s);
      });
      return out.length === ROUNDS_PER_HALF ? out : shuffle(pool).slice(0, ROUNDS_PER_HALF);
    };
    queue1 = pick(easy, []);
    queue2 = pick(hard, queue1);
    /* a different food every round */
    var foods = shuffle(FOODS.map(function (f, i) { return i; }));
    queue1.concat(queue2).forEach(function (s, i) {
      s.f = foods[i % foods.length];
    });
    queue1 = queue1.map(function (s) { return { n: s.n, k: s.k, f: s.f }; });
    queue2 = queue2.map(function (s) { return { n: s.n, k: s.k, f: s.f }; });
  }

  function startMatch() {
    stopAll();
    buildQueues();
    done = [];
    half = 1;
    round = 0;
    enterExample();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.sum.addEventListener('click', sayAgain);
  els.sayBtn.addEventListener('click', sayAgain);
  els.countBtn.addEventListener('click', function () {
    if (mode === 'round' && !busy && phase === 'answer') countLeft();
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildTiles();
  renderScore(false);
})();
</script>
</body>
</html>
