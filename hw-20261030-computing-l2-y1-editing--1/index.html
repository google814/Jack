<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Editing a Sprite ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Edit a Sprite">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 52%, #2e1065 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 18px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }

  #work {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 2vh, 18px);
  }
  #stage {
    --s: min(42vw, 30vh, 300px);
    display: flex;
    gap: clamp(8px, 2vmin, 18px);
    justify-content: center;
    align-items: flex-end;
  }
  #stage.solo { --s: min(72vw, 38vh, 340px); }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .panel .tag { font-size: clamp(.8rem, 2.2vmin, 1.05rem); font-weight: 800; }
  .canvas {
    width: var(--s);
    height: var(--s);
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    cursor: pointer;
    overflow: hidden;
  }
  #targetPanel .canvas { background: #fef9c3; cursor: default; }
  .canvas svg, .chip svg, .pick svg { display: block; width: 100%; height: 100%; }
  .canvas.pop svg { animation: pop .4s ease; }
  .canvas.wobble svg { animation: shake .4s ease; }
  @keyframes pop {
    0% { transform: scale(.82); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Tools ---------- */
  #tools { display: flex; flex-direction: column; gap: clamp(5px, 1.2vmin, 10px); align-items: center; }
  .toolRow { display: flex; flex-wrap: wrap; gap: clamp(5px, 1.2vmin, 10px); justify-content: center; }
  .tool {
    width: clamp(48px, 10.5vmin, 76px);
    height: clamp(48px, 10.5vmin, 76px);
    padding: 5px;
    background: #f5f3ff;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tool svg { display: block; width: 100%; height: 100%; pointer-events: none; }
  .tool:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tool.colour { border-radius: 50%; }
  .tool.wrong { background: #fecaca; animation: shake .4s ease; }
  .tool.hint {
    box-shadow: 0 0 0 6px rgba(253,224,71,.9);
    animation: pulse 1.1s ease infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.go { background: linear-gradient(145deg, #22c55e, #15803d); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Pick a sprite ---------- */
  #picks { display: grid; grid-template-columns: repeat(2, auto); gap: clamp(10px, 2.4vmin, 20px); }
  .pick {
    width: min(38vw, 26vh, 190px);
    height: min(38vw, 26vh, 190px);
    background: #fff;
    border: none;
    border-radius: 22px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    cursor: pointer;
  }
  .pick:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }

  /* ---------- Upload your work ---------- */
  #uploadBox { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2.4vh, 22px); }
  #projCard {
    --s: min(52vw, 32vh, 260px);
    position: relative;
    background: #fff;
    color: #1e293b;
    border-radius: 18px;
    padding: 8px 8px 6px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    font-weight: 800;
    font-size: clamp(.85rem, 2.2vmin, 1.05rem);
    overflow: hidden;
  }
  #projCard .canvas { box-shadow: none; cursor: default; }
  #projCard.snap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #fff;
    animation: flash .5s ease forwards;
  }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  #upBar {
    width: min(76vw, 420px);
    height: 18px;
    background: rgba(0,0,0,.3);
    border-radius: 999px;
    overflow: hidden;
  }
  #upFill { height: 100%; width: 0; background: #22c55e; transition: width 1.8s linear; }
  #upStatus { font-weight: 800; font-size: clamp(1rem, 2.8vmin, 1.4rem); min-height: 1.4em; }
  .bigAct {
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(1rem, 2.8vmin, 1.3rem);
    color: #1e293b;
    background: #fff;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 20px;
    padding: clamp(10px, 1.8vh, 16px) clamp(20px, 5vw, 36px);
    cursor: pointer;
    min-width: 130px;
  }
  .bigAct .emo { display: block; font-size: clamp(2rem, 7vmin, 3.2rem); line-height: 1.15; }
  .bigAct:active { transform: translateY(4px); border-bottom-width: 2px; }
  .bigAct.now {
    box-shadow: 0 0 0 6px rgba(253,224,71,.9);
    animation: pulse 1.1s ease infinite;
  }
  .bigAct.off { opacity: .45; }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    width: clamp(72px, 17vmin, 120px);
    height: clamp(72px, 17vmin, 120px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    cursor: pointer;
    padding: 2px;
  }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  /* a phone on its side: sprite on the left, tools on the right */
  @media (max-height: 520px) and (orientation: landscape) {
    #work { flex-direction: row; }
    #stage { --s: min(24vw, 46vh); }
    #stage.solo { --s: min(34vw, 52vh); }
    .tool { width: 46px; height: 46px; }
    #projCard { --s: 34vh; }
    .pick { width: 30vh; height: 30vh; }
    #picks { grid-template-columns: repeat(4, auto); }
    #uploadBox { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Editing a sprite</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="picks" class="hidden"></div>

  <div id="work" class="hidden">
    <div id="stage">
      <div class="panel hidden" id="targetPanel">
        <span class="tag">👀 Picture</span>
        <div class="canvas" id="targetCanvas"></div>
      </div>
      <div class="panel">
        <span class="tag hidden" id="myTag">✏️ My sprite</span>
        <div class="canvas" id="myCanvas"></div>
      </div>
    </div>
    <div id="tools" class="hidden"></div>
  </div>

  <div id="uploadBox" class="hidden">
    <div id="projCard">
      <div class="canvas" id="projCanvas"></div>
      <div>My project today</div>
    </div>
    <div class="row">
      <button class="bigAct" id="snapBtn" type="button"><span class="emo">📷</span>Photo</button>
      <button class="bigAct" id="upBtn" type="button"><span class="emo">⬆️</span>Upload</button>
    </div>
    <div id="upBar"><div id="upFill"></div></div>
    <div id="upStatus"></div>
  </div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn go" id="toUploadBtn">⬆️ Upload your work</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Editing a sprite ⚽</h2>
  <p>Computing<br>Change the colour and the size. Add a hat.<br>My project today · Upload your work</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Computing_L2_Y1_Editing_a_Sprite: "My project today" / "Upload your work".
     A sprite is a character in a computer project; editing it means changing
     how it looks. The first match starts with a short look at the tools.
     First half: four sprites, he hears one edit ("Make the cat red") and taps
     the tool. Second half: four sprites, two edits each, he makes his sprite
     look the same as the picture. Then "My project today": he picks a sprite,
     edits it any way he likes and uploads his work, the way his work goes to
     Seesaw: take a photo, then tap Upload. One football ⚽ for every sprite
     and one for the upload. */

  var ROUNDS_PER_HALF = 4;

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🎨', '🎩'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261030-computing-l2-y1-editing--1.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];

  var SPRITE_NAMES = ['cat', 'robot', 'fish', 'monster'];
  var COLOURS = ['red', 'blue', 'green', 'yellow', 'orange', 'purple'];
  var WEARS = { hat: 'a hat', crown: 'a crown', glasses: 'glasses', ball: 'a football' };
  var EDIT_TOOLS = COLOURS.concat(['bigger', 'smaller', 'turn', 'hat', 'crown', 'glasses', 'ball']);

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function toolKind(t) {
    if (COLOURS.indexOf(t) >= 0) return 'colour';
    if (t === 'bigger' || t === 'smaller') return 'size';
    if (t === 'turn') return 'turn';
    if (t === 'undo') return 'undo';
    return 'wear';
  }

  /* what a tool says when it is tapped */
  function toolSay(t) {
    var k = toolKind(t);
    if (k === 'wear') return cap(WEARS[t]) + '.';
    if (k === 'turn') return 'Turn round.';
    return cap(t) + '.';
  }

  /* "Make the cat red." */
  function taskSay(name, t) {
    var k = toolKind(t);
    if (k === 'wear') return 'Give the ' + name + ' ' + WEARS[t] + '.';
    if (k === 'turn') return 'Turn the ' + name + ' round.';
    return 'Make the ' + name + ' ' + t + '.';
  }

  /* "You made the cat red." */
  function didSay(name, t) {
    var k = toolKind(t);
    if (k === 'wear') return 'You gave the ' + name + ' ' + WEARS[t] + '.';
    if (k === 'turn') return 'You turned the ' + name + ' round.';
    return 'You made the ' + name + ' ' + t + '.';
  }
  function chipSay(name, edits) {
    return edits.map(function (t) { return didSay(name, t); }).join(' ');
  }
  function goalSay(name, edits) { return 'Goal! ' + chipSay(name, edits); }

  /* half 1 he hears the edit, half 2 he looks at the picture */
  function askSay(half, name, edits) {
    return half === 1 ? taskSay(name, edits[0])
                      : 'Look at the picture. Make your ' + name + ' look the same.';
  }
  function introSay(half) {
    return half === 1 ? 'First half! Listen, then edit the sprite. '
                      : 'Second half! Two changes every time. ';
  }
  function yesSay(t) { return 'Yes! ' + toolSay(t) + ' One more change.'; }
  function notSay(half, name, edits) { return 'Not that one. Try again. ' + askSay(half, name, edits); }
  function hintSay(name, t) { return 'Not that one. Tap the shining one. ' + taskSay(name, t); }
  var DONE_SAY = 'You did that one. One more change.';

  /* the first look at the tools, line by line */
  var INTRO_SAY = [
    'Editing a sprite!',
    'This is a sprite. A sprite is a character in your project.',
    'Editing a sprite means changing how it looks.',
    'You can change the colour.',
    'You can make it bigger or smaller.',
    'You can add a hat.',
    'You can turn it round.',
    'Now it is your turn!'
  ];

  /* my project today */
  var PICK_SAY = 'My project today! Pick a sprite.';
  var FREE_SAY = 'Now edit your sprite. Change anything you like. Then tap Upload your work.';
  var NEED_EDIT_SAY = 'Edit your sprite first.';
  function pickedSay(name) { return 'The ' + name + '! ' + FREE_SAY; }
  function projectChipSay(name) { return 'My project today. My ' + name + '.'; }

  /* upload your work, step by step */
  var UPLOAD_SAY = {
    start: 'Now upload your work! First, take a photo of your project.',
    snap: 'Click! Great photo. Next, tap Upload.',
    going: 'Uploading your work.',
    done: 'Your work is uploaded! Well done!'
  };

  function halfTimeSay(n) {
    return 'Half time! You edited ' + WORDS[n] + ' sprites. ' +
           'In the second half, make your sprite look the same as the picture.';
  }
  function fullTimeSay(n) {
    return 'Full time! You edited ' + WORDS[n] + ' sprites and uploaded your work. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, k;
    function add(s) { var b = bare(s); if (b && !seen[b]) { seen[b] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var q = 0; q < p.length; q++) add(p[q]); }
    for (i = 0; i < INTRO_SAY.length; i++) addAll(INTRO_SAY[i]);
    addAll(introSay(1));
    addAll(introSay(2));
    for (j = 0; j < EDIT_TOOLS.length; j++) {
      addAll(toolSay(EDIT_TOOLS[j]));
      addAll(yesSay(EDIT_TOOLS[j]));
    }
    addAll(toolSay('undo'));
    for (i = 0; i < SPRITE_NAMES.length; i++) {
      var name = SPRITE_NAMES[i];
      for (j = 0; j < EDIT_TOOLS.length; j++) {
        addAll(taskSay(name, EDIT_TOOLS[j]));
        addAll(goalSay(name, [EDIT_TOOLS[j]]));
        addAll(hintSay(name, EDIT_TOOLS[j]));
        addAll(notSay(1, name, [EDIT_TOOLS[j]]));
      }
      addAll(askSay(2, name, []));
      addAll(notSay(2, name, []));
      addAll(pickedSay(name));
      addAll(projectChipSay(name));
    }
    addAll(DONE_SAY);
    addAll(PICK_SAY);
    addAll(FREE_SAY);
    addAll(NEED_EDIT_SAY);
    for (k in UPLOAD_SAY) addAll(UPLOAD_SAY[k]);
    addAll(halfTimeSay(4));
    addAll(fullTimeSay(8));
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261030computingl2y1editing1';
  var SLOW_KEY  = 'jackHw_hw20261030computingl2y1editing1_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* sprites finished this match: { look, name, edits } */
  var task = null;        /* { name, edits } */
  var look = null;        /* the sprite as it is now */
  var goal = null;        /* the sprite as it should end up */
  var attempts = 0;
  var busy = false;
  var history = [];       /* my project today: the looks to undo back to */
  var project = null;     /* my project today: { look, name } */
  var introSeen = false;
  var upStep = 0;         /* 0 take a photo, 1 upload, 2 uploading, 3 done */
  var mode = 'start';     /* start | intro | round | finished | pick | free | upload | uploaded | board */
  var flowToken = 0;      /* cancels a talking sequence */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    picks: $('picks'), work: $('work'), stage: $('stage'),
    targetPanel: $('targetPanel'), targetCanvas: $('targetCanvas'),
    myTag: $('myTag'), myCanvas: $('myCanvas'), tools: $('tools'),

  function speakParts(parts, done, rate) {

      return;

      if (my !== speakToken) return;

        if (my !== speakToken) return;

    for (var i = 0; i < h.length; i++) h[i].classList.remove('hint');
  }
  /* the edit he has not done yet */
  function nextEdit() {
    for (var i = 0; i < task.edits.length; i++) {
      var t = task.edits[i], k = toolKind(t);
      if (k === 'colour' && look.colour !== goal.colour) return t;
      if (k === 'size' && look.size !== goal.size) return t;
      if (k === 'wear' && look.wear !== goal.wear) return t;
      if (k === 'turn' && look.flip !== goal.flip) return t;
    }
    return task.edits[0];
  }

  function renderLook(effect) {
    els.myCanvas.innerHTML = spriteSvg(look);
    els.myCanvas.classList.remove('pop', 'wobble');
    if (effect) { void els.myCanvas.offsetWidth; els.myCanvas.classList.add(effect); }
  }

  function tapTool(t, btn) {
    if (mode === 'free') { editFree(t); return; }
    if (mode !== 'round' || busy) return;
    stopAll();
    var before = differences(look, goal);
    var next = applyTool(look, t);
    if (differences(next, goal) < before) {
      attempts = 0;
      clearHints();
      look = next;
      renderLook('pop');
      if (sameLook(look, goal)) { finishSprite(); return; }
      speak(yesSay(t));
      return;
    }
    /* tapped again after it was done: bigger at its biggest, the same colour */
    if (sameLook(next, look) && task.edits.indexOf(t) >= 0) {
      speak(DONE_SAY);
      return;
    }
    /* wrong: he sees what it does, then it goes back */
    attempts++;
    btn.classList.remove('wrong');
    void btn.offsetWidth;
    btn.classList.add('wrong');
    var keep = look;
    var want = nextEdit();
    busy = true;
    look = next;
    renderLook('wobble');
    if (attempts >= 2) speak(hintSay(task.name, want));
    else speak(notSay(half, task.name, task.edits));
    setTimeout(function () {
      look = keep;
      renderLook();
      btn.classList.remove('wrong');
      busy = false;
      if (attempts >= 2) {
        clearHints();
        var b = toolButton(want);
        if (b) b.classList.add('hint');
      }
    }, 900);
  }

  /* ================= The first look at the tools ================= */
  function enterIntro() {
    stopAll();
    mode = 'intro';
    els.half.textContent = 'Editing a sprite';
    els.lead.textContent = 'Editing a sprite ✏️';
    els.nextBtn.textContent = 'My turn ➜';
    stageFor(false);
    els.tools.classList.add('hidden');
    show(['lead', 'work', 'btnRow'], ['sayBtn', 'nextBtn']);
    playIntro();
  }

  function playIntro() {
    look = freshLook('cat');
    renderLook();
    var set = function (t) {
      return function () { look = applyTool(look, t); renderLook('pop'); };
    };
    sequence([
      { say: INTRO_SAY[0] },
      { say: INTRO_SAY[1] },
      { say: INTRO_SAY[2] },
      { act: set('blue'), say: INTRO_SAY[3] },
      { act: set('bigger'), say: INTRO_SAY[4] },
      { act: set('hat'), say: INTRO_SAY[5] },
      { act: set('turn'), say: INTRO_SAY[6] },
      { say: INTRO_SAY[7] }
    ]);
  }

  /* ================= A round ================= */
  function stageFor(withPicture) {
    els.stage.classList.toggle('solo', !withPicture);
    els.targetPanel.classList.toggle('hidden', !withPicture);
    els.myTag.classList.toggle('hidden', !withPicture);
  }
  function setToolsFor(free) {
    els.tools.classList.remove('hidden');
    toolButton('undo').classList.toggle('hidden', !free);
    clearHints();
  }

  function current() { return half === 1 ? queue1[round] : queue2[round]; }
  function leadFor() {
    return half === 1 ? bare(taskSay(task.name, task.edits[0])) + ' 🎨'
                      : '👀 Make your ' + task.name + ' look the same';
  }

  function enterRound() {
    stopAll();
    mode = 'round';
    busy = false;
    attempts = 0;
    task = current();
    look = freshLook(task.name);
    goal = look;
    task.edits.forEach(function (t) { goal = applyTool(goal, t); });
    els.half.textContent = (half === 1 ? 'First half · ' : 'Second half · ') + (round + 1) + '/' + ROUNDS_PER_HALF;
    stageFor(half === 2);
    els.targetCanvas.innerHTML = half === 2 ? spriteSvg(goal) : '';
    renderLook();
    setToolsFor(false);
    els.lead.textContent = leadFor();
    show(['lead', 'work', 'btnRow'], ['sayBtn']);
    var intro = round === 0 ? introSay(half) : '';
    var my = ++flowToken;
    setTimeout(function () {
      if (my === flowToken && mode === 'round') speak(intro + askSay(half, task.name, task.edits));
    }, 300);
  }

  function finishSprite() {
    busy = true;
    mode = 'finished';
    done.push({ look: copyLook(look), name: task.name, edits: task.edits });
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    els.lead.textContent = 'GOAL! ⚽';
    var last = round === ROUNDS_PER_HALF - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'My project ➜') : 'Next ➜';
    els.tools.classList.add('hidden');
    show(['lead', 'work', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak(goalSay(task.name, task.edits));
  }

  function nextRound() {
    stopAll();
    if (mode === 'intro') { introSeen = true; enterRound(); return; }
    if (mode === 'uploaded') { enterFullTime(); return; }
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterPick();
      return;
    }
    enterRound();
  }

  /* ================= My project today ================= */
  function enterPick() {
    stopAll();
    mode = 'pick';
    els.half.textContent = 'My project today';
    els.lead.textContent = 'My project today: pick a sprite';
    els.picks.innerHTML = '';
    SPRITE_NAMES.forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.setAttribute('aria-label', name);
      b.innerHTML = spriteSvg(freshLook(name));
      b.addEventListener('click', function () { pickSprite(name); });
      els.picks.appendChild(b);
    });
    show(['lead', 'picks', 'btnRow'], ['sayBtn']);
    speak(PICK_SAY);
  }

  function pickSprite(name) {
    if (mode !== 'pick') return;
    stopAll();
    mode = 'free';
    look = freshLook(name);
    history = [];
    stageFor(false);
    renderLook('pop');
    setToolsFor(true);
    els.lead.textContent = 'Edit your sprite ✏️';
    show(['lead', 'work', 'btnRow'], ['sayBtn', 'toUploadBtn']);
    speak(pickedSay(name));
  }

  function editFree(t) {
    stopAll();
    if (t === 'undo') {
      if (history.length) { look = history.pop(); renderLook('pop'); }
    } else {
      var next = applyTool(look, t);
      if (!sameLook(next, look)) { history.push(look); look = next; renderLook('pop'); }
    }
    speak(toolSay(t));
  }

  /* ================= Upload your work ================= */
  function enterUpload() {
    stopAll();
    if (!history.length) { speak(NEED_EDIT_SAY); return; }
    mode = 'upload';
    upStep = 0;
    project = { look: copyLook(look), name: look.name };
    els.half.textContent = 'Upload your work';
    els.lead.textContent = 'Upload your work! 📷 then ⬆️';
    els.projCanvas.innerHTML = spriteSvg(project.look);
    els.projCard.classList.remove('snap');
    els.upFill.style.transition = 'none';
    els.upFill.style.width = '0';
    els.upStatus.textContent = '';
    markUpload();
    show(['lead', 'uploadBox']);
    speak(UPLOAD_SAY.start);
  }

  function markUpload() {
    els.snapBtn.classList.toggle('now', upStep === 0);
    els.snapBtn.classList.toggle('off', upStep > 0);
    els.upBtn.classList.toggle('now', upStep === 1);
    els.upBtn.classList.toggle('off', upStep !== 1);
  }

  function takePhoto() {
    if (mode !== 'upload' || upStep !== 0) return;
    stopAll();
    upStep = 1;
    els.projCard.classList.remove('snap');
    void els.projCard.offsetWidth;
    els.projCard.classList.add('snap');
    markUpload();
    speak(UPLOAD_SAY.snap);
  }

  function upload() {
    if (mode !== 'upload') return;
    if (upStep === 0) { speak(UPLOAD_SAY.start); return; }
    if (upStep !== 1) return;
    stopAll();
    upStep = 2;
    markUpload();
    els.upStatus.textContent = 'Uploading…';
    void els.upFill.offsetWidth;
    els.upFill.style.transition = '';
    els.upFill.style.width = '100%';
    var spoke = false, filled = false;
    var both = function () { if (spoke && filled) uploaded(); };
    speak(UPLOAD_SAY.going, function () { spoke = true; both(); });
    setTimeout(function () { filled = true; both(); }, 1900);
    /* never leave him waiting for a line that did not finish */
    setTimeout(function () { spoke = true; both(); }, 6000);
  }

  function uploaded() {
    if (mode !== 'upload' || upStep !== 2) return;
    upStep = 3;
    mode = 'uploaded';
    footballs++;
    save();
    renderScore(true);
    celebrate(40);
    markUpload();
    els.upStatus.textContent = '✅ Uploaded!';
    els.nextBtn.textContent = 'Full time ➜';
    show(['lead', 'uploadBox', 'btnRow'], ['nextBtn']);
    speak(UPLOAD_SAY.done);
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    var add = function (lookOf, say) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = spriteSvg(lookOf);
      b.addEventListener('click', function () {
        stopAll();
        var chips = els.board.querySelectorAll('.chip');
        for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', chips[c] === b);
        speak(say, function () { b.classList.remove('saying'); });
      });
      els.board.appendChild(b);
    };
    done.forEach(function (d) { add(d.look, chipSay(d.name, d.edits)); });
    if (project && half === 3) add(project.look, projectChipSay(project.name));
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = 'Next: make it look the same as the picture.';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(done.length));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = done.length + ' sprites · 1 upload · ' + (done.length + 1) + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(done.length));
  }

  /* ================= Match ================= */
  function randomEdit(kind, name) {
    if (kind === 'colour') {
      return shuffle(COLOURS.filter(function (c) { return c !== ART[name].colour; }))[0];
    }
    if (kind === 'size') return Math.random() < 0.5 ? 'bigger' : 'smaller';
    if (kind === 'wear') return shuffle(Object.keys(WEARS))[0];
    return 'turn';
  }

  function buildQueues() {
    var kinds = ['colour', 'size', 'wear', 'turn'];
    var one = shuffle(kinds);
    var names1 = shuffle(SPRITE_NAMES);
    queue1 = one.map(function (k, i) { return { name: names1[i], edits: [randomEdit(k, names1[i])] }; });
    var pairs = [];
    kinds.forEach(function (a, i) {
      kinds.slice(i + 1).forEach(function (b) { pairs.push([a, b]); });
    });
    pairs = shuffle(pairs).slice(0, ROUNDS_PER_HALF);
    var names2 = shuffle(SPRITE_NAMES);
    queue2 = pairs.map(function (p, i) {
      return { name: names2[i], edits: [randomEdit(p[0], names2[i]), randomEdit(p[1], names2[i])] };
    });
  }

  function startMatch() {
    stopAll();
    buildQueues();
    done = [];
    project = null;
    half = 1;
    round = 0;
    if (introSeen) enterRound(); else enterIntro();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  /* say the current job again; tapping the sprite does the same */
  function sayAgain() {
    if (mode === 'intro') { playIntro(); return; }
    stopAll();
    if (mode === 'round') speak(askSay(half, task.name, task.edits));
    else if (mode === 'finished') speak(goalSay(task.name, task.edits));
    else if (mode === 'pick') speak(PICK_SAY);
    else if (mode === 'free') speak(FREE_SAY);
  }
  els.sayBtn.addEventListener('click', sayAgain);
  els.myCanvas.addEventListener('click', sayAgain);
  els.nextBtn.addEventListener('click', nextRound);
  els.toUploadBtn.addEventListener('click', enterUpload);
  els.snapBtn.addEventListener('click', takePhoto);
  els.upBtn.addEventListener('click', upload);

  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildTools();
  renderScore(false);
})();
</script>
</body>
</html>
