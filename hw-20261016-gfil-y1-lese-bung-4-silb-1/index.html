<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c4a6e">
<title>Silbenboot ⛵</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Silbenboot">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 6%, transparent 6% 12%),
      linear-gradient(160deg, #14532d, #166534 55%, #14532d);
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    overflow: hidden;          /* the whole game fits on one screen where it can */
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  a:focus-visible, button:focus-visible { outline: 3px solid #fde047; outline-offset: 2px; }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: rgba(0,0,0,.26);
    flex: 0 0 auto;
  }
  header .home {
    text-decoration: none; color: #f1f5f9;
    font-size: 1.5rem; line-height: 1;
    min-width: 44px; min-height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: rgba(255,255,255,.13);
  }
  header h1 { font-size: clamp(1rem, 2.8vw, 1.5rem); white-space: nowrap; }
  /* on a phone the score matters more than the title */
  @media (max-width: 560px) { header h1 { display: none; } }
  #score {
    flex: 1;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 1px;
    font-size: 1.25rem;
    justify-content: flex-end;
    overflow: hidden;
    max-height: 2.2rem;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.2rem; margin-left: 6px; }
  @media (max-width: 560px) { #score { font-size: 1rem; } }
  #settingsBtn {
    background: none; border: none; color: #f1f5f9;
    font-size: 1.2rem; opacity: .5; cursor: pointer;
    min-width: 44px; min-height: 44px;
  }

  #progress { flex: 0 0 auto; height: 6px; background: rgba(255,255,255,.12); }
  #progressBar { height: 100%; width: 0; background: #fde047; transition: width .4s ease; }

  /* ---------- stage ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.8vh, 20px);
    padding: clamp(8px, 1.6vh, 18px) 10px calc(clamp(8px, 1.6vh, 18px) + env(safe-area-inset-bottom));
    text-align: center;
    overflow-x: hidden;
    overflow-y: auto;
  }
  /* centres the content, and still lets it scroll when a screen is too small */
  main::before, main::after { content: ""; flex: 1 1 0; }
  main > * { flex: 0 0 auto; }
  .hidden { display: none !important; }

  #tag { font-size: clamp(.8rem, 2.2vmin, 1rem); font-weight: 700; opacity: .75; letter-spacing: .03em; }
  #lead {
    font-size: clamp(1.15rem, 3.6vmin, 2rem);
    font-weight: 800;
    max-width: 30ch;
    text-shadow: 0 3px 10px rgba(0,0,0,.3);
  }

  /* ---------- a syllable of the carpet: consonant black, vowel red ---------- */
  .sy { display: inline-block; font-weight: 700; line-height: 1; border-radius: .2em; padding: .04em .08em; }
  .sy .c { color: #1f1f1f; }
  .sy .v { color: #e5383b; }
  .sy.lit, .syl.lit { background: #fde68a; animation: lit .55s ease; }

  /* ---------- words with arcs, the way the Fibel prints them ---------- */
  .word { display: inline-flex; align-items: flex-end; gap: 2px; }
  .syl {
    display: inline-block;
    position: relative;
    padding: 0 .06em .32em;
    font-weight: 700;
    line-height: 1;
    border-radius: .2em;
  }
  .syl::after {
    content: "";
    position: absolute;
    left: 6%; right: 6%; bottom: 0;
    height: .26em;
    border: .07em solid currentColor;
    border-top: none;
    border-radius: 0 0 999px 999px;
  }
  .syl.s0 { color: #1f1f1f; }
  .syl.s1 { color: #f08a1c; }
  .word.mono .syl::after { display: none; }
  @keyframes lit {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(-8px) scale(1.15); }
    100% { transform: translateY(0) scale(1); }
  }
  /* the answer, in rainbow */
  .rainbow .c, .rainbow .v {
    color: transparent;
    background: linear-gradient(90deg, #ff3b6b, #ff9f1a, #ffd60a, #2ecc71, #34d399, #8b5cf6, #ff3b6b);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowShift 2.5s linear infinite;
  }
  .rainbow .v { background-position: 60% 0; }

  /* ---------- the house picture of the sentences ---------- */
  .pic {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.35em; height: 1.3em;
    font-size: inherit;
    vertical-align: middle;
    border-radius: .2em;
    background: #fef3c7;
    box-shadow: inset 0 0 0 .05em #f59e0b;
  }
  .pic .em { font-size: .78em; line-height: 1; }
  .dot { font-weight: 700; color: #9ca3af; align-self: flex-end; padding-bottom: .3em; }

  /* ---------- the syllable carpet ---------- */
  #carpet {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(4px, 1vmin, 8px);
    background: #fff;
    border-radius: 22px;
    padding: clamp(8px, 1.8vmin, 16px);
    width: min(96vw, 620px);
    box-shadow: 0 8px 0 rgba(0,0,0,.28);
  }
  #carpet .hd {
    display: grid; place-items: center;
    min-height: 44px;
    font-size: clamp(1.5rem, 5.4vmin, 2.8rem);
    font-weight: 700;
    border-radius: 12px;
  }
  #carpet .hd.vow { background: #fde2dc; color: #e5383b; }
  #carpet .hd.con { background: #dcfce7; color: #1f1f1f; }
  #carpet .hd.corner { background: none; font-size: clamp(1.2rem, 4vmin, 2rem); }
  #carpet .cell {
    font-family: inherit;
    min-width: 44px; min-height: 44px;
    padding: clamp(6px, 1.6vmin, 14px) 2px;
    font-size: clamp(1.5rem, 5.4vmin, 2.8rem);
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    cursor: pointer;
  }
  #carpet .cell:active { transform: translateY(2px); background: #fef9c3; }

  /* ---------- big white cards ---------- */
  .card {
    font-family: inherit;
    background: #fff;
    color: #1f1f1f;
    border: none;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 7px 0 rgba(0,0,0,.28);
    transition: opacity .2s ease;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.28); }
  .card.shake { animation: shake .35s ease; }
  .card.dud { opacity: .3; filter: grayscale(1); }
  .card.off { opacity: .35; pointer-events: none; }
  .card.gone { display: none; }
  .locked .card { pointer-events: none; }

  #choices {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(10px, 2.4vmin, 20px);
    width: 100%; max-width: 1000px;
  }
  .choice {
    flex: 0 0 clamp(110px, 24vmin, 230px);
    min-height: 44px;
    padding: clamp(10px, 2.4vmin, 22px) 6px;
    font-size: clamp(2.4rem, 9vmin, 4.6rem);
  }
  #choices.sent { flex-direction: column; align-items: center; }
  #choices.sent .choice {
    flex: 0 0 auto;
    width: min(94vw, 760px);
    font-size: clamp(1.25rem, 4.8vmin, 2.5rem);
    padding: clamp(8px, 1.6vmin, 14px) 10px;
  }

  /* ---------- the boat: a sailor holds the consonant, the captain the vowel ---------- */
  #choices.boat { flex-direction: column; align-items: center; }
  .boatbox {
    position: relative;
    width: min(90vw, 420px);
    padding-top: 4px;
  }
  .signs { display: flex; justify-content: center; gap: clamp(16px, 6vmin, 48px); }
  .sign {
    width: clamp(64px, 16vmin, 110px); height: clamp(64px, 16vmin, 110px);
    display: grid; place-items: center;
    background: #fff;
    border: 4px dashed #94a3b8;
    border-radius: 10px;
    font-size: clamp(2.4rem, 9vmin, 4.4rem);
    font-weight: 700;
    color: #1f1f1f;
  }
  .sign.v { color: #e5383b; }
  .sign.full { border-style: solid; border-color: #f59e0b; animation: pop .4s ease; }
  .crew { font-size: clamp(2.2rem, 8vmin, 3.8rem); line-height: 1; margin-top: -4px; display: flex; justify-content: center; gap: clamp(30px, 10vmin, 70px); }
  .hull {
    height: clamp(26px, 6vmin, 40px);
    margin: -6px auto 0;
    width: 90%;
    background: linear-gradient(#a16207, #78350f);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    box-shadow: 0 10px 0 -2px #38bdf8;
  }
  .tilerow { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 2vmin, 16px); }
  .tilerow .choice { flex: 0 0 clamp(64px, 15vmin, 120px); font-size: clamp(2rem, 7.6vmin, 3.8rem); padding: clamp(6px, 1.6vmin, 14px) 4px; }
  .tilerow .choice.vow { color: #e5383b; }

  /* a sentence: words and the house in one row, wrapping when it must */
  .sent-line {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: .15em .45em;
  }
  .tok { display: inline-flex; align-items: flex-end; }
  button.tok {
    background: none; border: none; font: inherit; color: inherit;
    padding: .1em .12em; border-radius: .3em;
    min-width: 44px; min-height: 44px;
    align-items: center;
    cursor: pointer;
  }
  button.tok:active { background: rgba(0,0,0,.08); }
  #board {
    background: #fff; color: #1f1f1f;
    border-radius: 26px;
    padding: clamp(14px, 3.2vmin, 30px) clamp(12px, 3vmin, 28px);
    width: min(96vw, 900px);
    font-size: clamp(1.6rem, 6.2vmin, 3.6rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.28);
  }
  #win {
    cursor: pointer;
    font-size: clamp(4rem, 18vmin, 9rem);
    font-weight: 900;
    line-height: 1.1;
    animation: pop .5s ease;
  }
  #win .sy { background: none; }
  #win.sentwin { font-size: clamp(1.5rem, 5.6vmin, 3.2rem); background: #fff; color: #1f1f1f; border-radius: 26px; padding: clamp(14px, 3vmin, 26px); width: min(96vw, 900px); box-shadow: 0 8px 0 rgba(0,0,0,.28); }

  /* the pause after a wrong tap */
  #lockBar { width: min(420px, 80%); height: 10px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
  #lockFill { height: 100%; width: 0; background: #fde047; }

  /* ---------- buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit; font-weight: 800; color: #0f172a;
    border: none; border-radius: 999px; cursor: pointer;
    min-height: 44px;
    padding: clamp(9px, 1.6vh, 14px) clamp(18px, 4vw, 30px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    background: #fde047;
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn.ghost { background: rgba(255,255,255,.14); color: #f1f5f9; box-shadow: none; }
  .btn.big { font-size: clamp(1.2rem, 3.6vmin, 1.9rem); padding: clamp(12px, 2vh, 18px) clamp(26px, 6vw, 46px); }

  /* ---------- overlays ---------- */
  #startOverlay, #endOverlay {
    position: fixed; inset: 0; z-index: 70;
    background: linear-gradient(160deg, #14532d, #166534 55%, #14532d);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 4vh, 32px); text-align: center; padding: 24px;
  }
  #startOverlay h2, #endOverlay h2 { font-size: clamp(1.5rem, 5.5vmin, 2.8rem); }
  #startOverlay p, #endOverlay p { max-width: 30ch; opacity: .9; font-size: clamp(.95rem, 2.4vmin, 1.2rem); }
  #endScore { font-size: clamp(1.4rem, 5vmin, 2.4rem); font-weight: 900; opacity: 1; }
  #playBtn {
    width: clamp(120px, 26vmin, 190px);
    height: clamp(120px, 26vmin, 190px);
    border-radius: 50%;
    font-size: clamp(3rem, 10vmin, 5rem);
    padding: 0;
    animation: pulseWord 1.6s ease-in-out infinite;
  }

  /* ---------- settings ---------- */
  #settingsPanel {
    position: fixed; top: 56px; right: 12px; z-index: 60;
    background: #fff; color: #0f172a;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
    max-width: calc(100vw - 24px);
  }
  #settingsPanel .lbl { font-weight: 700; }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; min-height: 44px; padding: 8px 14px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
    text-align: left;
  }

  /* ---------- toast + confetti ---------- */
  #feedback {
    position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%);
    background: rgba(15,23,42,.92); color: #f1f5f9;
    font-size: clamp(1rem, 2.8vmin, 1.4rem); font-weight: 700;
    padding: .55em 1.15em; border-radius: 999px;
    z-index: 50; pointer-events: none; white-space: nowrap;
    animation: pop .3s ease;
  }
  .confetti { position: fixed; top: -6vh; font-size: 1.8rem; animation: fall linear forwards; pointer-events: none; z-index: 80; }

  /* ---------- keyframes ---------- */
  @keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes rainbowShift { to { background-position: 300% 0; } }
  @keyframes pulseWord { 50% { transform: scale(1.1); } }
  @keyframes bounceIn {
    0% { transform: translateY(-40px) scale(.3); opacity: 0; }
    55% { transform: translateY(6px) scale(1.15); opacity: 1; }
    75% { transform: translateY(-4px) scale(.95); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(400deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="Alle Spiele">🏠</a>
  <h1>Silbenboot ⛵</h1>
  <div id="score"></div>
  <button id="settingsBtn" title="Einstellungen">⚙</button>
</header>
<div id="progress"><div id="progressBar"></div></div>

<main>
  <div id="tag"></div>
  <div id="lead"></div>

  <!-- Halbzeit 1: the syllable carpet -->
  <div id="carpet" class="hidden"></div>
  <div id="carpetRow" class="row hidden">
    <button id="readAllBtn" class="btn ghost" type="button">🔊 Alle vorlesen</button>
    <button id="carpetNextBtn" class="btn" type="button">Weiter ➜</button>
  </div>

  <!-- the quizzes -->
  <div id="hearRow" class="row hidden">
    <button id="hearBtn" class="btn ghost" type="button">🔊 Nochmal hören</button>
  </div>
  <div id="choices" class="hidden"></div>
  <div id="lockBar" class="hidden"><div id="lockFill"></div></div>
  <div id="win" class="hidden"></div>

  <!-- Halbzeit 2: read a sentence -->
  <div id="board" class="hidden"></div>
  <div id="checkRow" class="row hidden">
    <button id="checkBtn" class="btn big" type="button">✓ Ich hab's gelesen</button>
  </div>
  <div id="doneRow" class="row hidden">
    <button id="againBtn" class="btn ghost" type="button">🔊 Nochmal</button>
    <button id="nextBtn" class="btn" type="button">Weiter ➜</button>
  </div>
</main>

<div id="startOverlay">
  <h2>⛵ Silbenboot</h2>
  <p>Silben und Sätze lesen. Tipp auf ▶.</p>
  <button id="playBtn" class="btn" type="button">▶</button>
</div>

<div id="endOverlay" class="hidden">
  <h2>🏁 Abpfiff!</h2>
  <p id="endScore"></p>
  <button id="playAgainBtn" class="btn" type="button">▶ Nochmal</button>
</div>

<div id="settingsPanel" class="hidden">
  <span class="lbl">Springe zu</span>
  <div style="display:flex;flex-direction:column;gap:6px">
    <button id="half1Btn" type="button">Halbzeit 1 · Silben</button>
    <button id="half2Btn" type="button">Halbzeit 2 · Sätze</button>
  </div>
  <button id="resetBtn" type="button">Neu anfangen</button>
</div>

<script>
(function () {
  'use strict';

  /* ==== TEXT-CORE ====
     Everything the game can say lives in here and nowhere else. It touches no
     DOM, so tools/phrases/hw-20261016-gfil-y1-lese-bung-4-silb-1.txt is
     generated straight out of this block (tools/gen-phrases.js) and can never
     drift. */

  /* page 1 of the sheet, the Silbenteppich: S s L l down, o i a e across */
  var CONS = ['S', 's', 'L', 'l'];
  var VOWELS = ['o', 'i', 'a', 'e'];
  /* S and s (L and l) sound the same, so a syllable is heard by its sound key
     ('so', 'li' ...) and the clip says it with a spelling the voice cannot
     misread: Si alone could come out as "S I", Sa as "Samstag". */
  var SYL_SAY = {
    so: 'So', si: 'Sie', sa: 'Sah', se: 'Seh',
    lo: 'Lo', li: 'Lie', la: 'La', le: 'Leh'
  };
  var SOUNDS = ['so', 'si', 'sa', 'se', 'lo', 'li', 'la', 'le'];

  /* page 2 of the sheet: three sentences, # marks the house picture */
  var SENTENCES = [
    ['Olli', 'soll', 'mit', 'Alma', 'ins', '#Haus'],
    ['Olli', 'soll', 'mit', 'Mila', 'ins', '#Haus'],
    ['Olli', 'soll', 'mit', 'Mama', 'ins', '#Haus']
  ];
  /* syllables, the way the Fibel splits them; soll, mit, ins are one piece */
  var PARTS = {
    Olli: ['Ol', 'li'], Alma: ['Al', 'ma'], Mila: ['Mi', 'la'], Mama: ['Ma', 'ma'],
    soll: ['soll'], mit: ['mit'], ins: ['ins']
  };
  var WORDS = ['Olli', 'soll', 'mit', 'Alma', 'Mila', 'Mama', 'ins'];
  /* A syllable whose clip does not sound like a syllable is not played alone:
     tapping it plays the whole word instead (the syllable still lights up). */
  var SYL_WHOLE = { Mi: 1, Ol: 1, li: 1 };

  var LINES = {
    intro: "Silbenboot. Los geht's!",
    carpet: 'Tipp auf eine Silbe.',
    sylQ: 'Hör gut zu. Welche Silbe hörst du?',
    boat: 'Bau die Silbe im Boot.',
    read: 'Lies den Satz. Dann tipp auf den Haken.',
    sentQ: 'Hör gut zu. Welcher Satz ist das?',
    half: 'Halbzeit!',
    fire: 'Super-Serie!',
    end: 'Abpfiff! Toll gelesen, Jack!'
  };

  /* a teacher does not say the same thing every time */
  var PRAISE = ['Tor!', 'Super!', 'Klasse!', 'Prima!', 'Genau!', 'Spitze!'];
  var RETRY = ['Schau noch mal.', 'Fast.', 'Hör noch mal hin.'];

  function isPic(tok) { return tok.charAt(0) === '#'; }
  function tokName(tok) { return isPic(tok) ? tok.slice(1) : tok; }

  /* what a syllable of the carpet says: 'Sa' and 'sa' both say 'Sah' */
  function soundKey(syl) { return syl.toLowerCase(); }
  function sylVoice(syl) { return SYL_SAY[soundKey(syl)]; }

  /* what a syllable tap in a word says: the syllable, or the whole word */
  function sylSay(word, i) {
    var p = PARTS[word][i];
    return SYL_WHOLE[p] ? word : p;
  }

  /* a sentence is read in one clip: "Olli soll mit Alma ins Haus." */
  function sentenceText(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) out.push(tokName(s[i]));
    return out.join(' ') + '.';
  }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = String(text == null ? '' : text).replace(/\s+/g, ' ').trim(), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, p;
    function add(s) { if (s && !seen[s]) { seen[s] = 1; out.push(s); } }
    function addAll(text) { var parts = segments(text); for (var k = 0; k < parts.length; k++) add(parts[k]); }
    addAll(LINES.intro);
    addAll(LINES.carpet);
    addAll(LINES.sylQ);
    addAll(LINES.boat);
    addAll(LINES.half + ' ' + LINES.read);
    addAll(LINES.read);
    addAll(LINES.sentQ);
    addAll(LINES.fire);
    addAll(LINES.end);
    for (i = 0; i < PRAISE.length; i++) add(PRAISE[i]);
    for (i = 0; i < RETRY.length; i++) add(RETRY[i]);
    for (i = 0; i < CONS.length; i++) {

  /* ---- Halbzeit 1: Welche Silbe hörst du? ---- */
  function enterPick(n, lead) {
    var t = sylList[n], c = t.key.charAt(0), v = t.key.charAt(1);
    /* the same consonant with another vowel, and the other consonant with the same vowel */
    var others = VOWELS.filter(function (x) { return x !== v; });
    var keys = shuffle([t.key, c + others[Math.floor(Math.random() * others.length)], (c === 's' ? 'l' : 's') + v]);
    els.choices.innerHTML = '';
    els.choices.className = '';
    keys.forEach(function (k) {
      var shown = caseOf(k.charAt(0), t.upper) + k.charAt(1);
      els.choices.appendChild(choiceCard(k, 'Silbe', syEl(shown)));
    });
    startRound({ kind: 'p', target: t.key, want: t.key, keys: keys, upper: t.upper,
                 parts: [SYL_SAY[t.key]] }, lead, n === 0 ? [LINES.sylQ] : []);
  }

  /* ---- Halbzeit 1: build the syllable in the boat ---- */
  function enterBoat(n, lead) {
    var t = sylList[n];
    els.choices.innerHTML = '';
    els.choices.className = 'boat';
    var box = document.createElement('div');
    box.className = 'boatbox';
    box.innerHTML = '<div class="signs"><span class="sign c" id="signC"></span><span class="sign v" id="signV"></span></div>' +
                    '<div class="crew"><span>🧒</span><span>👨‍✈️</span></div><div class="hull"></div>';
    els.choices.appendChild(box);
    var conRow = document.createElement('div');
    conRow.className = 'tilerow';
    ['s', 'l'].forEach(function (c) {
      conRow.appendChild(choiceCard('c' + c, 'Buchstabe', document.createTextNode(caseOf(c, t.upper))));
    });
    var vowRow = document.createElement('div');
    vowRow.className = 'tilerow';
    VOWELS.forEach(function (v) {
      var card = choiceCard('v' + v, 'Buchstabe', document.createTextNode(v));
      card.classList.add('vow', 'off');
      vowRow.appendChild(card);
    });
    els.choices.appendChild(conRow);
    els.choices.appendChild(vowRow);
    startRound({ kind: 'b', target: t.key, want: 'c' + t.key.charAt(0), keys: ['cs', 'cl', 'vo', 'vi', 'va', 've'],
                 upper: t.upper, phase: 0, parts: [SYL_SAY[t.key]] },
               lead, n === 1 ? [LINES.boat] : []);
  }

  /* the right consonant goes up on the sailor's sign, the vowels wake up */
  function boatStep() {
    var sign = $('signC');
    sign.textContent = caseOf(quiz.target.charAt(0), quiz.upper);
    sign.classList.add('full');
    quiz.phase = 1;
    quiz.want = 'v' + quiz.target.charAt(1);
    var cards = choiceCards();
    for (var i = 0; i < cards.length; i++) {
      var k = cards[i].getAttribute('data-key');
      if (k.charAt(0) === 'c') cards[i].classList.add('off');
      else cards[i].classList.remove('off');
    }
    publish();
  }

  /* ---- Halbzeit 2: read a sentence ---- */
  var readIdx = 0;
  function enterRead(n, lead, halftime) {
    readIdx = n;
    els.board.innerHTML = '';
    els.board.appendChild(sentenceEl(SENTENCES[n], true));
    setTag('Halbzeit 2 · Sätze · ' + (n + 1) + '/' + SENTENCES.length);
    els.lead.textContent = 'Lies den Satz.';
    show('read');
    publish({ target: 's' + n });
    preload([sentenceText(SENTENCES[n])].concat(PRAISE));
    if (n === 0) {
      if (halftime) { showFeedback('Halbzeit! ⏱'); celebrate(30); }
      speak(lead.concat(halftime ? [LINES.half] : [], [LINES.read]));
    } else if (lead.length) {
      speak(lead);
    }
  }

  function onRead() {
    if (window.__game.state !== 'read') return;
    goal();
    show('readdone');
    publish({ target: 's' + readIdx });
    els.lead.textContent = 'Tor! ⚽';
    speak([cheer, sentenceText(SENTENCES[readIdx])]);
  }

  /* ---- Halbzeit 2: Welcher Satz ist das? All three, only the name differs. ---- */
  function enterSentQuiz(n, lead) {
    var idx = sentOrder[n];
    var keys = shuffle(['s0', 's1', 's2']);
    els.choices.innerHTML = '';
    els.choices.className = 'sent';
    keys.forEach(function (k) {
      els.choices.appendChild(choiceCard(k, 'Satz', sentenceEl(SENTENCES[parseInt(k.slice(1), 10)], false)));
    });
    startRound({ kind: 's', target: 's' + idx, want: 's' + idx, keys: keys,
                 parts: [sentenceText(SENTENCES[idx])] }, lead, n === 0 ? [LINES.sentQ] : []);
  }

  /* ---- a tap on one of the choices ---- */
  function answer(key, card) {
    if (!quiz || quiz.locked) return;
    if (card.classList.contains('gone') || card.classList.contains('off')) return;
    if (key !== quiz.want) {
      quiz.wrong++;
      quiz.first = false;
      streak = 0;
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      lockCards(card);
      return;
    }
    if (quiz.kind === 'b' && quiz.phase === 0) { boatStep(); return; }
    clearTimers();
    var first = quiz.first;
    var q = quiz;
    if (first) { if (q.kind !== 's') starsW++; else starsS++; }
    if (q.kind === 'b') {
      var sv = $('signV');
      sv.textContent = q.target.charAt(1);
      sv.classList.add('full');
    }
    goal();
    celebrate(first ? 14 : 5);
    /* the syllable (or sentence) big, then on to the next round */
    els.win.innerHTML = '';
    if (q.kind !== 's') {
      els.win.className = 'rainbow';
      els.win.appendChild(syEl(caseOf(q.target.charAt(0), q.upper) + q.target.charAt(1)));
    } else {
      els.win.className = 'sentwin';
      els.win.appendChild(sentenceEl(SENTENCES[parseInt(q.target.slice(1), 10)], false));
    }
    els.lead.textContent = (first ? '⭐ ' : '') + cheer;
    quizTag();
    var ep = epoch;
    var reveal = function () {
      if (ep !== epoch) return;
      show('win');
      publish({ target: q.target });
    };
    quiz = null;
    /* in the boat he sees both signs full for a moment first */
    if (q.kind === 'b') { els.choices.classList.add('locked'); setTimeout(reveal, 700); } else reveal();
    var sayWin = function () {
      var arm = afterSpeech(ep, nextStep);
      speak([cheer].concat(q.parts), arm);
    };
    sayWin();
    els.win.onclick = function () { clearTimeout(timers.next); sayWin(); };
  }

  /* the pause after a wrong tap: no card takes a tap, a bar counts down */
  function lockCards(card) {
    var ms = LOCK_MS[Math.min(quiz.wrong, LOCK_MS.length) - 1];
    clearTimers();
    quiz.locked = true;
    card.classList.add('dud');
    if (quiz.wrong >= 2) dropOne();
    els.choices.classList.add('locked');
    showBar(ms);
    show('locked');
    var left = Math.round(ms / 1000);
    els.lead.textContent = 'Hör gut zu … ' + left;
    timers.tick = setInterval(function () {
      left--;
      if (left <= 0) { clearInterval(timers.tick); timers.tick = null; return; }
      els.lead.textContent = 'Hör gut zu … ' + left;
    }, 1000);
    timers.lock = setTimeout(unlockCards, ms);
    showFeedback('Nochmal 🙂');
    speak([RETRY[(quiz.wrong - 1) % RETRY.length]].concat(quiz.parts));
    publish();
  }

  /* after two wrong taps one wrong choice leaves, if two or more are left */
  function dropOne() {
    var cards = choiceCards(), left = [], all = 0, i;
    for (i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (c.classList.contains('gone') || c.classList.contains('off')) continue;
      all++;
      if (c.getAttribute('data-key') !== quiz.want && !c.classList.contains('dud')) left.push(c);
    }
    if (left.length < 1 || all <= 2) return;     /* right one + the tapped one stay */
    var go = left[Math.floor(Math.random() * left.length)];
    go.classList.add('gone');
    go.setAttribute('aria-hidden', 'true');
  }

  function unlockCards() {
    if (!quiz) return;
    clearTimers();
    quiz.locked = false;
    els.choices.classList.remove('locked');
    var cards = choiceCards();
    for (var i = 0; i < cards.length; i++) cards[i].classList.remove('dud');
    questionLead();
    show('ask');
    publish();
  }

  /* ---- goal, finish ---- */
  function goal() {
    footballs++;
    streak++;
    save();
    renderScore(true);
    var toast = $('feedback');       /* a "nochmal" must not sit on the answer */
    if (toast) toast.remove();
    if (streak > 0 && streak % 5 === 0) {
      showFeedback('Super-Serie! 🔥');
      cheer = LINES.fire;
    } else {
      /* never the same praise twice in a row */
      var next;
      do { next = PRAISE[Math.floor(Math.random() * PRAISE.length)]; } while (next === cheer);
      cheer = next;
    }
  }

  function finish() {
    pos = TOTAL;
    save();
    renderProgress();
    epoch++;
    clearTimers();
    show('none');
    els.endScore.textContent = '⚽ ' + footballs + '   ⭐ ' + (starsW + starsS);
    els.endOverlay.classList.remove('hidden');
    celebrate(50);
    window.__game.state = 'end';
    speak(LINES.end);
  }

  function jumpTo(p) {
    streak = 0;
    newRun();
    enterStep(p);
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasTTS) pickVoice();
    els.startOverlay.remove();
    preload(phraseList());
    prefix = [LINES.intro];
    enterStep(pos);
  });

  els.readAllBtn.addEventListener('click', readAll);
  els.carpetNextBtn.addEventListener('click', function () { enterStep(1); });
  els.hearBtn.addEventListener('click', function () { if (quiz) speakParts(quiz.parts); });
  els.checkBtn.addEventListener('click', onRead);
  els.againBtn.addEventListener('click', function () { speakParts([sentenceText(SENTENCES[readIdx])]); });
  els.nextBtn.addEventListener('click', nextStep);
  els.playAgainBtn.addEventListener('click', function () { jumpTo(0); });

  els.half1Btn.addEventListener('click', function () { jumpTo(0); });
  els.half2Btn.addEventListener('click', function () { jumpTo(STEP_SENT); });
  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Alle Fußbälle löschen und neu anfangen?')) {
      footballs = 0;
      renderScore(false);
      jumpTo(0);
    }
  });

  window.__game = { state: 'start', step: pos, kind: kindOf(pos), half: half(pos), round: 0,
                    target: null, want: null, wrong: 0, stars: 0, options: [] };

  newRun();
  renderScore(false);
  renderProgress();
})();
</script>
</body>
</html>
