<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Match the Adjective ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Adjectives">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 52%, #2e1065 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }

  /* ---------- The word he hears (first half) ---------- */
  #wordBtn {
    font-family: inherit;
    font-size: clamp(2rem, 9vmin, 4rem);
    font-weight: 900;
    color: #4c1d95;
    background: #fff;
    border: none;
    border-bottom: 8px solid rgba(0,0,0,.28);
    border-radius: 22px;
    padding: clamp(6px, 1.4vh, 12px) clamp(26px, 6vw, 48px);
    cursor: pointer;
    letter-spacing: .02em;
  }
  #wordBtn::after { content: ' 🔊'; font-size: .5em; vertical-align: middle; }
  #wordBtn:active { transform: translateY(4px); border-bottom-width: 3px; }

  /* ---------- Pictures ---------- */
  .art { display: block; width: 100%; height: 100%; }
  #pics {
    display: grid;
    grid-template-columns: repeat(2, auto);
    gap: clamp(10px, 2.4vmin, 20px);
    justify-content: center;
  }
  @media (min-aspect-ratio: 3/2) { #pics { grid-template-columns: repeat(4, auto); } }
  .pic {
    --s: clamp(120px, min(40vw, 30vh), 250px);
    width: var(--s);
    height: var(--s);
    padding: 0;
    border: 6px solid #fff;
    border-radius: 26px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.28);
  }
  @media (min-aspect-ratio: 3/2) { .pic { --s: clamp(110px, min(22vw, 42vh), 250px); } }
  .pic:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.28); }
  .pic.wrong { animation: shake .4s ease; border-color: #f87171; }
  .pic.hint { border-color: #fde047; animation: pulse 1.1s ease infinite; }
  .pic.right { border-color: #4ade80; animation: bounceIn .5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* ---------- Second half: one picture, the eight words ---------- */
  #bigBox { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 12px); }
  #bigPic { --s: clamp(120px, min(52vw, 30vh), 270px); }
  #found { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 2.2em; }
  .slot {
    min-width: 4.6em;
    padding: 4px 12px;
    border-radius: 999px;
    border: 3px dashed rgba(255,255,255,.6);
    font-weight: 900;
    font-size: clamp(1rem, 3vmin, 1.4rem);
    line-height: 1.4;
  }
  .slot.full { border-style: solid; border-color: #4ade80; background: #dcfce7; color: #166534; animation: bounceIn .5s ease; }
  #cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(6px, 1.6vmin, 14px);
    width: min(100%, 680px);
  }
  .card {
    font-family: inherit;
    font-size: clamp(1.25rem, 4.6vmin, 2.1rem);
    font-weight: 900;
    color: #4c1d95;
    background: #fff;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 18px;
    padding: clamp(12px, 2.4vh, 22px) 4px;
    cursor: pointer;
  }
  .card:active { transform: translateY(4px); border-bottom-width: 2px; }
  .card.wrong { background: #fecaca; animation: shake .4s ease; }
  .card.got { background: #bbf7d0; color: #166534; }
  .card.got::after { content: ' ✓'; }
  .card.hint { outline: 5px solid #fde047; outline-offset: 2px; animation: pulse 1.1s ease infinite; }
  .card.saying { outline: 5px solid #fde047; outline-offset: 2px; }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #8b5cf6, #6d28d9);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 1.6vmin, 14px);
    justify-content: center;
    max-width: 760px;
  }
  .chip {
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 18px;
    border: 3px solid #fde047;
    background: #fff;
    color: #4c1d95;
    cursor: pointer;
    font-weight: 900;
    font-size: clamp(.95rem, 2.6vmin, 1.25rem);
  }
  .chip .mini { width: clamp(72px, 16vmin, 120px); height: clamp(72px, 16vmin, 120px); border-radius: 12px; overflow: hidden; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 30ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #startPics { display: flex; gap: 10px; }
  #startPics .mini { width: clamp(56px, 14vmin, 100px); height: clamp(56px, 14vmin, 100px); border-radius: 14px; overflow: hidden; border: 3px solid #fff; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Match the adjective</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <button id="wordBtn" class="hidden" type="button"></button>
  <div id="pics" class="hidden"></div>

  <div id="bigBox" class="hidden">
    <button class="pic" id="bigPic" type="button"></button>
    <div id="found"></div>
  </div>
  <div id="cards" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="hearBtn">🔊 Hear the words</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Match the adjective ⚽</h2>
  <div id="startPics"></div>
  <p>Adjectives are describing words.<br>red · shiny · pretty · old<br>dark · cold · soft · pink</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Week 3 - English Homework: adjectives.
     "Match the pictures to the correct adjective."
     Pictures: a brown teddy bear, a dark attic with old toys, a pink flower,
     a red apple.  Words: red, shiny, pretty, old, dark, cold, soft, pink.

     Eight words, four pictures: two words for each, and "old" fits both the
     teddy bear and the attic. A tap is only wrong when the word really does
     not fit the picture.
     First half: he hears a word and taps the picture it describes (all
     eight words, one football each). Second half: one picture, the eight
     word cards; a tap reads the card out, and he finds every word that
     matches that picture (all four pictures, one football each). */

  var CONFETTI = ['⚽', '⭐', '🎉', '🍎', '🌸', '🧸'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261023-week-3-english-homework-1.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  /* the eight words, in the order on the worksheet */
  var ADJECTIVES = ['red', 'shiny', 'pretty', 'old', 'dark', 'cold', 'soft', 'pink'];

  /* the four pictures and every word that fits each one */
  var PICTURES = [
    { id: 'teddy',  name: 'teddy bear', words: ['soft', 'old'] },
    { id: 'attic',  name: 'attic',      words: ['dark', 'cold', 'old'] },
    { id: 'flower', name: 'flower',     words: ['pink', 'pretty'] },
    { id: 'apple',  name: 'apple',      words: ['red', 'shiny'] }
  ];

  var NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
             'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fits(pic, w) { return pic.words.indexOf(w) >= 0; }
  function picsFor(w) { return PICTURES.filter(function (p) { return fits(p, w); }); }
  /* "red and shiny", "dark, cold and old" */
  function listWords(ws) {
    if (ws.length === 1) return ws[0];
    return ws.slice(0, -1).join(', ') + ' and ' + ws[ws.length - 1];
  }

  function isSay(pic, w) { return 'The ' + pic.name + ' is ' + w + '.'; }
  function descSay(pic) { return 'The ' + pic.name + ' is ' + listWords(pic.words) + '.'; }
  function wordSay(w) { return cap(w) + '.'; }

  function introSay(half) {
    return half === 1
      ? 'Adjectives are describing words. Listen to the word, then tap the picture that matches. '
      : 'Now look at one picture. Find all the describing words that match it. ';
  }

  /* first half: hear the word, tap the picture */
  function askPic(w) { return 'Which picture is ' + w + '?'; }
  function goalPic(pic, w) { return 'Goal! ' + isSay(pic, w); }
  function notPic(pic, w) { return 'Not the ' + pic.name + '. ' + descSay(pic) + ' ' + askPic(w); }
  function herePic(w) {
    var ps = picsFor(w);
    return 'Look, here it is. ' + ps.map(function (p) { return isSay(p, w); }).join(' ') +
           (ps.length > 1 ? ' Tap one of them.' : ' Tap it.');
  }

  /* second half: one picture, find its words */
  function askWords(pic) { return 'Find ' + NUM[pic.words.length] + ' words for the ' + pic.name + '.'; }
  function moreSay(n) { return n === 1 ? 'One more word.' : cap(NUM[n]) + ' more words.'; }
  function yesWord(pic, w, left) {
    return cap(w) + '! Yes, the ' + pic.name + ' is ' + w + '. ' + moreSay(left);
  }
  function noWord(pic, w) { return cap(w) + '? No, the ' + pic.name + ' is not ' + w + '.'; }
  function hintWord(w) { return 'Try this one. ' + wordSay(w); }
  function goalWords(pic, w) { return cap(w) + '! Goal! ' + descSay(pic); }
  function hearSay() { return 'Here are the words.'; }

  function halfTimeSay(n) {
    return 'Half time! You scored ' + NUM[n] + ' goals. ' +
           'In the second half, find the words for each picture.';
  }
  function fullTimeSay(n) {
    return 'Full time! You scored ' + NUM[n] + ' goals. Brilliant!';
  }

  var ROUNDS1 = ADJECTIVES.length;   /* first half: every word once */
  var ROUNDS2 = PICTURES.length;     /* second half: every picture once */

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, n;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }
    addAll(introSay(1) + askPic(ADJECTIVES[0]));
    addAll(introSay(2) + askWords(PICTURES[0]));
    addAll(hearSay());
    for (i = 0; i < ADJECTIVES.length; i++) {
      var w = ADJECTIVES[i];
      addAll(wordSay(w));
      addAll(askPic(w));
      addAll(herePic(w));
      addAll(hintWord(w));
      for (j = 0; j < PICTURES.length; j++) {
        var p = PICTURES[j];
        if (fits(p, w)) {
          addAll(goalPic(p, w));
          addAll(goalWords(p, w));
          for (n = 1; n < p.words.length; n++) addAll(yesWord(p, w, n));
        } else {
          addAll(notPic(p, w));
          addAll(noWord(p, w));
        }
      }
    }
    for (j = 0; j < PICTURES.length; j++) {
      addAll(descSay(PICTURES[j]));
      addAll(askWords(PICTURES[j]));
      for (n = 1; n <= PICTURES[j].words.length; n++) addAll(moreSay(n));
    }
    addAll(halfTimeSay(ROUNDS1));
    addAll(fullTimeSay(ROUNDS1 + ROUNDS2));
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261023week3englishhomework1';
  var SLOW_KEY  = 'jackHw_hw20261023week3englishhomework1_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var goals = 0;          /* goals this match */
  var word = null;        /* first half: the word he hears */
  var pic = null;         /* second half: the picture */
  var found = [];         /* second half: words found for it */
  var attempts = 0;
  var mode = 'start';     /* start | round1 | round2 | finished | board */
  var flowToken = 0;      /* cancels a talking sequence */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    wordBtn: $('wordBtn'), pics: $('pics'),
    bigBox: $('bigBox'), bigPic: $('bigPic'), found: $('found'), cards: $('cards'),
    btnRow: $('btnRow'), sayBtn: $('sayBtn'), hearBtn: $('hearBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), startPics: $('startPics'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261023-week-3-english-homework-1/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Pictures (drawn here, no image files) ================= */
  function emoji(x, y, size, ch, extra) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" text-anchor="middle" ' +
           'dominant-baseline="central"' + (extra || '') + '>' + ch + '</text>';
  }
  function artHTML(id) {
    var s = '<svg class="art" viewBox="0 0 100 100" aria-hidden="true">';
    if (id === 'teddy') {
      s += '<rect width="100" height="100" fill="#fef3c7"/>' + emoji(50, 54, 66, '🧸');
    } else if (id === 'flower') {
      s += '<rect width="100" height="100" fill="#fce7f3"/>' +
           '<rect x="47" y="58" width="6" height="40" fill="#16a34a"/>' + emoji(50, 46, 64, '🌸');
    } else if (id === 'apple') {
      s += '<rect width="100" height="100" fill="#ecfccb"/>' + emoji(50, 54, 64, '🍎') +
           emoji(76, 22, 22, '✨');
    } else {
      /* the attic: a dark roof space, a little moonlit window, dusty old toys */
      s += '<rect width="100" height="100" fill="#0b0716"/>' +
           '<polygon points="0,100 50,10 100,100" fill="#231a33" stroke="#4a3626" stroke-width="4"/>' +
           '<line x1="18" y1="68" x2="82" y2="68" stroke="#3b2a1e" stroke-width="3"/>' +
           '<circle cx="50" cy="44" r="10" fill="#1e293b" stroke="#57534e" stroke-width="3"/>' +
           emoji(50, 44, 11, '🌙') +
           emoji(33, 54, 12, '🕸️', ' opacity=".55"') +
           '<g opacity=".55">' + emoji(30, 84, 20, '🚂') + emoji(52, 85, 18, '🥁') +
           emoji(72, 84, 20, '📦') + '</g>';
    }
    return s + '</svg>';
  }
  function picById(id) {
    for (var i = 0; i < PICTURES.length; i++) if (PICTURES[i].id === id) return PICTURES[i];
    return null;
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function flash(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  /* ================= Screens ================= */
  var ALL = ['lead', 'wordBtn', 'pics', 'bigBox', 'cards', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'hearBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  function halfLabel(n, of) {
    return (half === 1 ? 'First half · ' : 'Second half · ') + n + '/' + of;
  }

  /* ================= First half: hear the word, tap the picture ================= */
  function buildPics() {
    els.pics.innerHTML = '';
    shuffle(PICTURES).forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'pic';
      b.type = 'button';
      b.dataset.id = p.id;
      b.innerHTML = artHTML(p.id);
      b.addEventListener('click', function () { tapPic(p, b); });
      els.pics.appendChild(b);
    });
  }

  function enterRound1() {
    stopAll();
    mode = 'round1';
    word = queue1[round];
    attempts = 0;
    els.half.textContent = halfLabel(round + 1, ROUNDS1);
    els.wordBtn.textContent = word;
    els.lead.textContent = 'Which picture is it? 👀';
    buildPics();
    show(['lead', 'wordBtn', 'pics', 'btnRow'], ['sayBtn']);
    var intro = round === 0 ? introSay(1) : '';
    setTimeout(function () { if (mode === 'round1') speak(intro + askPic(word)); }, 300);
  }

  function tapPic(p, el) {
    if (mode === 'finished') { stopAll(); speak(descSay(p)); return; }
    if (mode !== 'round1') return;
    stopAll();
    if (fits(p, word)) {
      var all = els.pics.querySelectorAll('.pic');
      for (var i = 0; i < all.length; i++) all[i].classList.remove('hint', 'wrong');
      el.classList.add('right');
      score(goalPic(p, word), 'GOAL! ⚽ The ' + p.name + ' is ' + word + '.', ROUNDS1);
      return;
    }
    attempts++;
    flash(el, 'wrong');
    if (attempts >= 2) {
      var pics = els.pics.querySelectorAll('.pic');
      for (var k = 0; k < pics.length; k++) {
        if (fits(picById(pics[k].dataset.id), word)) pics[k].classList.add('hint');
      }
      speak(herePic(word));
    } else {
      speak(notPic(p, word));
    }
  }

  /* ================= Second half: one picture, find its words ================= */
  function buildCards() {
    els.cards.innerHTML = '';
    shuffle(ADJECTIVES).forEach(function (w) {
      var b = document.createElement('button');
      b.className = 'card';
      b.type = 'button';
      b.dataset.w = w;
      b.textContent = w;
      b.addEventListener('click', function () { tapCard(w, b); });
      els.cards.appendChild(b);
    });
  }

  function renderFound() {
    var html = '';
    for (var i = 0; i < pic.words.length; i++) {
      html += found[i] ? '<span class="slot full">' + found[i] + '</span>' : '<span class="slot">?</span>';
    }
    els.found.innerHTML = html;
  }

  function clearHints() {
    var cs = els.cards.querySelectorAll('.card');
    for (var i = 0; i < cs.length; i++) cs[i].classList.remove('hint', 'saying');
  }

  function enterRound2() {
    stopAll();
    mode = 'round2';
    pic = queue2[round];
    found = [];
    attempts = 0;
    els.half.textContent = halfLabel(round + 1, ROUNDS2);
    els.bigPic.innerHTML = artHTML(pic.id);
    els.lead.textContent = 'Tap a word to hear it. Find the words for this picture.';
    renderFound();
    buildCards();
    show(['lead', 'bigBox', 'cards', 'btnRow'], ['sayBtn', 'hearBtn']);
    var intro = round === 0 ? introSay(2) : '';
    setTimeout(function () { if (mode === 'round2' && !found.length) speak(intro + askWords(pic)); }, 300);
  }

  function askAgain2() {
    return found.length ? moreSay(pic.words.length - found.length) : askWords(pic);
  }

  function tapCard(w, el) {
    if (mode === 'finished' || el.classList.contains('got')) { stopAll(); speak(wordSay(w)); return; }
    if (mode !== 'round2') return;
    stopAll();
    clearHints();
    if (fits(pic, w)) {
      attempts = 0;
      found.push(w);
      el.classList.add('got');
      renderFound();
      var left = pic.words.length - found.length;
      if (left > 0) { speak(yesWord(pic, w, left)); return; }
      score(goalWords(pic, w), 'GOAL! ⚽ The ' + pic.name + ' is ' + listWords(pic.words) + '.', ROUNDS2);
      return;
    }
    attempts++;
    flash(el, 'wrong');
    if (attempts >= 2) {
      var cs = els.cards.querySelectorAll('.card');
      var hint = null;
      for (var i = 0; i < cs.length; i++) {
        var cw = cs[i].dataset.w;
        if (fits(pic, cw) && found.indexOf(cw) < 0) { hint = cs[i]; break; }
      }
      speak(noWord(pic, w), function () {
        if (mode !== 'round2' || !hint) return;
        hint.classList.add('hint');
        speak(hintWord(hint.dataset.w));
      });
    } else {
      speak(noWord(pic, w));
    }
  }

  /* reads every card out, lighting each one */
  function hearAll() {
    stopAll();
    var cs = els.cards.querySelectorAll('.card');
    var list = [{ say: hearSay() }];
    for (var i = 0; i < cs.length; i++) {
      list.push({
        act: (function (c) { return function () { clearHints(); c.classList.add('saying'); }; })(cs[i]),
        say: wordSay(cs[i].dataset.w)
      });
    }
    list.push({ act: clearHints, say: askAgain2() });
    sequence(list);
  }

  /* ================= A goal ================= */
  function score(line, lead, roundsThisHalf) {
    mode = 'finished';
    goals++;
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    els.lead.textContent = lead;
    var last = round === roundsThisHalf - 1;
    els.nextBtn.textContent = last ? (half === 1 ? 'Half time ➜' : 'Full time ➜') : 'Next ➜';
    show(half === 1 ? ['lead', 'wordBtn', 'pics', 'btnRow'] : ['lead', 'bigBox', 'cards', 'btnRow'], ['nextBtn']);
    speak(line);
  }

  function nextRound() {
    stopAll();
    round++;
    if (half === 1) {
      if (round >= ROUNDS1) enterHalfTime(); else enterRound1();
    } else {
      if (round >= ROUNDS2) enterFullTime(); else enterRound2();
    }
  }

  /* ================= Board: the homework, matched ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    PICTURES.forEach(function (p, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = '<span class="mini">' + artHTML(p.id) + '</span>' + p.words.join(' · ');
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(descSay(PICTURES[i]), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    PICTURES.forEach(function (p, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: descSay(p)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = goals + ' ⚽ · Next: find the words for each picture.';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(goals));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = goals + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(goals));
  }

  /* ================= Match ================= */
  function startMatch() {
    stopAll();
    queue1 = shuffle(ADJECTIVES);
    queue2 = shuffle(PICTURES);
    goals = 0;
    half = 1;
    round = 0;
    enterRound1();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.wordBtn.addEventListener('click', function () {
    if (mode === 'round1' || mode === 'finished') { stopAll(); speak(askPic(word)); }
  });
  els.bigPic.addEventListener('click', function () {
    if (mode === 'round2') { stopAll(); speak(askAgain2()); }
    else if (mode === 'finished' && pic) { stopAll(); speak(descSay(pic)); }
  });
  els.sayBtn.addEventListener('click', function () {
    if (mode === 'round1') { stopAll(); speak(askPic(word)); }
    else if (mode === 'round2') { stopAll(); speak(askAgain2()); }
  });
  els.hearBtn.addEventListener('click', function () {
    if (mode === 'round2') hearAll();
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterRound2();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  els.startPics.innerHTML = PICTURES.map(function (p) {
    return '<span class="mini">' + artHTML(p.id) + '</span>';
  }).join('');
  renderScore(false);
})();
</script>
</body>
</html>
