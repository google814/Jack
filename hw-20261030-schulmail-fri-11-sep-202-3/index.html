<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>Dots and Teddy's Feelings ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Dots and Teddy">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 52%, #2e1065 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }

  /* ---------- The task badge: 6 and one more / one less ---------- */
  #task { display: flex; align-items: center; gap: 12px; }
  #taskNum {
    min-width: 1.7em;
    padding: 2px 10px;
    border-radius: 16px;
    background: #fff;
    color: #5b21b6;
    font-size: clamp(1.7rem, 6.4vmin, 3rem);
    font-weight: 900;
  }
  #taskOp {
    padding: 8px 18px;
    border-radius: 999px;
    font-size: clamp(1.1rem, 4vmin, 1.9rem);
    font-weight: 900;
  }
  #taskOp.more { background: #16a34a; }
  #taskOp.less { background: #ea580c; }

  /* ---------- Tens frames ---------- */
  #frames {
    --c: min(17vw, 10.5vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 14px);
  }
  #frames.one { --c: min(17vw, 15vh); }
  @media (orientation: landscape) {
    #frames { flex-direction: row; --c: min(8.4vw, 15vh); }
    #frames.one { --c: min(14vw, 19vh); }
  }
  .frame {
    display: grid;
    grid-template-columns: repeat(5, var(--c));
    grid-auto-rows: var(--c);
    background: #1e1b4b;
    gap: 3px;
    padding: 3px;
    border-radius: 12px;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .frame.full { outline: 4px solid #fde047; }
  .cell {
    background: #fff;
    border-radius: 6px;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .dot {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #ef4444;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
    color: #fff;
    font-weight: 800;
    font-size: calc(var(--c) * .42);
    line-height: 1;
    cursor: grab;
    touch-action: none;
  }
  .dot.lit { outline: 4px solid #facc15; outline-offset: 1px; animation: bounceIn .4s ease; }
  .dot.pop { animation: bounceIn .35s ease; }
  #ghost {
    position: fixed;
    z-index: 70;
    width: var(--g);
    height: var(--g);
    margin: calc(var(--g) / -2) 0 0 calc(var(--g) / -2);
    pointer-events: none;
    opacity: .92;
    transform: scale(1.12);
  }

  /* ---------- The tray the spare dots wait in ---------- */
  #tray {
    --c: clamp(44px, 9vmin, 66px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: min(80vw, 330px);
    min-height: calc(var(--c) + 16px);
    padding: 8px 14px;
    border-radius: 18px;
    border: 3px dashed rgba(255,255,255,.55);
    background: rgba(0,0,0,.2);
    flex-wrap: wrap;
  }
  #tray .dot { width: var(--c); height: var(--c); }

  /* ---------- Teddy ---------- */
  #teddyBox { display: flex; align-items: center; justify-content: center; gap: 14px; }
  #teddy { width: clamp(120px, 30vmin, 230px); height: clamp(120px, 30vmin, 230px); }
  #teddy.small { width: clamp(84px, 18vmin, 140px); height: clamp(84px, 18vmin, 140px); }
  #teddy.pop { animation: bounceIn .5s ease; }
  #scene { font-size: clamp(2.2rem, 10vmin, 4.6rem); line-height: 1; }

  /* ---------- Word cards ---------- */
  #opts {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(6px, 1.6vmin, 14px);
    width: min(96vw, 640px);
  }
  #opts.many { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(96vw, 780px); }
  .opt {
    position: relative;
    min-width: 0;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,.28);
    color: #1e1b4b;
  }
  .opt.saying { outline: 5px solid #fde047; outline-offset: 2px; }
  .opt.hint { outline: 5px solid #4ade80; outline-offset: 2px; animation: pulse 1.1s ease infinite; }
  .opt.wrong { background: #fecaca; animation: shake .4s ease; }
  .opt-go {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 100%;
    min-height: clamp(84px, 17vmin, 132px);
    padding: 8px 2px;
    background: none;
    border: none;
    border-radius: 18px;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }
  .opt-go .pic { font-size: clamp(2rem, 8vmin, 3.4rem); line-height: 1.1; }
  .opt-go .word { font-size: clamp(.86rem, 3.2vmin, 1.4rem); font-weight: 800; overflow-wrap: anywhere; }
  #opts.plainwords .opt-go .word { font-size: clamp(.98rem, 3.8vmin, 1.7rem); }
  .opt-say {
    position: absolute;
    top: -6px;
    right: -4px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: #7c3aed;
    color: #fff;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.3);
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.tick { background: linear-gradient(145deg, #22c55e, #15803d); font-size: clamp(1.2rem, 3.6vmin, 1.8rem); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e1b4b;
    cursor: pointer;
  }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #2e1065 0%, #6d28d9 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Dots and Teddy's feelings</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="task" class="hidden">
    <span id="taskNum"></span>
    <span id="taskOp"></span>
  </div>
  <div id="frames" class="hidden"></div>
  <div id="tray" class="hidden"></div>

  <div id="teddyBox" class="hidden">
    <svg id="teddy" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <span id="scene" class="hidden"></span>
  </div>
  <div id="opts" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count with me</button>
    <button class="btn tick" id="tickBtn">✓</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Dots and Teddy's feelings 🧸</h2>
  <p>Move the dots to show one more or one less.<br>Then find interesting adjectives for you and your teddy bear.</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     School mail, Fri 11 Sep 2026.
     Maths: "move the dots onto the tens frames to show one more or one less...
     count carefully and check that they have the correct number of dots".
     English: "using adjectives... their own emotions and their teddy bear's
     emotions... interesting adjectives to describe how they are feeling and
     how they think their teddy bear might be feeling".

     First half: six frames. He drags (or taps) dots on and off the tens
     frames, then checks with the green tick. The last two use two frames, past
     ten. Second half: six rounds with Teddy. How do YOU feel (any answer is
     right, then he shows that face), what does Teddy's face say, and how might
     Teddy feel in a little story; each Teddy answer is then swapped for a more
     interesting adjective. One football ⚽ for every round. */

  var ONE_FRAME_ROUNDS = 4;   /* the rest of the first half uses two frames */
  var TRAY_SIZE = 3;

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🔴', '🧸'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261030-schulmail-fri-11-sep-202-3.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  var ROUNDS_PER_HALF = 6;

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven',
               'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen',
               'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];

  /* group: feelings that look alike are never offered side by side */
  var FEELINGS = [
    { plain: 'happy',     fancy: 'delighted',  pic: '😄', group: 'a', scene: '🧸⚽',
      story: 'Teddy is playing football with a friend.' },
    { plain: 'excited',   fancy: 'thrilled',   pic: '🤩', group: 'a', scene: '🎂🎈',
      story: 'Today is Teddy\'s birthday party!' },
    { plain: 'surprised', fancy: 'amazed',     pic: '😲', group: 'b', scene: '🐘🚪',
      story: 'An elephant is at the door!' },
    { plain: 'scared',    fancy: 'terrified',  pic: '😨', group: 'b', scene: '🌑💥',
      story: 'There is a loud bang in the dark.' },
    { plain: 'worried',   fancy: 'anxious',    pic: '😟', group: 'b', scene: '🏫🎒',
      story: 'Today is Teddy\'s first day at a new school.' },
    { plain: 'sad',       fancy: 'miserable',  pic: '😢', group: 'c', scene: '⚽❓',
      story: 'Teddy\'s favourite ball is lost.' },
    { plain: 'angry',     fancy: 'furious',    pic: '😠', group: 'd', scene: '🧩💥',
      story: 'Somebody broke Teddy\'s toy.' },
    { plain: 'tired',     fancy: 'exhausted',  pic: '😴', group: 'e', scene: '🌙⭐',
      story: 'It is very late at night.' }
  ];

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
  function dots(n) { return WORDS[n] + (n === 1 ? ' dot' : ' dots'); }
  function opName(op) { return op === 'more' ? 'one more' : 'one less'; }
  function resultOf(op, n) { return op === 'more' ? n + 1 : n - 1; }

  /* ---------- first half ---------- */
  function mathsIntro() {
    return 'Move the dots onto the tens frames to show one more or one less. ' +
           'Count carefully. Then tap the green tick to check.';
  }
  function mathsAsk(op, n) { return 'Look, ' + dots(n) + '. Move the dots to show ' + opName(op) + '.'; }
  function countSay(n) { return dots(n) + '.'; }
  function mathsNot(have) { return 'Not yet. You have ' + dots(have) + '. Count carefully and try again.'; }
  function mathsTogether() { return 'Let us count together.'; }
  function mathsSum(op, n) { return cap(opName(op)) + ' than ' + WORDS[n] + ' is ' + WORDS[resultOf(op, n)] + '.'; }
  function mathsShow(op, n) { return mathsSum(op, n) + ' Move the dots.'; }
  function mathsGoal(op, n) { return 'Goal! ' + mathsSum(op, n); }

  /* ---------- second half ---------- */
  function feelIntro() { return 'Now use interesting adjectives to say how you feel and how your teddy bear feels.'; }
  function youAsk(fancy) {
    return fancy ? 'How do you feel now? Pick an interesting adjective.'
                 : 'How do you feel today? Tap a word.';
  }
  function youPick(w) {
    return 'You feel ' + w + '. Show me your ' + w + ' face! Teddy is showing it too. Then tap the green tick.';
  }
  function youGoal(w) { return 'Goal! ' + cap(w) + ' is a great adjective.'; }
  function faceAsk() { return 'Look at Teddy\'s face. How is Teddy feeling?'; }
  function storyAsk(f) { return f.story + ' How might Teddy be feeling?'; }
  function notPlain(w) { return 'Not ' + w + '. Try again.'; }
  function hintWord(w) { return 'Look, ' + w + '. Tap ' + w + '.'; }
  function yesPlain(f) {
    return 'Yes, ' + f.plain + '! Can you find a more interesting adjective for ' + f.plain + '?';
  }
  function means(f) { return cap(f.fancy) + ' means very ' + f.plain + '.'; }
  function notFancy(f) { return means(f) + ' Try again.'; }
  function hintFancy(f) { return means(f) + ' Tap ' + f.fancy + '.'; }
  function teddyGoal(f) { return 'Goal! ' + means(f) + ' Teddy is ' + f.fancy + '.'; }

  function halfTimeSay(n) {
    return 'Half time! You scored ' + WORDS[n] + ' goals. Next, think about feelings.';
  }
  function fullTimeSay(n) {
    return 'Full time! You scored ' + WORDS[n] + ' goals. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, n;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }

    addAll(mathsIntro());
    addAll(mathsTogether());
    for (n = 1; n <= 20; n++) add(WORDS[n]);
    for (n = 0; n <= 20; n++) { addAll(countSay(n)); addAll(mathsNot(n)); }
    for (n = 1; n <= 19; n++) {
      addAll(mathsAsk('more', n));
      addAll(mathsShow('more', n));
      addAll(mathsGoal('more', n));
    }
    for (n = 2; n <= 20; n++) {
      addAll(mathsAsk('less', n));
      addAll(mathsShow('less', n));
      addAll(mathsGoal('less', n));
    }

    addAll(feelIntro());
    addAll(youAsk(false));
    addAll(youAsk(true));
    addAll(faceAsk());
    for (i = 0; i < FEELINGS.length; i++) {
      var f = FEELINGS[i];
      add(f.plain);
      add(f.fancy);
      addAll(youPick(f.plain));
      addAll(youPick(f.fancy));
      addAll(youGoal(f.plain));
      addAll(youGoal(f.fancy));
      addAll(storyAsk(f));
      addAll(notPlain(f.plain));
      addAll(hintWord(f.plain));
      addAll(yesPlain(f));
      addAll(notFancy(f));
      addAll(hintFancy(f));
      addAll(teddyGoal(f));
    }
    addAll(halfTimeSay(ROUNDS_PER_HALF));
    addAll(fullTimeSay(ROUNDS_PER_HALF * 2));
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261030schulmailfri11sep2023';
  var SLOW_KEY  = 'jackHw_hw20261030schulmailfri11sep2023_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var queue1 = [], queue2 = [];
  var goals = 0;          /* goals this match */
  var words = [];         /* adjectives he found this match, for the board */
  var task = null;        /* maths: { op, n }  teddy: { kind, f, fancy } */
  var have = 0;           /* dots on the frames */
  var spare = 0;          /* dots in the tray */
  var capacity = 10;
  var step = '';          /* teddy: pick | plain | fancy | show | done */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | maths | teddy | finished | board */

    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });

      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];

  function speakParts(parts, done, rate) {

  }

  /* ================= Second half: adjectives ================= */
  function enterTeddy() {
    stopAll();
    mode = 'teddy';
    busy = false;
    task = queue2[round];
    attempts = 0;
    els.half.textContent = 'Second half · ' + (round + 1) + '/' + ROUNDS_PER_HALF;
    els.scene.classList.add('hidden');
    els.teddy.classList.remove('small');
    if (task.kind === 'you') {
      drawTeddy('neutral');
      els.teddy.classList.add('small');
      enterStep('pick');
    } else {
      drawTeddy(task.kind === 'face' ? task.f.plain : 'neutral');
      if (task.kind === 'story') {
        els.scene.textContent = task.f.scene;
        els.scene.classList.remove('hidden');
      }
      enterStep('plain');
    }
  }

  /* the word cards for this step, read out one by one */
  function optionsFor(s) {
    if (s === 'pick') return shuffle(FEELINGS);
    var f = task.f;
    var groups = {};
    groups[f.group] = 1;
    var others = shuffle(FEELINGS).filter(function (o) {
      if (groups[o.group]) return false;
      groups[o.group] = 1;
      return true;
    }).slice(0, 2);
    return shuffle([f].concat(others));
  }

  function wordOf(o, s) {
    if (s === 'pick') return task.fancy ? o.fancy : o.plain;
    return s === 'fancy' ? o.fancy : o.plain;
  }

  function askLine(s) {
    if (s === 'pick') return youAsk(task.fancy);
    if (s === 'plain') return task.kind === 'face' ? faceAsk() : storyAsk(task.f);
    return yesPlain(task.f);
  }

  function enterStep(s) {
    step = s;
    attempts = 0;
    currentOpts = optionsFor(s);
    els.lead.textContent = s === 'pick' ? 'How do you feel? 🤔'
      : s === 'fancy' ? '✨ A more interesting adjective'
      : task.kind === 'face' ? 'How is Teddy feeling? 🧸' : 'How might Teddy be feeling? 🧸';
    renderOpts(s);
    show(['lead', 'teddyBox', 'opts', 'btnRow'], ['sayBtn']);
    readStep();
  }

  function renderOpts(s) {
    els.opts.innerHTML = '';
    els.opts.classList.toggle('many', s === 'pick');
    /* the interesting words have no picture: he has to listen to them */
    els.opts.classList.toggle('plainwords', s === 'fancy');
    currentOpts.forEach(function (o, i) {
      var w = wordOf(o, s);
      var box = document.createElement('div');
      box.className = 'opt';
      var go = document.createElement('button');
      go.className = 'opt-go';
      go.type = 'button';
      go.innerHTML = (s === 'fancy' ? '' : '<span class="pic">' + o.pic + '</span>') +
                     '<span class="word">' + w + '</span>';
      go.addEventListener('click', function () { choose(i, box); });
      var sayIt = document.createElement('button');
      sayIt.className = 'opt-say';
      sayIt.type = 'button';
      sayIt.textContent = '🔊';
      sayIt.setAttribute('aria-label', w);
      sayIt.addEventListener('click', function () { stopAll(); markSaying(-1); speak(w); });
      box.appendChild(go);
      box.appendChild(sayIt);
      els.opts.appendChild(box);
    });
  }

  function markSaying(i) {
    var boxes = els.opts.querySelectorAll('.opt');
    for (var b = 0; b < boxes.length; b++) boxes[b].classList.toggle('saying', b === i);
  }

  function readStep(firstLine) {
    stopAll();
    var list = [{ wait: 300 }];
    if (firstLine) list.push({ say: firstLine });
    list.push({ say: askLine(step) });
    currentOpts.forEach(function (o, i) {
      list.push({ act: function () { markSaying(i); }, say: wordOf(o, step) });
    });
    list.push({ act: function () { markSaying(-1); } });
    sequence(list);
  }

  function choose(i, box) {
    if (mode !== 'teddy') return;
    stopAll();
    markSaying(-1);
    var o = currentOpts[i];
    if (step === 'pick') {
      enterShow(o);
      return;
    }
    if (o === task.f) {
      if (step === 'plain') {
        els.scene.classList.add('hidden');
        drawTeddy(task.f.plain, true);
        enterStep('fancy');
      } else {
        finishTeddy();
      }
      return;
    }
    attempts++;
    box.classList.remove('wrong');
    void box.offsetWidth;
    box.classList.add('wrong');
    if (attempts < 2) {
      speak(step === 'fancy' ? notFancy(o) : notPlain(o.plain));
      return;
    }
    els.opts.querySelectorAll('.opt')[currentOpts.indexOf(task.f)].classList.add('hint');
    speak(step === 'fancy' ? hintFancy(task.f) : hintWord(task.f.plain));
  }

  /* any feeling is right: he shows that face, and Teddy pulls it too */
  function enterShow(o) {
    var w = task.fancy ? o.fancy : o.plain;
    task.f = o;
    step = 'show';
    words.push({ word: w, pic: o.pic });
    drawTeddy(o.plain, true);
    els.teddy.classList.remove('small');
    els.lead.textContent = o.pic + ' ' + w;
    show(['lead', 'teddyBox', 'btnRow'], ['sayBtn', 'tickBtn']);
    lastLine = youPick(w);
    speak(lastLine);
  }

  function finishYou() {
    if (mode !== 'teddy' || step !== 'show') return;
    stopAll();
    var w = task.fancy ? task.f.fancy : task.f.plain;
    finished(youGoal(w), 'GOAL! ⚽ ' + task.f.pic + ' ' + w);
  }

  function finishTeddy() {
    var f = task.f;
    words.push({ word: f.fancy, pic: f.pic });
    finished(teddyGoal(f), 'GOAL! ⚽ ' + f.pic + ' ' + f.fancy);
  }

  function finished(line, leadText) {
    mode = 'finished';
    step = 'done';
    scoreGoal();
    els.lead.textContent = leadText;
    els.nextBtn.textContent = nextLabel();
    show(['lead', 'teddyBox', 'btnRow'], ['sayBtn', 'nextBtn']);
    lastLine = line;
    speak(line);
  }

  function nextRound() {
    stopAll();
    round++;
    if (round >= ROUNDS_PER_HALF) {
      if (half === 1) enterHalfTime(); else enterFullTime();
      return;
    }
    if (half === 1) enterMaths(); else enterTeddy();
  }

  /* ================= Board ================= */
  function renderBoard(list) {
    els.board.innerHTML = '';
    list.forEach(function (w) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = w.pic + ' ' + w.word;
      b.addEventListener('click', function () { stopAll(); speak(w.word); });
      els.board.appendChild(b);
    });
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = goals + ' ⚽ · Next: Teddy 🧸';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard([]);
    show(['boardBox']);
    speak(halfTimeSay(goals));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = goals + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard(words);
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(goals));
  }

  /* ================= Match ================= */
  function mathsPool(lowMore, highMore, lowLess, highLess) {
    var out = [], n;
    for (n = lowMore; n <= highMore; n++) out.push({ op: 'more', n: n });
    for (n = lowLess; n <= highLess; n++) out.push({ op: 'less', n: n });
    return shuffle(out);
  }

  /* more and less take turns, and no number comes twice in a match */
  function buildMaths() {
    var opFirst = Math.random() < 0.5 ? 'more' : 'less';
    var used = {}, out = [];
    function take(pool, op) {
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].op === op && !used[pool[i].n]) {
          used[pool[i].n] = 1;
          return pool[i];
        }
      }
      return pool[0];
    }
    var small = mathsPool(1, 9, 2, 10), big = mathsPool(10, 19, 11, 20);
    for (var r = 0; r < ROUNDS_PER_HALF; r++) {
      var op = r % 2 === 0 ? opFirst : (opFirst === 'more' ? 'less' : 'more');
      out.push(take(r < ONE_FRAME_ROUNDS ? small : big, op));
    }
    return out;
  }

  /* you, two faces, two stories, you again with the interesting words */
  function buildTeddy() {
    var f = shuffle(FEELINGS);
    return [
      { kind: 'you', f: null, fancy: false },
      { kind: 'face', f: f[0] },
      { kind: 'face', f: f[1] },
      { kind: 'story', f: f[2] },
      { kind: 'story', f: f[3] },
      { kind: 'you', f: null, fancy: true }
    ];
  }

  function startMatch() {
    stopAll();
    queue1 = buildMaths();
    queue2 = buildTeddy();
    goals = 0;
    words = [];
    half = 1;
    round = 0;
    enterMaths();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  document.addEventListener('pointerdown', dragDown);
  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragUp);
  document.addEventListener('pointercancel', dragUp);
  els.frames.addEventListener('click', tapFrames);

  els.countBtn.addEventListener('click', function () {
    if (mode === 'maths' && !busy) { stopAll(); countDots(); }
  });
  els.sayBtn.addEventListener('click', function () {
    if (busy) return;
    if (mode === 'teddy' && step !== 'show') readStep();
    else if (lastLine) sayLine(lastLine);
  });
  els.tickBtn.addEventListener('click', function () {
    if (mode === 'maths') checkDots();
    else finishYou();
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) { enterTeddy(); readStep(feelIntro()); }
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
