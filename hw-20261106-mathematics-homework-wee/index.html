<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>3D Shape Hunt ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Shape Hunt">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #134e4a 0%, #0f766e 52%, #134e4a 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.15rem, 3.4vmin, 1.8rem); font-weight: 800; }
  .lead .w { color: #fde047; }

  /* ---------- Shape cards (SVG drawings) ---------- */
  .shape svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .shape svg .f1 { fill: #fef3c7; }
  .shape svg .f2 { fill: #fbbf24; }
  .shape svg .f3 { fill: #d97706; }
  .shape svg path, .shape svg rect, .shape svg circle, .shape svg ellipse, .shape svg polygon, .shape svg polyline, .shape svg line {
    stroke: #78350f; stroke-width: 2.2; stroke-linejoin: round;
  }
  .shape svg .hl { fill: #fff; opacity: .7; stroke: none; }
  .shape svg .dash { fill: none; stroke-dasharray: 4 4; opacity: .55; }

  #cards {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 18px);
    justify-content: center;
    max-width: 760px;
  }
  .card {
    --s: clamp(96px, 24vmin, 180px);
    width: var(--s);
    height: calc(var(--s) * 1.18);
    padding: calc(var(--s) * .1) calc(var(--s) * .1) calc(var(--s) * .04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    background: #fff;
    color: #1e293b;
    border: none;
    border-bottom: 7px solid rgba(0,0,0,.28);
    border-radius: 22px;
    cursor: pointer;
  }
  .card .shape { width: 100%; flex: 1; min-height: 0; }
  .card .name { font-size: calc(var(--s) * .13); font-weight: 900; margin-top: 4px; min-height: 1.2em; }
  #cards.quiz .card .name { visibility: hidden; }
  .card:active { transform: translateY(4px); border-bottom-width: 3px; }
  .card.saying { outline: 6px solid #fde047; outline-offset: 3px; animation: pop .5s ease; }
  .card.wrong { background: #fecaca; animation: shake .4s ease; }
  .card.right { background: #bbf7d0; animation: pop .5s ease; }
  #cards.quiz .card.right .name { visibility: visible; }
  .card.glow, .obj.glow { animation: pulse 1s ease infinite; outline: 6px solid #fde047; outline-offset: 3px; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- The house (shape hunt) ---------- */
  #huntBox { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.8vh, 16px); width: 100%; }
  #hint {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: inherit;
    font-size: clamp(1rem, 3vmin, 1.4rem);
    font-weight: 900;
    color: #1e293b;
    background: #fff;
    border: 4px solid #fde047;
    border-radius: 20px;
    padding: 8px 18px 8px 10px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  #hint .shape { width: clamp(64px, 14vmin, 104px); height: clamp(64px, 14vmin, 104px); }
  #room {
    position: relative;
    width: min(96vw, 760px);
    border-radius: 24px;
    overflow: hidden;
    background:
      linear-gradient(180deg, #fde8d0 0%, #fbd5b0 66%, #a16207 66%, #92400e 100%);
    box-shadow: 0 10px 0 rgba(0,0,0,.25);
    padding: clamp(16px, 4vmin, 34px) clamp(8px, 2vmin, 20px) clamp(14px, 3vmin, 26px);
  }
  #room::before {      /* a window on the wall */
    content: "";
    position: absolute;
    left: 8%; top: 10%;
    width: 16%; height: 26%;
    background: linear-gradient(180deg, #bae6fd, #7dd3fc);
    border: 5px solid #fff;
    border-radius: 6px;
    opacity: .85;
  }
  #room::after {       /* a picture frame */
    content: "";
    position: absolute;
    right: 9%; top: 12%;
    width: 12%; height: 18%;
    background: #fca5a5;
    border: 5px solid #92400e;
    border-radius: 4px;
    opacity: .7;
  }
  #objects {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 18px);
    justify-content: center;
    align-items: flex-end;
    min-height: clamp(140px, 30vmin, 230px);
    padding-top: clamp(30px, 8vmin, 70px);
  }
  .obj {
    --o: clamp(74px, 18vmin, 140px);
    width: var(--o);
    height: var(--o);
    font-size: calc(var(--o) * .66);
    line-height: 1;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.55);
    border: none;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.2);
  }
  .obj:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .obj.wrong { background: #fecaca; animation: shake .4s ease; }
  .obj.right { background: #bbf7d0; animation: pop .5s ease; }

  /* ---------- Photos ---------- */
  #album { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 10px; }
  .photo {
    --p: clamp(62px, 13vmin, 96px);
    width: var(--p);
    font-family: inherit;
    background: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 6px 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
    cursor: pointer;
    transform: rotate(-3deg);
  }
  .photo:nth-child(even) { transform: rotate(3deg); }
  .photo .pic {
    height: calc(var(--p) * .78);
    display: grid;
    place-items: center;
    font-size: calc(var(--p) * .5);
    background: #fde8d0;
    border-radius: 3px;
  }
  .photo .shape { height: calc(var(--p) * .38); margin-top: 3px; }
  .photo.new { animation: drop .7s ease; }
  .photo.saying { outline: 4px solid #fde047; outline-offset: 3px; }
  @keyframes drop {
    0% { transform: translateY(-60vh) rotate(-30deg) scale(1.6); }
    100% { transform: translateY(0) rotate(-3deg) scale(1); }
  }
  #flash {
    position: fixed; inset: 0; background: #fff; z-index: 50;
    pointer-events: none; opacity: 0;
  }
  #flash.go { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #14b8a6, #0f766e);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.6vmin, 14px); justify-content: center; max-width: 760px; }
  #board .card { --s: clamp(80px, 17vmin, 130px); }
  #board .photo { --p: clamp(80px, 17vmin, 130px); }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #134e4a 0%, #0f766e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 30ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #startOverlay .emo { font-size: clamp(2.4rem, 9vmin, 4.4rem); letter-spacing: .1em; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>3D Shape Hunt</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="cards" class="hidden"></div>

  <div id="huntBox" class="hidden">
    <button id="hint" type="button"><span class="shape"></span><span id="hintText"></span></button>
    <div id="room"><div id="objects"></div></div>
    <div id="album"></div>
  </div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="flash"></div>

<div id="startOverlay">
  <h2>⚽ 3D Shape Hunt ⚽</h2>
  <div class="emo">🎲 📦 ⚽ 🥫 🍦</div>
  <p>Cube · Cuboid · Sphere · Cylinder · Cone · Pyramid<br>Go on a 3D shape hunt around the house and take pictures 📸</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Mathematics - Homework Week 9: 3D shapes.
     "In Mathematics this week we have been looking at 3D shapes.
      Task - Go on a 3D shape hunt around your house and take pictures of
      the shapes you find."

     A match starts by meeting the six 3D shapes (cube, cuboid, sphere,
     cylinder, cone, pyramid), each one shown and read out.
     First half: he hears "Find the cube!" and taps the right drawing.
     Second half is the shape hunt: a room in the house with four things in
     it, he hears "Find a cylinder in the house!", taps the tin and it gets
     its picture taken (camera flash, a photo drops into the album).
     A wrong tap names what he tapped ("The orange is a sphere.").
     One football ⚽ for every shape he finds. */

  var ROUNDS_PER_HALF = 6;
  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '📸', '🎲'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so the phrase list for the clips can be generated straight out of
     this block. */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
               'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

  var SHAPES = ['cube', 'cuboid', 'sphere', 'cylinder', 'cone', 'pyramid'];

  var FACTS = {
    cube: 'All its faces are squares.',
    cuboid: 'It is like a box.',
    sphere: 'It is round like a ball.',
    cylinder: 'It has two flat circles.',
    cone: 'It has a point at the top.',
    pyramid: 'Its triangles meet at a point.'
  };

  /* things around the house (no pyramid: there is no good one to draw) */
  var OBJECTS = [
    { id: 'dice',     e: '🎲', name: 'dice',            shape: 'cube' },
    { id: 'ice',      e: '🧊', name: 'ice cube',        shape: 'cube' },
    { id: 'present',  e: '🎁', name: 'present',         shape: 'cube' },
    { id: 'box',      e: '📦', name: 'box',             shape: 'cuboid' },
    { id: 'brick',    e: '🧱', name: 'brick',           shape: 'cuboid' },
    { id: 'juice',    e: '🧃', name: 'juice box',       shape: 'cuboid' },
    { id: 'football', e: '⚽', name: 'football',        shape: 'sphere' },
    { id: 'orange',   e: '🍊', name: 'orange',          shape: 'sphere' },
    { id: 'basket',   e: '🏀', name: 'basketball',      shape: 'sphere' },
    { id: 'tin',      e: '🥫', name: 'tin',             shape: 'cylinder' },
    { id: 'loo',      e: '🧻', name: 'toilet roll',     shape: 'cylinder' },
    { id: 'drum',     e: '🥁', name: 'drum',            shape: 'cylinder' },
    { id: 'icecream', e: '🍦', name: 'ice cream cone',  shape: 'cone' },
    { id: 'popper',   e: '🎉', name: 'party popper',    shape: 'cone' }
  ];
  var HUNT_SHAPES = ['cube', 'cuboid', 'sphere', 'cylinder', 'cone'];

  var INTRO_SAY = 'In Mathematics this week we have been looking at 3D shapes. Meet the 3D shapes!';
  var YOUR_TURN_SAY = 'Now it is your turn! Listen and tap the right shape.';
  var HUNT_TASK_SAY = 'Go on a 3D shape hunt around your house and take pictures of the shapes you find.';

  function meetSay(s) { return 'This is a ' + s + '. ' + FACTS[s]; }
  function findSay(s) { return 'Find the ' + s + '!'; }
  function isSay(s) { return 'That is a ' + s + '.'; }
  function firstAskSay(s) { return 'Listen and tap the right shape. ' + findSay(s); }
  function wrongShapeSay(w, t) { return isSay(w) + ' ' + findSay(t); }
  function showShapeSay(t) { return 'Look! This is the ' + t + '. Tap it.'; }
  function yesShapeSay(s) { return 'Yes! ' + isSay(s); }

  function huntSay(s) { return 'Find a ' + s + ' in the house!'; }
  function huntFirstSay(s) { return HUNT_TASK_SAY + ' ' + huntSay(s); }
  function objSay(o) { return 'The ' + o.name + ' is a ' + o.shape + '.'; }
  function wrongObjSay(o, t) { return 'Not that one. ' + objSay(o) + ' ' + huntSay(t); }
  function showObjSay(o) { return 'Look! ' + objSay(o) + ' Tap it to take a picture.'; }
  function snapSay(o) { return 'Snap! ' + objSay(o); }

  function halfTimeSay(n) {
    return 'Half time! You found ' + WORDS[n] + ' 3D shapes. ' +
           'In the second half, go on a 3D shape hunt around the house!';
  }
  function fullTimeSay(n) {
    return 'Full time! You took ' + WORDS[n] + ' pictures of 3D shapes. Brilliant! ' +
           'Now go on a 3D shape hunt around your house and take pictures of the shapes you find.';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, j, n;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }
    addAll(INTRO_SAY);
    addAll(YOUR_TURN_SAY);
    addAll(HUNT_TASK_SAY);
    for (i = 0; i < SHAPES.length; i++) {
      var s = SHAPES[i];
      addAll(meetSay(s));
      addAll(findSay(s));
      addAll(firstAskSay(s));
      addAll(isSay(s));
      addAll(showShapeSay(s));
      addAll(yesShapeSay(s));
      for (j = 0; j < SHAPES.length; j++) {
        if (j !== i) addAll(wrongShapeSay(SHAPES[j], s));
      }
    }
    for (i = 0; i < HUNT_SHAPES.length; i++) {
      addAll(huntSay(HUNT_SHAPES[i]));
      addAll(huntFirstSay(HUNT_SHAPES[i]));
    }
    for (i = 0; i < OBJECTS.length; i++) {
      var o = OBJECTS[i];
      addAll(objSay(o));
      addAll(showObjSay(o));
      addAll(snapSay(o));
      for (j = 0; j < HUNT_SHAPES.length; j++) {
        if (HUNT_SHAPES[j] !== o.shape) addAll(wrongObjSay(o, HUNT_SHAPES[j]));
      }
    }
    for (n = 0; n <= 12; n++) {
      addAll(halfTimeSay(n));
      addAll(fullTimeSay(n));
    }
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261106mathematicshomeworkwee';
  var SLOW_KEY  = 'jackHw_hw20261106mathematicshomeworkwee_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var half = 1;
  var round = 0;
  var serial = 0;           /* changes every round, so a late callback can tell */
  var queue1 = [], queue2 = [];
  var found = [];           /* shapes found in the first half */
  var photos = [];          /* objects photographed in the second half */
  var target = null;        /* shape name (half 1) or object (half 2) */
  var attempts = 0;
  var mode = 'start';       /* start | meet | round | finished | board */
  var flowToken = 0;        /* cancels a talking sequence */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    cards: $('cards'), huntBox: $('huntBox'), hint: $('hint'), hintText: $('hintText'),
    objects: $('objects'), album: $('album'),
    btnRow: $('btnRow'), sayBtn: $('sayBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    flash: $('flash'),

    queue1 = shuffle(SHAPES).slice(0, ROUNDS_PER_HALF);
    /* every hunt shape once, plus one more, never twice in a row */
    var shapes = shuffle(HUNT_SHAPES);
    var extra = pickOne(HUNT_SHAPES.filter(function (s) { return s !== shapes[shapes.length - 1]; }));
    shapes.push(extra);
    var used = {};
    queue2 = shapes.slice(0, ROUNDS_PER_HALF).map(function (s) {
      var pool = OBJECTS.filter(function (o) { return o.shape === s && !used[o.id]; });
      var o = pickOne(pool);
      used[o.id] = 1;
      return o;
    });
  }

  function startMatch() {
    stopAll();
    buildQueues();
    found = [];
    photos = [];
    els.album.innerHTML = '';
    half = 1;
    round = 0;
    enterMeet();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.hint.addEventListener('click', function () {
    if (half !== 2 || !target || (mode !== 'round' && mode !== 'finished')) return;
    stopAll();
    speak(huntSay(target.shape));
  });
  els.sayBtn.addEventListener('click', sayAgain);
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterHuntRound();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  renderScore(false);
})();
</script>
</body>
</html>
