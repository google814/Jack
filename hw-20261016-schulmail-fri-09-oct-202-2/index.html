<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Ten Frames &amp; Lost Toys ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Lost Toys">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #172554 0%, #1d4ed8 52%, #172554 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2vh, 20px);
    padding: clamp(8px, 2vh, 22px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }
  .lead .r { color: #fca5a5; }
  .lead .w { color: #fde047; }

  /* ---------- The equation ---------- */
  #eq {
    font-size: clamp(2.4rem, 11vmin, 5rem);
    font-weight: 900;
    letter-spacing: .04em;
    line-height: 1.05;
    cursor: pointer;
  }
  #eq .q { color: #fde047; }
  #eq.solved .q { animation: bounceIn .5s ease; }

  /* ---------- The ten frame (like the ones in class) ---------- */
  #frame {
    --c: clamp(46px, 13vmin, 92px);
    display: grid;
    grid-template-columns: repeat(5, var(--c));
    grid-template-rows: repeat(2, var(--c));
    background: #fff;
    border: 5px solid #1e293b;
    border-radius: 10px;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  .cell {
    border: 3px solid #1e293b;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .ctr {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.2);
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: calc(var(--c) * .4);
    color: #fff;
    line-height: 1;
    position: relative;
  }
  .ctr.gone { background: #fecaca; color: #b91c1c; box-shadow: none; animation: bounceIn .35s ease; }
  .ctr.gone::after {
    content: '✖';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: #1e293b;
    font-size: calc(var(--c) * .55);
  }
  .ctr.lit { outline: 4px solid #facc15; outline-offset: 2px; animation: bounceIn .4s ease; }

  /* ---------- Number tiles 0-10 ---------- */
  #tiles {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(5px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 640px;
  }
  .tile {
    width: clamp(50px, 11vmin, 78px);
    height: clamp(50px, 11vmin, 78px);
    font-family: inherit;
    font-size: clamp(1.3rem, 5vmin, 2.2rem);
    font-weight: 800;
    color: #1e3a8a;
    background: #eff6ff;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tile:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tile.wrong, .choice.wrong { background: #fecaca; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- The lost toy poster ---------- */
  #poster {
    position: relative;
    width: clamp(220px, 58vmin, 360px);
    background: #fffbeb;
    color: #1e293b;
    border-radius: 6px;
    padding: clamp(10px, 2vmin, 18px);
    box-shadow: 0 10px 0 rgba(0,0,0,.25);
    transform: rotate(-1.5deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, 1vmin, 10px);
    cursor: pointer;
  }
  #poster::before {
    content: '📌';
    position: absolute;
    top: -14px;
    left: calc(50% - 12px);
    font-size: 1.5rem;
  }
  #poster .pTitle {
    font-size: clamp(2rem, 9vmin, 3.6rem);
    font-weight: 900;
    color: #dc2626;
    letter-spacing: .1em;
    line-height: 1;
  }
  #pToy {
    width: clamp(90px, 24vmin, 150px);
    height: clamp(90px, 24vmin, 150px);
    border-radius: 18px;
    border: 4px dashed #94a3b8;
    background: #f1f5f9;
    display: grid;
    place-items: center;
    font-size: clamp(3rem, 14vmin, 5.5rem);
    line-height: 1;
  }
  #pToy.set { border-style: solid; border-color: #1e293b; }
  #pDesc { font-size: clamp(1.1rem, 3.6vmin, 1.6rem); font-weight: 900; min-height: 1.3em; }
  #pPlace { font-size: clamp(1rem, 3vmin, 1.35rem); font-weight: 800; min-height: 1.3em; }
  #poster .pHelp { font-size: clamp(.85rem, 2.4vmin, 1.1rem); font-weight: 700; opacity: .75; }
  #pStamp {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-14deg);
    font-size: clamp(1.8rem, 8vmin, 3.2rem);
    font-weight: 900;
    color: #16a34a;
    border: 6px solid #16a34a;
    border-radius: 14px;
    padding: 2px 14px;
    background: rgba(255,255,255,.85);
    animation: bounceIn .6s ease;
  }

  /* ---------- Big choice buttons ---------- */
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(8px, 2vmin, 16px);
    justify-content: center;
    max-width: 760px;
  }
  .choice {
    width: clamp(88px, 21vmin, 140px);
    min-height: clamp(88px, 21vmin, 140px);
    font-family: inherit;
    border: none;
    border-bottom: 7px solid rgba(0,0,0,.28);
    border-radius: 22px;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 6px;
  }
  .choice:active { transform: translateY(4px); border-bottom-width: 3px; }
  .choice .em { font-size: clamp(2.4rem, 10vmin, 4.2rem); line-height: 1.1; }
  .choice .nm { font-size: clamp(.8rem, 2.3vmin, 1.1rem); font-weight: 800; }
  .choice.find .em { font-size: clamp(3rem, 12vmin, 5rem); }
  .choice.hint { box-shadow: 0 0 0 6px #fde047; animation: pulse 1.2s ease infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  .c-red    { background: #ef4444 !important; color: #fff; }
  .c-blue   { background: #3b82f6 !important; color: #fff; }
  .c-yellow { background: #facc15 !important; color: #1e293b; }
  .c-green  { background: #22c55e !important; color: #fff; }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .mini {
    display: inline-block;
    border-radius: 10px;
    padding: 0 6px;
    margin-right: 4px;
  }
  .chip small { display: block; font-size: .6em; font-weight: 700; opacity: .6; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #172554 0%, #1d4ed8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 30ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Ten frames &amp; lost toys</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <p class="lead hidden" id="lead"></p>

  <div id="eq" class="hidden"></div>
  <div id="frame" class="hidden"></div>
  <div id="tiles" class="hidden"></div>

  <div id="poster" class="hidden">
    <div class="pTitle">LOST!</div>
    <div id="pToy">?</div>
    <div id="pDesc"></div>
    <div id="pPlace"></div>
    <div class="pHelp">Please help me find it!</div>
    <div id="pStamp" class="hidden">FOUND ✓</div>
  </div>

  <div id="choices" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count with me</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Ten frames &amp; lost toys ⚽</h2>
  <p>First half: take away on the ten frame.<br>Second half: make a lost toy poster 🧸<br>8 − 3 = ? · LOST!</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Schulmail Fri, 09 Oct 2026 (Ms Gavin):
     Mathematics: "We have been looking at subtraction using ten frames.
       Please use the ten frames to help complete the subtraction equations."
     English: "We have been looking at lost toy posters. Please create a lost
       toy poster of your own."

     First half: five subtraction equations on one ten frame (red counters,
     like in class). He taps the counters he takes away (each is crossed out
     and counted), then picks how many are left from the tiles 0-10.
     Second half: three lost toy posters of his own. He picks the toy, its
     colour and where he lost it; the poster is read out. Then the toys get
     mixed up and he has to find his one by listening to the poster.
     One football ⚽ for every equation and every poster. */

  var EQ_ROUNDS = 5;
  var POSTER_ROUNDS = 3;

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🔴', '🧸'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261016-schulmail-fri-09-oct-202-2.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five',
               'six', 'seven', 'eight', 'nine', 'ten'];

  /* every equation the first half can ask: one ten frame, 3 to 10 counters */
  function equations() {
    var out = [], a, b;
    for (a = 3; a <= 10; a++) for (b = 1; b < a; b++) out.push({ a: a, b: b });
    return out;
  }

  /* the poster pieces (the pictures for them sit outside this block) */
  var TOY_NAMES = ['teddy bear', 'car', 'robot', 'dinosaur', 'football', 'duck'];
  var COLOURS = ['red', 'blue', 'yellow', 'green'];
  var PLACES = ['at the park', 'at school', 'at the beach', 'in the garden'];

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1); }
  function counterWord(n) { return n === 1 ? 'counter' : 'counters'; }
  function eqWord(n) { return n === 1 ? 'subtraction equation' : 'subtraction equations'; }
  function posterWord(n) { return n === 1 ? 'lost toy poster' : 'lost toy posters'; }
  function resultOf(m) { return m.a - m.b; }

  var MATHS_SAY = 'We have been looking at subtraction using ten frames. ' +
                  'Please use the ten frames to help complete the subtraction equations.';
  var ENGLISH_SAY = 'We have been looking at lost toy posters. ' +
                    'Please create a lost toy poster of your own.';
  var LEFT_SAY = 'How many are left?';
  var ASK_TOY = 'Which toy is lost? Pick a toy.';
  var ASK_COLOUR = 'What colour is it?';
  var ASK_PLACE = 'Where did you lose it?';
  var HELP_SAY = 'Please help me find it!';
  var MIXED_SAY = 'Oh no! The toys are all mixed up. Listen to your poster and find your toy.';

  /* ---- subtraction ---- */
  /* "Seven take away three." */
  function sumSay(m) { return cap(WORDS[m.a]) + ' take away ' + WORDS[m.b] + '.'; }
  function takeSay(b) {
    return 'Tap ' + WORDS[b] + ' ' + counterWord(b) + ' to take ' + (b === 1 ? 'it' : 'them') + ' away.';
  }
  function askSay(m) { return sumSay(m) + ' ' + takeSay(m.b); }
  function startSay(m, first) { return (first ? MATHS_SAY + ' ' : '') + askSay(m); }
  function againSay(m, takenAll) { return sumSay(m) + ' ' + (takenAll ? LEFT_SAY : takeSay(m.b)); }
  function takenSay(b) { return cap(WORDS[b]) + ' taken away. ' + LEFT_SAY; }
  function countAllSay(n) { return cap(WORDS[n]) + ' ' + counterWord(n) + '.'; }
  function countLeftSay(n) { return cap(WORDS[n]) + ' left.'; }
  function notSay(n, together) {
    return together ? 'Not ' + WORDS[n] + '. Let us count them together.'
                    : 'Not ' + WORDS[n] + '. Try again. Count the counters that are left.';
  }
  /* "Seven take away three equals four." */
  function equationSay(m) {
    return cap(WORDS[m.a]) + ' take away ' + WORDS[m.b] + ' equals ' + WORDS[resultOf(m)] + '.';
  }
  function goalSay(m) { return 'Goal! ' + equationSay(m); }

  /* ---- lost toy poster ---- */
  function toyOf(t, c) { return COLOURS[c] + ' ' + TOY_NAMES[t]; }
  function posterStartSay(first) {
    return (first ? ENGLISH_SAY : 'Make another lost toy poster.') + ' ' + ASK_TOY;
  }
  function toySay(t) { return cap(TOY_NAMES[t]) + '.'; }
  function colourSay(c) { return cap(COLOURS[c]) + '.'; }
  function lostMySay(t, c) { return 'I have lost my ' + toyOf(t, c) + '.'; }
  function placeSay(p) { return 'I lost it ' + PLACES[p] + '.'; }
  /* "Lost! I have lost my red teddy bear. I lost it at the park. Please help me find it!" */
  function posterSay(t, c, p) {
    return 'Lost! ' + lostMySay(t, c) + ' ' + placeSay(p) + ' ' + HELP_SAY;
  }
  /* what is on the poster so far, plus the next question (null = not picked yet) */
  function posterSoFarSay(t, c, p) {
    if (t === null) return 'Lost! ' + ASK_TOY;
    if (c === null) return 'Lost! ' + toySay(t) + ' ' + ASK_COLOUR;
    if (p === null) return 'Lost! ' + lostMySay(t, c) + ' ' + ASK_PLACE;
    return posterSay(t, c, p);
  }
  function pickedToySay(t) { return toySay(t) + ' ' + ASK_COLOUR; }
  function pickedColourSay(t, c) { return lostMySay(t, c) + ' ' + ASK_PLACE; }
  function findSay(t, c) { return 'Find the ' + toyOf(t, c) + '.'; }
  function mixedSay(t, c) { return MIXED_SAY + ' ' + findSay(t, c); }
  function wrongFindSay(t, c, rt, rc) { return 'That is the ' + toyOf(t, c) + '. ' + findSay(rt, rc); }
  function foundSay(t, c) { return 'Goal! You found your ' + toyOf(t, c) + '!'; }

  function halfTimeSay(n) {
    return 'Half time! You did ' + WORDS[n] + ' ' + eqWord(n) + '. ' +
           'In the second half, make a lost toy poster of your own.';
  }
  function fullTimeSay(e, p) {
    return 'Full time! You did ' + WORDS[e] + ' ' + eqWord(e) + '. ' +
           'You made ' + WORDS[p] + ' ' + posterWord(p) + '. Brilliant!';
  }

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, n, e, list, t, c, p, t2, c2;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var q = segments(text); for (var k = 0; k < q.length; k++) add(q[k]); }
    /* first half */
    for (n = 0; n <= 10; n++) add(WORDS[n]);
    addAll(MATHS_SAY);
    addAll(LEFT_SAY);
    list = equations();
    for (i = 0; i < list.length; i++) {
      addAll(startSay(list[i], true));
      addAll(startSay(list[i], false));
      addAll(againSay(list[i], true));
      addAll(againSay(list[i], false));
      addAll(goalSay(list[i]));
      addAll(equationSay(list[i]));
    }
    for (n = 1; n <= 9; n++) { addAll(takeSay(n)); addAll(takenSay(n)); }
    for (n = 0; n <= 10; n++) {
      addAll(countAllSay(n));

  function pickVoice() {

    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }

        var file = clipFor(parts[i]);

  /* his toy, the same toy in another colour, another toy in his colour,

  function buildFind() {

  }

  function enterFind() {
    if (mode !== 'poster') return;
    stopAll();
    mode = 'find';
    attempts = 0;
    findCards = buildFind();
    els.choices.innerHTML = '';
    findCards.forEach(function (card, i) {
      var b = choiceBtn(TOY_ICONS[card.t], '', 'find ' + colourClass(card.c));
      b.addEventListener('click', tapFind.bind(null, i, b));
    });
    els.lead.innerHTML = '🔎 Find your lost toy!';
    show(['lead', 'choices', 'btnRow'], ['sayBtn']);
    speak(mixedSay(poster.t, poster.c));
  }

  function tapFind(i, b) {
    if (mode !== 'find') return;
    stopAll();
    var card = findCards[i];
    if (card.t !== poster.t || card.c !== poster.c) {
      attempts++;
      b.classList.remove('wrong');
      void b.offsetWidth;
      b.classList.add('wrong');
      if (attempts >= 2) {
        var btns = els.choices.querySelectorAll('.choice');
        findCards.forEach(function (fc, k) {
          if (fc.t === poster.t && fc.c === poster.c) btns[k].classList.add('hint');
        });
      }
      speak(wrongFindSay(card.t, card.c, poster.t, poster.c));
      return;
    }
    mode = 'found';
    donePosters.push({ t: poster.t, c: poster.c, p: poster.p });
    scoreGoal();
    celebrate(26);
    renderPoster();
    els.lead.innerHTML = 'GOAL! ⚽ Found it!';
    var last = round === POSTER_ROUNDS - 1;
    els.nextBtn.textContent = last ? 'Full time ➜' : 'Next poster ➜';
    show(['lead', 'poster', 'btnRow'], ['sayBtn', 'nextBtn']);
    speak(foundSay(poster.t, poster.c));
  }

  /* ================= Moving on ================= */
  function nextRound() {
    stopAll();
    if (mode === 'poster') { enterFind(); return; }   /* the 🔎 button after the poster */
    round++;
    if (half === 1) {
      if (round >= EQ_ROUNDS) enterHalfTime(); else enterEquation();
    } else {
      if (round >= POSTER_ROUNDS) enterFullTime(); else enterPoster();
    }
  }

  function sayAgain() {
    if (mode === 'eq') { stopAll(); speak(againSay(eq, taken >= eq.b)); }
    else if (mode === 'eqDone') { stopAll(); speak(equationSay(eq)); }
    else if (mode === 'poster') { stopAll(); speak(posterSoFarSay(poster.t, poster.c, poster.p)); }
    else if (mode === 'find') {
      stopAll();
      speak(posterSay(poster.t, poster.c, poster.p) + ' ' + findSay(poster.t, poster.c));
    }
    else if (mode === 'found') { stopAll(); speak(posterSay(poster.t, poster.c, poster.p)); }
  }

  /* ================= Board ================= */
  function boardItems() {
    var list = [];
    doneEq.forEach(function (m) {
      list.push({ html: m.a + ' − ' + m.b + ' = ' + resultOf(m) + '<small>take away</small>', say: equationSay(m) });
    });
    donePosters.forEach(function (p) {
      list.push({
        html: '<span class="mini ' + colourClass(p.c) + '">' + TOY_ICONS[p.t] + '</span>' + PLACE_ICONS[p.p] +
              '<small>LOST!</small>',
        say: posterSay(p.t, p.c, p.p)
      });
    });
    return list;
  }

  function renderBoard() {
    els.board.innerHTML = '';
    boardItems().forEach(function (it, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = it.html;
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(boardItems()[i].say, function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    boardItems().forEach(function (it, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: it.say
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    half = 2;
    round = 0;
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = 'Next: make a lost toy poster 🧸';
    els.boardBtn.textContent = 'Second half ➜';
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(doneEq.length));
  }

  function enterFullTime() {
    mode = 'board';
    half = 3;
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = (doneEq.length + donePosters.length) + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(doneEq.length, donePosters.length));
  }

  /* ================= Match ================= */
  /* five different equations, not two with the same answer in a row,
     the easier ones (up to 7 counters) first */
  function buildQueue() {
    var all = shuffle(equations()), easy = [], hard = [];
    all.forEach(function (m) { (m.a <= 7 ? easy : hard).push(m); });
    var out = [], pool = easy.slice(0, 2).concat(hard);
    pool.forEach(function (m) {
      if (out.length >= EQ_ROUNDS) return;
      var prev = out[out.length - 1];
      if (prev && resultOf(prev) === resultOf(m)) return;
      out.push(m);
    });
    return out;
  }

  function startMatch() {
    stopAll();
    queue = buildQueue();
    doneEq = [];
    donePosters = [];
    half = 1;
    round = 0;
    enterEquation();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  els.eq.addEventListener('click', sayAgain);
  els.poster.addEventListener('click', sayAgain);
  els.sayBtn.addEventListener('click', sayAgain);
  els.countBtn.addEventListener('click', function () {
    if (mode === 'eq' && !busy) countLeft();
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (half === 2) enterPoster();
    else startMatch();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildTiles();
  renderScore(false);
})();
</script>
</body>
</html>
