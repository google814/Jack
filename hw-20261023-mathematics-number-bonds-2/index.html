<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>Number Bonds to Ten ⚽</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" href="../icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-title" content="Number Bonds">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Comic Sans MS", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #14532d 0%, #16a34a 52%, #14532d 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: rgba(0,0,0,.24);
  }
  header .home {
    text-decoration: none;
    color: #fff;
    font-size: 1.6rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
  }
  header h1 { font-size: clamp(1.1rem, 3.2vw, 1.6rem); flex: 0 1 auto; min-width: 0; }
  @media (max-width: 620px) { header h1 { display: none; } }
  #half {
    font-size: clamp(.75rem, 2vw, .95rem);
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    white-space: nowrap;
  }
  #score {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  #score .ball.new { display: inline-block; animation: bounceIn .8s ease; }
  #score .count { font-weight: 800; font-size: 1.3rem; margin-left: 6px; }
  @keyframes bounceIn {
    0% { transform: scale(0) rotate(-40deg); }
    60% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #settingsBtn {
    background: none; border: none; color: #fff;
    font-size: 1.2rem; opacity: .45; cursor: pointer; padding: 6px;
  }

  /* ---------- Stage ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.8vh, 18px);
    padding: clamp(8px, 2vh, 20px) 12px calc(clamp(10px, 2.4vh, 24px) + env(safe-area-inset-bottom));
    text-align: center;
  }
  .hidden { display: none !important; }
  .lead { font-size: clamp(1.05rem, 2.8vmin, 1.5rem); font-weight: 700; }
  .lead .r { color: #fca5a5; }
  .lead .y { color: #fde047; }

  /* ---------- The homework numbers (like the sheet) ---------- */
  #strip {
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 1vmin, 8px);
    padding: clamp(6px, 1.4vmin, 10px) clamp(10px, 2.4vmin, 16px);
    background: rgba(0,0,0,.22);
    border-radius: 18px;
  }
  .srow { display: flex; gap: clamp(6px, 1.6vmin, 12px); justify-content: center; }
  .snum {
    width: clamp(40px, 7.4vmin, 52px);
    height: clamp(40px, 7.4vmin, 52px);
    font-family: inherit;
    font-size: clamp(1.1rem, 3.6vmin, 1.6rem);
    font-weight: 800;
    color: #14532d;
    background: #f0fdf4;
    border: 3px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
  }
  .snum.now { border-color: #facc15; box-shadow: 0 0 0 4px rgba(250,204,21,.55); animation: pulse 1.2s ease infinite; }
  .snum.got { background: #bbf7d0; }
  .snum.got::after {
    content: '✓';
    position: absolute;
    right: -6px; top: -8px;
    font-size: .7em;
    color: #fff;
    background: #16a34a;
    border-radius: 50%;
    width: 1.3em; height: 1.3em;
    line-height: 1.3em;
  }

  /* ---------- 10 = __ + __ ---------- */
  #eq {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vmin, 16px);
    font-size: clamp(2rem, 8vmin, 3.8rem);
    font-weight: 900;
  }
  .box {
    min-width: clamp(60px, 12vmin, 92px);
    height: clamp(60px, 12vmin, 92px);
    font-family: inherit;
    font-size: inherit;
    font-weight: 900;
    color: #1e293b;
    background: #fff;
    border: 5px solid #fde047;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.25);
    padding: 0 8px;
  }
  .box.ten { border-color: #f59e0b; }
  .box.red { border-color: #ef4444; }
  .box.yel { border-color: #eab308; }
  .box.active {
    border-style: dashed;
    color: #94a3b8;
    box-shadow: 0 0 0 6px rgba(253,224,71,.85), 0 6px 0 rgba(0,0,0,.25);
    animation: pulse 1.2s ease infinite;
  }
  .box.done { background: #fefce8; animation: bounceIn .5s ease; }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }

  /* ---------- Ten frame ---------- */
  #frame {
    --c: clamp(42px, 9vmin, 68px);
    display: grid;
    grid-template-columns: repeat(5, var(--c));
    grid-template-rows: repeat(2, var(--c));
    gap: 0;
    background: #fff;
    border: 5px solid #1e293b;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
  }
  .cell {
    width: var(--c);
    height: var(--c);
    border: 2px solid #1e293b;
    display: grid;
    place-items: center;
  }
  .cnt {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: calc(var(--c) * .42);
    line-height: 1;
  }
  .cell.red .cnt { background: #ef4444; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
  .cell.yel .cnt { background: #facc15; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); animation: bounceIn .45s ease; }
  .cell.empty .cnt { color: #16a34a; }
  .cell.lit { background: #fef9c3; }
  .cell.lit .cnt { outline: 4px dashed #16a34a; outline-offset: -2px; animation: bounceIn .4s ease; }

  /* ---------- Number tiles 0-10 ---------- */
  #tiles {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(5px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 900px;
  }
  .tile {
    width: clamp(50px, 10vmin, 72px);
    height: clamp(50px, 10vmin, 72px);
    font-family: inherit;
    font-size: clamp(1.3rem, 5vmin, 2.2rem);
    font-weight: 800;
    color: #14532d;
    background: #f0fdf4;
    border: none;
    border-bottom: 6px solid rgba(0,0,0,.28);
    border-radius: 16px;
    cursor: pointer;
  }
  .tile:active { transform: translateY(4px); border-bottom-width: 2px; }
  .tile.wrong { background: #fecaca; animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* ---------- Buttons ---------- */
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    padding: clamp(11px, 2vh, 17px) clamp(20px, 5vw, 40px);
    font-size: clamp(1rem, 2.8vmin, 1.4rem);
    box-shadow: 0 8px 0 rgba(0,0,0,.25);
    background: linear-gradient(145deg, #22c55e, #15803d);
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .btn.big { background: linear-gradient(145deg, #f59e0b, #d97706); }
  .btn.quiet {
    background: rgba(0,0,0,.32);
    box-shadow: none;
    font-size: clamp(.9rem, 2.2vmin, 1.15rem);
    padding: clamp(10px, 1.6vh, 14px) clamp(16px, 4vw, 30px);
  }

  /* ---------- Match board ---------- */
  #boardBox { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); }
  #boardTitle { font-size: clamp(1.5rem, 5.6vmin, 2.8rem); font-weight: 800; }
  #board {
    display: flex;
    flex-wrap: wrap;
    gap: clamp(6px, 1.4vmin, 12px);
    justify-content: center;
    max-width: 720px;
  }
  .chip {
    font-family: inherit;
    font-size: clamp(1.05rem, 3vmin, 1.5rem);
    font-weight: 900;
    padding: clamp(8px, 1.6vh, 14px) clamp(12px, 2.6vw, 20px);
    border-radius: 16px;
    border: 3px solid #fde047;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
  }
  .chip .t { color: #d97706; }
  .chip .r { color: #dc2626; }
  .chip .y { color: #a16207; }
  .chip.saying { outline: 4px solid #fde047; outline-offset: 3px; }

  /* ---------- Overlays ---------- */
  #startOverlay, #settingsPanel { position: fixed; z-index: 60; }
  #startOverlay {
    inset: 0;
    background: linear-gradient(160deg, #14532d 0%, #16a34a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vh, 34px);
    text-align: center;
    padding: 24px;
  }
  #startOverlay h2 { font-size: clamp(1.5rem, 6vmin, 2.8rem); }
  #startOverlay p { max-width: 28ch; opacity: .92; font-size: clamp(.95rem, 2.4vmin, 1.2rem); line-height: 1.5; }
  #playBtn { font-size: clamp(1.6rem, 5vmin, 2.6rem); padding: clamp(16px, 3vh, 26px) clamp(34px, 8vw, 64px); }
  #settingsPanel {
    top: 58px; right: 12px;
    background: #fff; color: #1e293b;
    border-radius: 16px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 10px; font-size: .95rem;
  }
  #settingsPanel button {
    font-family: inherit; font-size: .95rem; padding: 8px 12px;
    border-radius: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer;
  }

  .confetti {
    position: fixed;
    top: -6vh;
    font-size: 2rem;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 40;
  }
  @keyframes fall { to { transform: translateY(112vh) rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../" title="All games">🏠</a>
  <h1>Number bonds to ten</h1>
  <span id="half">Kick off</span>
  <div id="score"></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main>
  <div id="strip" class="hidden">
    <div class="srow" id="row1"></div>
    <div class="srow" id="row2"></div>
  </div>

  <p class="lead hidden" id="lead"></p>

  <div id="eq" class="hidden">
    <button class="box ten" id="boxT" type="button">10</button>
    <span>=</span>
    <button class="box red" id="boxA" type="button"></button>
    <span>+</span>
    <button class="box yel" id="boxB" type="button"></button>
  </div>

  <div id="frame" class="hidden"></div>

  <div id="tiles" class="hidden"></div>

  <div class="row hidden" id="btnRow">
    <button class="btn quiet" id="sayBtn">🔊 Say it again</button>
    <button class="btn quiet" id="countBtn">🔊 Count the spaces</button>
    <button class="btn big" id="nextBtn">Next ➜</button>
  </div>

  <div id="boardBox" class="hidden">
    <div id="boardTitle"></div>
    <p id="boardText" class="lead"></p>
    <div id="board"></div>
    <div class="row">
      <button class="btn quiet" id="boardSayBtn">🔊 Say them all</button>
      <button class="btn big" id="boardBtn"></button>
    </div>
  </div>
</main>

<div id="startOverlay">
  <h2>⚽ Number bonds to ten ⚽</h2>
  <p>7 1 5 6 4<br>10 9 8 2 3<br>10 = 10 + 0<br>10 = ___ + ___</p>
  <button id="playBtn" class="btn big">▶ Kick off</button>
</div>

<div id="settingsPanel" class="hidden">
  <label><input type="checkbox" id="slowToggle"> Slower talking</label>
  <button id="resetBtn">Reset score</button>
</div>

<script>
(function () {
  'use strict';

  /* ================= Homework =================
     Mathematics - Number Bonds.
       7   1   5   6   4
       10  9   8   2   3
       10 = 10 + 0
       10 = ___ + ___

     A match starts with the example 10 = 10 + 0 (a full ten frame), read
     out step by step. First half: the top row of numbers, second half the
     bottom row, each one as 10 = 7 + ___ with the red counters in a ten
     frame; he finds how many more make ten (tap the frame to count the
     empty spaces). Then two penalties: 10 = ___ + ___, he picks both
     numbers himself, the second penalty a different way. One football ⚽
     for every bond. */

  var CONFETTI = ['⚽', '⭐', '🎉', '🌟', '🔴', '🟡'];

  /* ==== TEXT-CORE ====
     Everything the game can say is built in here and nowhere else. It touches
     no DOM, so tools/phrases/hw-20261023-mathematics-number-bonds-2.txt is
     generated straight out of this block (tools/gen-phrases.js). */

  var ROW1 = [7, 1, 5, 6, 4];
  var ROW2 = [10, 9, 8, 2, 3];
  var PENALTIES = 2;
  var MAX_GOALS = ROW1.length + ROW2.length + PENALTIES;

  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
               'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* 10 = 7 + 3 */
  function bondSay(a, b) { return 'Ten equals ' + WORDS[a] + ' plus ' + WORDS[b] + '.'; }
  function makeSay(a, b) { return cap(WORDS[a]) + ' and ' + WORDS[b] + ' make ten.'; }

  /* 10 = 7 + ___ */
  function askSay(a) { return 'Ten equals ' + WORDS[a] + ' plus what? How many more make ten?'; }
  /* 10 = ___ + ___ */
  function askOpenSay() { return 'Ten equals what plus what? Pick any number.'; }

  function redSay(n) {
    if (n === 0) return 'No red counters.';
    return cap(WORDS[n]) + (n === 1 ? ' red counter.' : ' red counters.');
  }
  function emptySay(n) {
    if (n === 0) return 'No empty spaces.';
    return cap(WORDS[n]) + (n === 1 ? ' empty space.' : ' empty spaces.');
  }
  /* he picked the first number of a penalty */
  function pickSay(n) { return redSay(n) + ' ' + askSay(n); }
  function againSay(n) { return 'You made ' + WORDS[n] + ' already. Pick a different number.'; }

  function notSay(n, together) {
    return together ? 'Not ' + WORDS[n] + '. Let us count the empty spaces together.'
                    : 'Not ' + WORDS[n] + '. Try again. Tap the empty spaces to count them.';
  }
  function goalSay(a, b) { return 'Goal! ' + makeSay(a, b) + ' ' + bondSay(a, b); }

  /* phase 1 = first half, 2 = second half, 3 = penalties */
  function introSay(phase, round) {
    if (phase === 1) return 'First half! Find the number that makes ten.';
    if (phase === 2) return 'Second half! Now the bottom row of numbers.';
    return round === 0 ? 'Penalty time! Make ten your way.'
                       : 'Last penalty! Make ten a different way.';
  }
  function goalsWord(n) { return WORDS[n] + (n === 1 ? ' goal' : ' goals'); }
  function halfTimeSay(n) {
    return 'Half time! You scored ' + goalsWord(n) + '. In the second half, the bottom row of numbers.';
  }
  function fullTimeSay(n) {
    return 'Full time! You scored ' + goalsWord(n) + '. You know your number bonds to ten. Brilliant!';
  }

  /* the example, line by line (10 = 10 + 0) */
  var EXAMPLE_SAY = [
    'Here is the example. Ten equals ten plus zero.',
    'Ten red counters. The ten frame is full.',
    'No empty spaces. Ten and zero make ten.',
    'Now it is your turn!'
  ];

  function norm(t) { return String(t == null ? '' : t).replace(/\s+/g, ' ').trim(); }
  function bare(t) { return norm(t).replace(/[.!?]+$/, ''); }

  /* A line is spoken segment by segment, split after . ! ? and a space, and
     every segment is its own clip. Written out by hand because a lookbehind
     regex would not parse on older phones. */
  function segments(text) {
    var t = norm(text), out = [], buf = '', i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);
      buf += ch;
      i++;
      if ((ch === '.' || ch === '!' || ch === '?') && /\s/.test(t.charAt(i))) {
        while (i < t.length && /\s/.test(t.charAt(i))) i++;
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  /* every line the game can play, one segment per entry */
  function phraseList() {
    var out = [], seen = {}, i, a, n;
    function add(s) { var k = bare(s); if (k && !seen[k]) { seen[k] = 1; out.push(s); } }
    function addAll(text) { var p = segments(text); for (var k = 0; k < p.length; k++) add(p[k]); }
    for (i = 0; i < EXAMPLE_SAY.length; i++) addAll(EXAMPLE_SAY[i]);
    for (n = 0; n <= 10; n++) add(WORDS[n]);
    addAll(introSay(1, 0));
    addAll(introSay(2, 0));
    for (i = 0; i < PENALTIES; i++) addAll(introSay(3, i));
    addAll(askOpenSay());
    for (a = 0; a <= 10; a++) {
      addAll(askSay(a));
      addAll(redSay(a));
      addAll(emptySay(a));
      addAll(pickSay(a));
      addAll(againSay(a));
      addAll(notSay(a, false));
      addAll(notSay(a, true));
      addAll(bondSay(a, 10 - a));
      addAll(makeSay(a, 10 - a));
      addAll(goalSay(a, 10 - a));
    }
    for (n = 0; n <= MAX_GOALS; n++) { addAll(halfTimeSay(n)); addAll(fullTimeSay(n)); }
    return out;
  }
  /* ==== END TEXT-CORE ==== */

  if (typeof window === 'undefined') return;
  window.__phrases = phraseList;

  /* ================= State ================= */
  var SCORE_KEY = 'jackHw_hw20261023mathematicsnumberbonds2';
  var SLOW_KEY  = 'jackHw_hw20261023mathematicsnumberbonds2_slow';

  var footballs = parseInt(localStorage.getItem(SCORE_KEY) || '0', 10) || 0;
  var slow      = localStorage.getItem(SLOW_KEY) === 'yes';

  var phase = 1;          /* 1 first half | 2 second half | 3 penalties */
  var round = 0;
  var queue1 = [], queue2 = [];
  var done = [];          /* bonds finished this match: { a, b } */
  var picks = [];         /* first numbers he chose in the penalties */
  var cur = null;         /* { a, b } — null while a box is still empty */
  var step = 'b';         /* the box he is filling: 'a' or 'b' */
  var attempts = 0;
  var busy = false;
  var mode = 'start';     /* start | example | round | finished | board */
  var boardNext = null;
  var flowToken = 0;      /* cancels a talking sequence */
  var countToken = 0;     /* cancels counting out loud */

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    score: $('score'), half: $('half'), lead: $('lead'),
    strip: $('strip'), row1: $('row1'), row2: $('row2'),
    eq: $('eq'), boxT: $('boxT'), boxA: $('boxA'), boxB: $('boxB'),
    frame: $('frame'), tiles: $('tiles'), btnRow: $('btnRow'),
    sayBtn: $('sayBtn'), countBtn: $('countBtn'), nextBtn: $('nextBtn'),
    boardBox: $('boardBox'), boardTitle: $('boardTitle'), boardText: $('boardText'),
    board: $('board'), boardSayBtn: $('boardSayBtn'), boardBtn: $('boardBtn'),
    startOverlay: $('startOverlay'), playBtn: $('playBtn'),
    settingsBtn: $('settingsBtn'), settingsPanel: $('settingsPanel'),
    slowToggle: $('slowToggle'), resetBtn: $('resetBtn')
  };
  var BOXES = { a: els.boxA, b: els.boxB };

  function save() {
    localStorage.setItem(SCORE_KEY, String(footballs));
    localStorage.setItem(SLOW_KEY, slow ? 'yes' : 'no');
  }

  /* ================= Voice =================
     He cannot read yet, so every line is spoken. The browser's own voice
     sounds like a computer, so every line is pre-rendered with a neural
     en-GB voice (tools/build-audio.py) and played back through Web Audio,
     segment by segment. speechSynthesis is only the fallback for a segment
     that has no clip. speak() calls done() when the line has finished — with
     a timer as a safety net, because iOS does not always fire onend. */
  var hasSpeech = 'speechSynthesis' in window;
  var hasAudio = !!(window.AudioContext || window.webkitAudioContext);
  var hasTTS = hasSpeech || hasAudio;
  var voice = null;

  var CLIP_DIR = '../audio/hw-20261023-mathematics-number-bonds-2/';
  var clips = null;          /* exact line -> mp3 file */
  var clipsLoose = null;     /* the same without a final . ! ? */
  var buffers = {};          /* file -> decoded AudioBuffer */
  var spans = {};            /* file -> { start, dur }: the speech inside the clip */
  var loading = {};          /* file -> in-flight promise */
  var actx = null;
  var sources = [];          /* clips still playing */
  var speakToken = 0;        /* cancels a line that has been talked over */
  window.__clipPlays = 0;    /* handy when checking the page is really using clips */
  window.__clipMisses = [];  /* segments that had to fall back to speechSynthesis */

  var clipsReady = (function () {
    var load = (typeof fetch === 'function')
      ? fetch(CLIP_DIR + 'manifest.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (m) {
            if (!m || !m.clips) return;
            clips = m.clips;
            clipsLoose = {};
            for (var k in clips) {
              var b = bare(k);
              if (!(b in clipsLoose)) clipsLoose[b] = clips[k];
            }
          })
          .catch(function () { /* no clips: Web Speech carries the game */ })
      : Promise.resolve();
    /* never let a stuck download keep the game silent */
    return Promise.race([load, new Promise(function (res) { setTimeout(res, 3000); })]);
  })();

  function clipFor(text) {
    var t = norm(text);
    if (!t || !clips) return null;
    return clips[t] || (clipsLoose ? clipsLoose[bare(t)] : null) || null;
  }

  /* iOS only starts audio inside a real tap: the context is made on the first
     pointer down (the ▶ button) and resumed on every tap after that. */
  function audioReady() {
    if (!hasAudio) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!actx) {
      try { actx = new AC(); } catch (e) { hasAudio = false; return null; }
    }
    if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  document.addEventListener('pointerdown', audioReady, true);
  document.addEventListener('touchstart', audioReady, true);

  /* Every clip comes with a little silence in front and a longer tail behind.
     Played back to back that is a robot pause, so only the speech is played
     and the gap between two clips is a breath (GAP_MS). */
  var GAP_MS = 170;
  function speechSpan(buf) {
    var d = buf.getChannelData(0), n = d.length, rate = buf.sampleRate;
    var floor = 0.006;                         /* about -45 dB */
    var a = 0, b = n - 1;
    while (a < n && Math.abs(d[a]) < floor) a++;
    while (b > a && Math.abs(d[b]) < floor) b--;
    if (a >= b) return { start: 0, dur: buf.duration };
    a = Math.max(0, a - Math.floor(rate * 0.04));
    b = Math.min(n - 1, b + Math.floor(rate * 0.08));    /* the fade of the last sound */
    return { start: a / rate, dur: (b - a + 1) / rate };
  }

  function loadClip(file) {
    if (buffers[file]) return Promise.resolve(buffers[file]);
    if (loading[file]) return loading[file];
    if (!actx) {
      if (typeof fetch === 'function') fetch(CLIP_DIR + file).catch(function () {});
      return Promise.reject(new Error('no audio yet'));
    }
    var ac = audioReady();
    if (!ac) return Promise.reject(new Error('no audio yet'));
    loading[file] = fetch(CLIP_DIR + file)
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(function (ab) {
        return new Promise(function (res, rej) {
          var p = ac.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
      })
      .then(function (buf) { buffers[file] = buf; spans[file] = speechSpan(buf); delete loading[file]; return buf; },
            function (e) { delete loading[file]; throw e; });
    return loading[file];
  }

  /* warm the clips so a tap answers at once */
  function preload(list) {
    if (!list || !list.length) return;
    clipsReady.then(function () {
      for (var i = 0; i < list.length; i++) {
        var parts = segments(list[i]);
        for (var j = 0; j < parts.length; j++) {
          var f = clipFor(parts[j]);
          if (f && !buffers[f]) loadClip(f).catch(function () {});
        }
      }
    });
  }

  function pickVoice() {
    if (!hasSpeech) return;
    var vs = speechSynthesis.getVoices();
    var en = vs.filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var gb = en.filter(function (v) { return /GB/i.test(v.lang); });
    var find = function (list, re) {
      for (var i = 0; i < list.length; i++) if (re.test(list[i].name)) return list[i];
      return null;
    };
    var female = /(Sonia|Libby|Hazel|Serena|Kate|Martha|Stephanie|Fiona|Samantha|Karen|Moira)/i;
    var good = /(Enhanced|Premium|Natural)/i;
    voice =
      find(gb, good) ||
      find(gb, /Google UK English Female/i) ||
      find(gb, female) || gb[0] ||
      find(en, good) || find(en, female) || en[0] || null;
  }

  function stopSpeaking() {
    speakToken++;
    for (var i = 0; i < sources.length; i++) {
      try { sources[i].onended = null; sources[i].stop(0); } catch (e) {}
    }
    sources = [];
    if (hasSpeech) { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* the fallback: only used for a segment that has no clip */
  function say(text, my, done, rate) {
    window.__clipMisses.push(text);
    var factor = slow ? 1.25 : 1;
    if (!hasSpeech) {
      setTimeout(function () { if (my === speakToken && done) done(); }, (600 + text.length * 45) * factor);
      return;
    }
    var finished = false;
    var guard = null;
    var fin = function () {
      if (finished) return;
      finished = true;
      clearTimeout(guard);
      if (my === speakToken && done) done();
    };
    try {
      var u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.lang = 'en-GB';
      u.rate = (rate || 0.9) * (slow ? 0.8 : 1);
      u.onend = fin;
      u.onerror = fin;
      guard = setTimeout(fin, (2500 + text.length * 110) * factor);
      /* iOS Safari drops an utterance queued in the same tick as cancel() */
      setTimeout(function () { if (my === speakToken) speechSynthesis.speak(u); }, 40);
    } catch (e) { fin(); }
  }

  /* Plays a list of clip texts one after another, a breath between them.
     `done` fires after the last one, unless something talked over it. */
  function speakParts(parts, done, rate) {
    stopSpeaking();
    var my = speakToken;
    parts = (parts || []).filter(Boolean);
    if (!parts.length) { if (done) done(); return; }
    if (!hasTTS) {
      var len = parts.join(' ').length;
      if (done) setTimeout(function () { if (my === speakToken) done(); }, (600 + len * 45) * (slow ? 1.25 : 1));
      return;
    }
    clipsReady.then(function () {
      if (my !== speakToken) return;
      (function step(i) {
        if (my !== speakToken) return;
        if (i >= parts.length) { if (done) done(); return; }
        var onward = function () { step(i + 1); };
        var file = clipFor(parts[i]);
        var ac = file ? audioReady() : null;
        if (file && ac) {
          loadClip(file).then(function (buf) {
            if (my !== speakToken) return;
            var src = ac.createBufferSource();
            src.buffer = buf;
            src.connect(ac.destination);
            src.onended = function () {
              var k = sources.indexOf(src);
              if (k >= 0) sources.splice(k, 1);
              if (my === speakToken) setTimeout(function () { if (my === speakToken) onward(); }, GAP_MS);
            };
            sources.push(src);
            window.__clipPlays++;
            var span = spans[file] || { start: 0, dur: buf.duration };
            src.start(0, span.start, span.dur);
          }, function () { say(parts[i], my, onward, rate); });
        } else {
          say(parts[i], my, onward, rate);
        }
      })(0);
    });
  }

  /* one line, cut into its segments */
  function speak(text, done, rate) {
    speakParts(segments(text), done, rate);
  }

  if (hasSpeech) {
    pickVoice();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
  }

  function stopAll() {
    flowToken++;
    countToken++;
    stopSpeaking();
  }

  /* Run a list of { act, say } one after another, each line waiting for
     the one before it to finish. Anything else that talks stops it. */
  function sequence(list) {
    var token = ++flowToken;
    (function next(i) {
      if (token !== flowToken || i >= list.length) return;
      var s = list[i];
      if (s.act) s.act();
      if (s.say) speak(s.say, function () { setTimeout(function () { next(i + 1); }, 300); }, s.rate);
      else setTimeout(function () { next(i + 1); }, s.wait || 500);
    })(0);
  }

  /* ================= Small helpers ================= */
  function celebrate(count) {
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = CONFETTI[Math.floor(Math.random() * CONFETTI.length)];
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }.bind(null, c), 4200);
    }
  }

  function renderScore(justScored) {
    var html = '';
    if (footballs <= 9) {
      for (var i = 0; i < footballs; i++) {
        html += '<span class="ball' + (justScored && i === footballs - 1 ? ' new' : '') + '">⚽</span>';
      }
    } else {
      html = '<span class="ball' + (justScored ? ' new' : '') + '">⚽</span><span class="count">× ' + footballs + '</span>';
    }
    els.score.innerHTML = html;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ================= Screens ================= */
  var ALL = ['strip', 'lead', 'eq', 'frame', 'tiles', 'btnRow', 'boardBox'];
  function show(list, buttons) {
    ALL.forEach(function (id) { els[id].classList.toggle('hidden', list.indexOf(id) === -1); });
    buttons = buttons || [];
    ['sayBtn', 'countBtn', 'nextBtn'].forEach(function (id) {
      els[id].classList.toggle('hidden', buttons.indexOf(id) === -1);
    });
  }

  /* ================= The homework numbers ================= */
  function buildStrip() {
    [[els.row1, ROW1], [els.row2, ROW2]].forEach(function (pair) {
      pair[0].innerHTML = '';
      pair[1].forEach(function (n) {
        var b = document.createElement('button');
        b.className = 'snum';
        b.type = 'button';
        b.textContent = String(n);
        b.setAttribute('data-n', String(n));
        b.addEventListener('click', function () {
          if (mode === 'start' || (mode === 'round' && busy)) return;
          stopAll();
          speak(WORDS[n]);
        });
        pair[0].appendChild(b);
      });
    });
  }

  function stripMark(nowN, gotN) {
    var all = els.strip.querySelectorAll('.snum');
    for (var i = 0; i < all.length; i++) {
      var n = parseInt(all[i].getAttribute('data-n'), 10);
      all[i].classList.toggle('now', n === nowN);
      if (n === gotN) all[i].classList.add('got');
    }
  }

  function stripReset() {
    var all = els.strip.querySelectorAll('.snum');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('now', 'got');
  }

  /* ================= Ten frame ================= */
  function renderFrame(red, yel) {
    els.frame.innerHTML = '';
    for (var i = 0; i < 10; i++) {
      var c = document.createElement('div');
      c.className = 'cell ' + (i < red ? 'red' : i < red + yel ? 'yel' : 'empty');
      var k = document.createElement('div');
      k.className = 'cnt';
      c.appendChild(k);
      els.frame.appendChild(c);
    }
  }

  function clearLit() {
    var lit = els.frame.querySelectorAll('.cell');
    for (var i = 0; i < lit.length; i++) {
      lit[i].classList.remove('lit');
      lit[i].firstChild.textContent = '';
    }
  }

  /* Count the empty spaces out loud, a number lighting up in each one. */
  function countEmpty(then) {
    var token = ++countToken;
    flowToken++;
    clearLit();
    var nodes = els.frame.querySelectorAll('.cell.empty');
    var i = 0;
    (function tick() {
      if (token !== countToken) return;
      if (i >= nodes.length) {
        setTimeout(function () {
          if (token !== countToken) return;
          speak(emptySay(nodes.length), then);
        }, nodes.length ? 250 : 0);
        return;
      }
      nodes[i].classList.add('lit');
      nodes[i].firstChild.textContent = String(i + 1);
      speak(WORDS[i + 1], null, 0.85);
      i++;
      setTimeout(tick, slow ? 1050 : 800);
    })();
  }

  /* ================= 10 = __ + __ ================= */
  function setBox(which, value, cls) {
    var b = BOXES[which];
    b.classList.remove('active', 'done');
    if (cls) b.classList.add(cls);
    b.textContent = value === null ? '' : String(value);
  }

  function markActive() {
    BOXES.a.classList.remove('active');
    BOXES.b.classList.remove('active');
    var b = BOXES[step];
    b.classList.add('active');
    b.textContent = '?';
  }

  function currentAsk() {
    return step === 'a' ? askOpenSay() : askSay(cur.a);
  }

  function askLead() {
    if (step === 'a') return 'Pick any number 🔴';
    return 'How many more make <span class="y">10</span>? 🟡';
  }

  /* tapping a box says what is in it */
  function tapBox(which) {
    if (mode === 'start' || mode === 'board') return;
    countToken++;
    if (which === 't') { speak(WORDS[10]); return; }
    var v = BOXES[which].textContent;
    if (/^\d+$/.test(v)) speak(WORDS[parseInt(v, 10)]);
    else if (mode === 'round' && step === which) speak(currentAsk());
  }

  /* ================= Number tiles 0-10 ================= */
  function buildTiles() {
    els.tiles.innerHTML = '';
    for (var n = 0; n <= 10; n++) {
      var t = document.createElement('button');
      t.className = 'tile';
      t.type = 'button';
      t.textContent = String(n);
      t.addEventListener('click', answer.bind(null, n, t));
      els.tiles.appendChild(t);
    }
  }

  function shake(tile) {
    tile.classList.remove('wrong');
    void tile.offsetWidth;
    tile.classList.add('wrong');
  }

  /* ================= The example: 10 = 10 + 0 ================= */
  function enterExample() {
    stopAll();
    mode = 'example';
    cur = { a: 10, b: 0 };
    els.half.textContent = 'Example';
    stripReset();
    els.lead.textContent = 'The first one is an example. 👀';
    els.nextBtn.textContent = 'My turn ➜';
    show(['strip', 'lead', 'eq', 'frame', 'btnRow'], ['sayBtn', 'nextBtn']);
    playExample();
  }

  function playExample() {
    setBox('a', null);
    setBox('b', null);
    renderFrame(0, 0);
    sequence([
      { act: function () { setBox('a', 10, 'done'); setBox('b', 0, 'done'); },
        say: EXAMPLE_SAY[0] },
      { act: function () { renderFrame(10, 0); },
        say: EXAMPLE_SAY[1] },
      { say: EXAMPLE_SAY[2] },
      { say: EXAMPLE_SAY[3] }
    ]);
  }

  /* ================= A round ================= */
  function roundsIn(p) { return p === 1 ? ROW1.length : p === 2 ? ROW2.length : PENALTIES; }

  function enterRound() {
    stopAll();
    mode = 'round';
    busy = false;
    attempts = 0;
    if (phase < 3) {
      cur = { a: (phase === 1 ? queue1 : queue2)[round], b: null };
      step = 'b';
      setBox('a', cur.a, 'done');
    } else {
      cur = { a: null, b: null };
      step = 'a';
      setBox('a', null);
    }
    setBox('b', null);
    markActive();
    renderFrame(cur.a || 0, 0);
    stripMark(phase < 3 ? cur.a : null, null);
    els.half.textContent = (phase === 1 ? 'First half · ' : phase === 2 ? 'Second half · ' : 'Penalty · ') +
      (round + 1) + '/' + roundsIn(phase);
    els.lead.innerHTML = askLead();
    show(['strip', 'lead', 'eq', 'frame', 'tiles', 'btnRow'], ['sayBtn', 'countBtn']);
    var line = (phase === 3 || round === 0) ? introSay(phase, round) + ' ' + currentAsk() : currentAsk();
    setTimeout(function () { if (mode === 'round' && !busy && cur.b === null) speak(line); }, 300);
  }

  function answer(n, tile) {
    if (mode !== 'round' || busy) return;
    stopAll();

    /* a penalty: he picks the first number himself */
    if (step === 'a') {
      if (picks.indexOf(n) >= 0) {
        shake(tile);
        speak(againSay(n));
        return;
      }
      cur.a = n;
      setBox('a', n, 'done');
      renderFrame(n, 0);
      step = 'b';
      markActive();
      els.lead.innerHTML = askLead();
      speak(pickSay(n));
      return;
    }

    var right = 10 - cur.a;
    if (n !== right) {
      attempts++;
      shake(tile);
      if (attempts >= 2) {
        busy = true;
        speak(notSay(n, true), function () {
          countEmpty(function () { busy = false; });
        });
        /* never leave the tiles locked */
        setTimeout(function () { busy = false; }, 16000);
      } else {
        speak(notSay(n, false));
      }
      return;
    }

    attempts = 0;
    clearLit();
    cur.b = right;
    setBox('b', right, 'done');
    renderFrame(cur.a, right);
    finishBond();
  }

  function finishBond() {
    busy = true;
    mode = 'finished';
    done.push({ a: cur.a, b: cur.b });
    if (phase === 3) picks.push(cur.a);
    footballs++;
    save();
    renderScore(true);
    celebrate(22);
    stripMark(null, phase < 3 ? cur.a : null);
    els.lead.innerHTML = 'GOAL! ⚽ 10 = <span class="r">' + cur.a + '</span> + <span class="y">' + cur.b + '</span>';
    var last = round === roundsIn(phase) - 1;
    els.nextBtn.textContent = !last ? 'Next ➜' : phase === 1 ? 'Half time ➜' : phase === 2 ? 'Penalties ➜' : 'Full time ➜';
    show(['strip', 'lead', 'eq', 'frame', 'btnRow'], ['sayBtn', 'countBtn', 'nextBtn']);
    speak(goalSay(cur.a, cur.b));
  }

  function nextRound() {
    stopAll();
    if (mode === 'example') { phase = 1; round = 0; enterRound(); return; }
    round++;
    if (round >= roundsIn(phase)) {
      if (phase === 1) { enterHalfTime(); return; }
      if (phase === 2) { phase = 3; round = 0; enterRound(); return; }
      enterFullTime();
      return;
    }
    enterRound();
  }

  /* ================= Board ================= */
  function renderBoard() {
    els.board.innerHTML = '';
    done.forEach(function (m, i) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.innerHTML = '<span class="t">10</span> = <span class="r">' + m.a +
        '</span> + <span class="y">' + m.b + '</span>';
      b.addEventListener('click', function () { sayChip(i); });
      els.board.appendChild(b);
    });
  }

  function sayChip(i) {
    stopAll();
    var chips = els.board.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i);
    speak(bondSay(done[i].a, done[i].b), function () { if (chips[i]) chips[i].classList.remove('saying'); });
  }

  function sayAll() {
    var chips = els.board.querySelectorAll('.chip');
    var list = [];
    done.forEach(function (m, i) {
      list.push({
        act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.toggle('saying', c === i); },
        say: bondSay(m.a, m.b)
      });
    });
    list.push({ act: function () { for (var c = 0; c < chips.length; c++) chips[c].classList.remove('saying'); } });
    sequence(list);
  }

  function enterHalfTime() {
    mode = 'board';
    els.half.textContent = 'Half time';
    els.boardTitle.textContent = '📣 Half time!';
    els.boardText.textContent = done.length + ' ⚽';
    els.boardBtn.textContent = 'Second half ➜';
    boardNext = function () { phase = 2; round = 0; enterRound(); };
    renderBoard();
    show(['boardBox']);
    speak(halfTimeSay(done.length));
  }

  function enterFullTime() {
    mode = 'board';
    els.half.textContent = 'Full time';
    els.boardTitle.textContent = '🏆 Full time!';
    els.boardText.textContent = done.length + ' number bonds · ' + done.length + ' ⚽';
    els.boardBtn.textContent = 'Play again ⚽';
    boardNext = startMatch;
    renderBoard();
    show(['boardBox']);
    celebrate(45);
    speak(fullTimeSay(done.length));
  }

  /* ================= Match ================= */
  function startMatch() {
    stopAll();
    queue1 = shuffle(ROW1);
    queue2 = shuffle(ROW2);
    done = [];
    picks = [];
    phase = 1;
    round = 0;
    enterExample();
  }

  /* ================= Wiring ================= */
  els.playBtn.addEventListener('click', function () {
    audioReady();               /* iOS: the audio has to start inside this tap */
    if (hasSpeech) {
      pickVoice();
      /* iOS: speech has to start inside this tap */
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
    }
    preload(phraseList());
    els.startOverlay.remove();
    startMatch();
  });

  /* tapping the ten frame counts the empty spaces */
  function tapFrame() {
    if (mode === 'start' || mode === 'board' || (mode === 'round' && busy)) return;
    countEmpty();
  }
  els.frame.addEventListener('click', tapFrame);
  els.countBtn.addEventListener('click', tapFrame);
  els.boxT.addEventListener('click', function () { tapBox('t'); });
  els.boxA.addEventListener('click', function () { tapBox('a'); });
  els.boxB.addEventListener('click', function () { tapBox('b'); });

  els.sayBtn.addEventListener('click', function () {
    if (mode === 'example') { playExample(); return; }
    if (mode === 'round' && busy) return;
    stopAll();
    if (mode === 'finished') speak(goalSay(cur.a, cur.b));
    else if (mode === 'round') speak(currentAsk());
  });
  els.nextBtn.addEventListener('click', nextRound);

  els.boardSayBtn.addEventListener('click', sayAll);
  els.boardBtn.addEventListener('click', function () {
    stopAll();
    if (boardNext) boardNext();
  });

  els.settingsBtn.addEventListener('click', function () {
    els.settingsPanel.classList.toggle('hidden');
  });
  els.slowToggle.checked = slow;
  els.slowToggle.addEventListener('change', function () {
    slow = this.checked;
    save();
    els.settingsPanel.classList.add('hidden');
  });
  els.resetBtn.addEventListener('click', function () {
    if (confirm('Reset all footballs?')) {
      footballs = 0;
      save();
      renderScore(false);
      els.settingsPanel.classList.add('hidden');
    }
  });

  buildStrip();
  buildTiles();
  renderScore(false);
})();
</script>
</body>
</html>
