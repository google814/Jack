<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2b53">
<title>Jack's Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #1d2b53 0%, #2a3d7c 55%, #1d2b53 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
    padding: 4vh 4vw calc(4vh + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 4rem);
    text-shadow: 0 4px 14px rgba(0,0,0,.4);
    letter-spacing: .02em;
  }
  .games {
    display: flex;
    flex-wrap: wrap;
    gap: 4vmin;
    justify-content: center;
    width: 100%;
    max-width: 1100px;
  }
  a.game {
    flex: 1 1 320px;
    max-width: 480px;
    min-height: 42vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vh;
    text-decoration: none;
    color: #fff;
    border-radius: 32px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.game:hover { transform: scale(1.04); box-shadow: 0 18px 44px rgba(0,0,0,.45); }
  a.game:active { transform: scale(.97); }
  .game .icon { font-size: clamp(5rem, 14vmin, 9rem); line-height: 1; }
  .game .label {
    font-size: clamp(1.5rem, 4vmin, 2.4rem);
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .chess { background: linear-gradient(145deg, #7c3aed, #4c1d95); }
  .words { background: linear-gradient(145deg, #10b981, #047857); }
  .numbers { background: linear-gradient(145deg, #f59e0b, #b45309); }
</style>
</head>
<body>
  <h1>⭐ Jack's Games ⭐</h1>
  <div class="games">
    <a class="game words" href="reading-game/">
      <span class="icon">⚽📖</span>
      <span class="label">Jack's Words</span>
    </a>
    <a class="game numbers" href="math-game/">
      <span class="icon">⚽🔢</span>
      <span class="label">Jack's Numbers</span>
    </a>
    <a class="game chess" href="chess/">
      <span class="icon">♟️</span>
      <span class="label">Jackies Schach</span>
    </a>
  </div>
</body>
</html>
